appId: twinkler
tags:
  - reminders
  - prepared
---
# REM-004 + REM-011 + REM-013: the reminder fires at the configured time,
# shows up as a banner over the open app, and arrives on the prayer day.
#
# Preconditions: permission granted (ios-rem-001 run); /tmp/rem-set-time.yaml
# is generated with a single now+4min target (rounded to a multiple of 5):
# gen-rem-set-time.mjs HH:MM.
- launchApp:
    stopApp: true
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "reminders-toggle"
    direction: DOWN
- assertVisible:
    id: "reminders-toggle"
    checked: true
# Set the nearest time.
- tapOn:
    id: "reminders-settings-button-0"
- assertVisible:
    id: "reminders-editor-modal"
- runFlow:
    file: /tmp/rem-set-time.yaml
- tapOn:
    id: "reminders-editor-done"
- assertVisible: ".*Настроить расписание 1: Каждый день:.*"

# REM-013: first, a prayer on the same day. The setup is idempotent: eraseText
# clears the saved goal if there is one.
- openLink: "lampada://"
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- eraseText
- inputText: "REM 004 fire"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible:
    id: "threshold-kicker"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
# Accumulate elapsed_sec > 0, otherwise the session will not reach the diary.
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    point: "10%,11%"
# Back leads to the summary screen: the «Завершить» button (or the
# «ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ» dialog with its own «Завершить» button in older
# builds).
- assertVisible:
    id: "reflect-complete-button"
- runFlow:
    when:
      visible:
        id: "reflect-kicker"
    commands:
      - tapOn:
          id: "reflect-complete-button"
- runFlow:
    when:
      visible:
        id: "reflect-return-button"
    commands:
      - tapOn:
          id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"

# REM-004/011: the app is open on Home — the banner should appear at T1.
# The firing is captured by run-rem-fire.sh with a screenshot (simctl io screenshot):
# the banner lives in SpringBoard and never appears in the app's accessibility tree.
- openLink: "lampada://"
- assertVisible:
    id: "start-prayer-button"
