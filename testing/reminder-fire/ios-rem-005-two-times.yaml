appId: twinkler
tags:
  - reminders
  - prepared
---
# REM-005: several times in one rule — the schedule row renders correctly,
# and a notification fires for each configured time.
#
# Preconditions: the ios-rem-fire run has completed (the rule has one time row,
# the initial time is known); /tmp/rem-set-time.yaml is generated with two
# targets, now+4min and now+9min: gen-rem-set-time.mjs --init <current> HH:MM HH:MM.
- launchApp:
    stopApp: true
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "reminders-toggle"
    direction: DOWN
- tapOn:
    id: "reminders-settings-button-0"
- assertVisible:
    id: "reminders-editor-modal"
- runFlow:
    file: /tmp/rem-set-time.yaml
- tapOn:
    id: "reminders-editor-done"
- waitForAnimationToEnd:
    timeout: 5000
# The schedule row shows both times (values passed via -e REM_T1/REM_T2).
- assertVisible: ".*${REM_T1}.*"
- assertVisible: ".*${REM_T2}.*"
- openLink: "lampada://"
- assertVisible:
    id: "start-prayer-button"
# Firings at both times are captured by run-rem-fire.sh with screenshots.
