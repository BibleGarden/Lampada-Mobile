appId: twinkler
tags:
  - reminders
  - prepared
---
# REM-008: turning the toggle off cancels all scheduled notifications —
# nothing arrives after it is switched off.
#
# Preconditions: the ios-rem-005 run (two time rows); /tmp/rem-set-time.yaml
# is generated with a single now+4min target for the first row:
# gen-rem-set-time.mjs --init <current first time> HH:MM.
- launchApp:
    stopApp: true
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "reminders-toggle"
    direction: DOWN
# The nearest time is scheduled, the toggle is on.
- tapOn:
    id: "reminders-settings-button-0"
- assertVisible:
    id: "reminders-editor-modal"
- runFlow:
    file: /tmp/rem-set-time.yaml
- tapOn:
    id: "reminders-editor-done"
- assertVisible:
    id: "reminders-toggle"
    checked: true
# Switched off: the scheduler cancels all of its notifications.
- tapOn:
    id: "reminders-toggle"
- assertVisible:
    id: "reminders-toggle"
    checked: false
- openLink: "lampada://"
# The runner captures a screenshot at target + 4 s — the same window in which
# it records positive REM-004/005 firings. The SpringBoard banner is not
# accessible to Maestro.
