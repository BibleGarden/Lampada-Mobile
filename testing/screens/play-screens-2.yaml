appId: app.lampada
---
# Part 2 (07-08): the five-minute prayer may finish while Maestro starts this flow.
- runFlow:
    when:
      visible:
        id: session-finish-button
    commands:
      - tapOn:
          id: session-finish-button
- assertVisible:
    id: reflection-input
- tapOn:
    id: reflection-input
- inputText: ${TAKEAWAY}
- tapOn:
    id: reflect-question
- waitForAnimationToEnd:
    timeout: 2000
- swipe:
    start: 50%, 80%
    end: 50%, 74%
    duration: 400
- takeScreenshot: 07-reflection
- tapOn:
    id: reflect-complete-button
- tapOn:
    id: journal-button
- tapOn: "${TOPIC_RE}"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-history
