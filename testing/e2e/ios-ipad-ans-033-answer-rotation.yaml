appId: twinkler
tags:
  - ipad
---
# ANS-033 (iPad): ответ в ландшафте — вопрос и форма в разных колонках,
# действия видны при открытой клавиатуре; повороты ландшафт→портрет→ландшафт
# сохраняют введённый текст дословно и перестраивают раскладку.
- launchApp:
    stopApp: true
    clearState: true
- setOrientation: LANDSCAPE_LEFT
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "ANS-033 ответ на iPad"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- longPressOn:
    id: "threshold-hold-button"
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-answer-button"
- assertVisible:
    id: "answer-input"
    rightOf:
      id: "answer-question"
- tapOn:
    id: "answer-input"
- inputText: "ANS-033 текст переживает поворот"
- assertVisible:
    id: "answer-save-button"
- takeScreenshot: ANS-033-answer-landscape-keyboard
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "answer-input"
    text: "ANS-033 текст переживает поворот"
- assertVisible:
    id: "answer-input"
    below:
      id: "answer-question"
- assertVisible:
    id: "answer-save-button"
- takeScreenshot: ANS-033-answer-portrait
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "answer-input"
    text: "ANS-033 текст переживает поворот"
- assertVisible:
    id: "answer-input"
    rightOf:
      id: "answer-question"
- takeScreenshot: ANS-033-answer-landscape-again
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- tapOn:
    id: "dock-answer-edit-button"
- assertVisible:
    id: "answer-input"
    text: "ANS-033 текст переживает поворот"
