appId: twinkler
# NEEDS-STUB: избранное проверяется между разными молитвами — отрывки второй
# молитвы отличаются от первой (живой сервер), ассерт «В избранном» недостижим.
# Требуется переработка под stub-фикстуры (86cbj95j4). В теговые прогоны не входит.
---
# SCR-002: favorite state must be restored from SQLite after app relaunch.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-002 favorite relaunch"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- tapOn:
    id: "dock-scripture-favorite"
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: SCR-002-before-relaunch
- stopApp
- launchApp:
    stopApp: false
    clearState: false
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-002 favorite restored"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: SCR-002-after-relaunch
- tapOn:
    id: "dock-scripture-favorite-active"
- assertVisible:
    id: "dock-scripture-favorite"
- stopApp
- launchApp:
    stopApp: false
    clearState: false
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-002 favorite removed"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- assertVisible:
    id: "dock-scripture-favorite"
- takeScreenshot: SCR-002-removed-after-relaunch
