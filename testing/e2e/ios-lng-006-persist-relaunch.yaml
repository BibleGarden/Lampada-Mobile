appId: twinkler
tags:
  - prepared
# NEEDS-RUNNER: the device locale is switched between flows by run-lng.sh
# (the order and locales are hardcoded in the script). Not part of tagged runs.
---
# LNG-006: an explicit language choice survives a cold start.
#
# Precondition: the simulator is on locale=en_US, so the saved uk differs from
# the device language. The next flow, ios-lng-007-choice-survives-locale.yaml,
# must run right after this one: it reads the same container on a different
# locale and must not run clearState.
- launchApp:
    stopApp: true
    clearState: true
    # Lampada does not use geolocation; the explicit list keeps Maestro from
    # poking locationd (simctl privacy location) right after a cold reboot,
    # where locationd hangs.
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: "settings-button"
- tapOn:
    id: "interface-language-picker"
- tapOn:
    id: "interface-language-uk"
- assertVisible:
    id: "interface-language-picker"
    text: ".*Українська.*"
- assertVisible: "НАЛАШТУВАННЯ"
- launchApp:
    stopApp: true
    # Lampada does not use geolocation; the explicit list keeps Maestro from
    # poking locationd (simctl privacy location) right after a cold reboot,
    # where locationd hangs.
    permissions:
      notifications: allow
      microphone: allow
- assertVisible: "Почати молитву"
- tapOn:
    id: "settings-button"
- assertVisible:
    id: "interface-language-picker"
    text: ".*Українська.*"
- assertVisible: "НАЛАШТУВАННЯ"
