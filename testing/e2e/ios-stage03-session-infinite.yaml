appId: twinkler
---
- launchApp:
    stopApp: true
    clearState: true
- tapOn: "Начать молитву"
- tapOn:
    point: "50%,37%"
- inputText: "SES-002 infinite timer"
- hideKeyboard
- tapOn: "∞"
- tapOn: "Далее"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible: ".*столько времени, сколько нужно.*"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "МОЛИТВА"
- assertVisible: "идёт"
- assertVisible: "0:0[2-9]"
- assertNotVisible: "ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ"
- tapOn:
    point: "10%,11%"
- assertVisible: "ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ"
