appId: twinkler
tags:
  - main
---
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SES-002 infinite timer"
- pressKey: Enter
- tapOn:
    id: "setup-preset-0"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible: ".*Без таймера и спешки.*"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
# the timer button is announced as one line «0:21, ИДЁТ»: the elapsed time
# and the uppercase «идёт» label (screens.session.elapsed); there is no
# countdown without a timer
- assertVisible: "\\d+:\\d\\d, ИДЁТ"
- assertNotVisible:
    id: "reflect-kicker"
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
