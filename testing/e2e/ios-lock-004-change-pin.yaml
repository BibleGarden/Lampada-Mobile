appId: twinkler
tags:
  - prepared
---
# LOCK-004: changing the PIN 123456 → 9876. The new code is shorter than the
# old one, which also verifies that the unlock screen re-reads the length:
# after the change it expects four digits, not six.
#
# Precondition: PIN 123456 enabled (state after ios-lock-002).
- launchApp:
    stopApp: true
- assertVisible:
    id: "lock-screen"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"
- assertVisible:
    id: "start-prayer-button"

- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "change-pin-button"
    direction: DOWN
- tapOn:
    id: "change-pin-button"

# Current code: the length is known, no confirmation required.
- assertVisible:
    id: "pin-prompt-change-current"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"

# New four-digit code — the minimum allowed length.
- assertVisible:
    id: "pin-prompt-change-create"
- tapOn:
    id: "pin-key-9"
- tapOn:
    id: "pin-key-8"
- tapOn:
    id: "pin-key-7"
- tapOn:
    id: "pin-key-6"
- tapOn:
    id: "pin-key-confirm"

- assertVisible:
    id: "pin-prompt-change-repeat"
- tapOn:
    id: "pin-key-9"
- tapOn:
    id: "pin-key-8"
- tapOn:
    id: "pin-key-7"
- tapOn:
    id: "pin-key-6"
- tapOn:
    id: "pin-key-confirm"
- assertNotVisible:
    id: "pin-prompt"
- assertVisible:
    id: "change-pin-button"

# After the restart the old code no longer works and the new one unlocks. The
# full old code can no longer be entered: the field expects four digits and
# validates the entry on the fourth.
- launchApp:
    stopApp: true
- assertVisible:
    id: "lock-screen"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- extendedWaitUntil:
    visible: "Неверный пин-код"
    timeout: 5000
- assertVisible:
    id: "lock-screen"

- tapOn:
    id: "pin-key-9"
- tapOn:
    id: "pin-key-8"
- tapOn:
    id: "pin-key-7"
- tapOn:
    id: "pin-key-6"
- extendedWaitUntil:
    notVisible:
      id: "lock-screen"
    timeout: 5000
- assertVisible:
    id: "start-prayer-button"
