appId: twinkler
tags:
  - prepared
# NEEDS-STUB: the stub /api/version-check with update_type=hard
# (run-stub-phase.sh). Not included in tagged runs.
---
# Hard update: a banner without "later" that survives a restart.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: update-hard
    timeout: 20000
- assertVisible:
    id: "update-hard"
- assertNotVisible:
    id: update-later
- takeScreenshot: UPDATE-hard-banner
# Switching screens does not remove the hard banner.
- openLink: "lampada://settings"
- assertVisible:
    id: update-hard
- openLink: "lampada://"
- assertVisible:
    id: update-hard
# Cold start: the banner again.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: update-hard
    timeout: 20000
- takeScreenshot: UPDATE-hard-relaunch
