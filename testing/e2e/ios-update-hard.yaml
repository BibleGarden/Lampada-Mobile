- extendedWaitUntil:
    visible:
      id: update-hard
    timeout: 20000
- assertVisible: "Обнови Лампаду"
- assertNotVisible:
    id: update-later
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-09-20-stub/UPDATE-hard-banner
# Смена экрана не снимает жёсткий баннер.
- openLink: "lampada://settings"
- assertVisible:
    id: update-hard
- openLink: "lampada://"
- assertVisible:
    id: update-hard
# Холодный старт: баннер снова.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: update-hard
    timeout: 20000
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-09-20-stub/UPDATE-hard-relaunch
