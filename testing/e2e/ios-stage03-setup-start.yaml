appId: twinkler
tags:
  - critical
---
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
# число и единица — один элемент доступности: VoiceOver читает их фразой
- assertVisible:
    id: "setup-duration-value"
    text: "10 минут"
- tapOn:
    id: "setup-examples-button"
- assertVisible:
    id: "setup-example-0"
- tapOn:
    id: "setup-example-0"
- assertVisible: "Поблагодарить Бога"
- tapOn:
    id: "setup-examples-button"
- tapOn:
    id: "setup-example-1"
- assertVisible: "Привести мысли в порядок"
- tapOn:
    id: "setup-examples-button"
- tapOn:
    id: "setup-example-2"
- assertVisible: "Принять важное решение"
- tapOn:
    id: "setup-examples-button"
- tapOn:
    id: "setup-example-3"
- assertVisible: "Подготовиться к разговору"
- tapOn: "Подготовиться к разговору"
- eraseText: 100
- hideKeyboard
- tapOn: "5"
- assertVisible:
    id: "setup-duration-value"
    text: "5 минут"
- tapOn: "15"
- assertVisible:
    id: "setup-duration-value"
    text: "15 минут"
- tapOn: "30"
- assertVisible:
    id: "setup-duration-value"
    text: "30 минут"
- tapOn:
    id: "setup-preset-60"
- assertVisible:
    id: "setup-duration-value"
    text: "60 минут"
- tapOn: "∞"
- assertVisible:
    id: "setup-duration-value"
    text: "без таймера"
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible: ".*Впереди — 5 минут наедине с Богом.*"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 450
- assertVisible:
    id: "threshold-hold-button"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
# кикер «цель» и тема VoiceOver читает одной фразой
- assertVisible:
    id: "session-goal"
    text: ".*Свободная молитва — без конкретной темы"
