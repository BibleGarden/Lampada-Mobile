appId: twinkler
tags:
  - critical
---
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- assertVisible: "10"
- assertVisible: "минут"
- tapOn: "?"
- assertVisible:
    id: "setup-example-0"
- tapOn:
    id: "setup-example-0"
- assertVisible: "Поблагодарить Бога"
- tapOn: "?"
- tapOn:
    id: "setup-example-1"
- assertVisible: "Привести мысли в порядок"
- tapOn: "?"
- tapOn:
    id: "setup-example-2"
- assertVisible: "Принять важное решение"
- tapOn: "?"
- tapOn:
    id: "setup-example-3"
- assertVisible: "Подготовиться к разговору"
- tapOn: "Подготовиться к разговору"
- eraseText: 100
- hideKeyboard
- tapOn: "5"
- assertVisible: "5"
- assertVisible: "минут"
- tapOn: "15"
- assertVisible: "15"
- tapOn: "30"
- assertVisible: "30"
- tapOn:
    id: "setup-preset-60"
- assertVisible: "60"
- tapOn: "∞"
- assertVisible: "без таймера"
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible: ".*Впереди — 5 минут наедине с Богом.*"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 450
- assertVisible:
    id: "threshold-hold-button"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- assertVisible: "Свободная молитва — без конкретной темы"
