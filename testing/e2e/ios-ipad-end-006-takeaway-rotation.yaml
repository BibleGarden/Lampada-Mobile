appId: twinkler
tags:
  - ipad
---
# END-006 (iPad): вывод вводится при открытой клавиатуре — действия
# «Завершить»/«Вернуться» скрыты; поворот портрет→ландшафт→портрет во время
# ввода сохраняет текст дословно; тапы по левому и правому полю вне колонки и
# по вопросу закрывают клавиатуру и возвращают действия без потери текста.
#
# Видимость клавиатуры — по нелокализованному идентификатору клавиши `shift`
# (см. ios-stage03-long-goal.yaml). Экранную клавиатуру поднимает `inputText`:
# при подключённой аппаратной клавиатуре симулятора тап по полю только ставит
# фокус, поэтому каждый цикл начинается с ввода. Тап по полю ставит курсор в
# точку тапа, а не в конец текста, поэтому исходные части фразы и дописанные
# числа проверяются независимо от их позиции, а не в порядке вставки.
- launchApp:
    stopApp: true
    clearState: true
- setOrientation: PORTRAIT
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "END-006 вывод на iPad"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- longPressOn:
    id: "threshold-hold-button"
- assertVisible:
    id: "session-title"
- tapOn:
    id: "session-finish-button"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflection-input"
- inputText: "END-006 первая часть"
- assertNotVisible:
    id: "reflect-complete-button"
- assertNotVisible:
    id: "reflect-return-button"
- takeScreenshot: END-006-reflect-portrait-keyboard
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
# поворот посреди ввода: дописываем после поворота
- inputText: " и вторая"
- assertVisible:
    id: "reflection-input"
    text: "END-006 первая часть и вторая"
- assertNotVisible:
    id: "reflect-complete-button"
- takeScreenshot: END-006-reflect-landscape-keyboard
- assertVisible:
    id: "shift"
- tapOn:
    point: "3%,40%"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "reflect-complete-button"
- tapOn:
    id: "reflection-input"
- inputText: " 3"
- assertVisible:
    id: "shift"
- tapOn:
    point: "97%,40%"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "reflect-complete-button"
- tapOn:
    id: "reflection-input"
- inputText: " 4"
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "reflection-input"
    text: "(?s)^(?=.*END-006)(?=.*первая)(?=.*вторая)(?=.* 3)(?=.* 4).*$"
- assertVisible:
    id: "shift"
- tapOn:
    point: "3%,30%"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "reflect-complete-button"
- tapOn:
    id: "reflection-input"
- inputText: " 5"
- assertVisible:
    id: "shift"
- tapOn:
    point: "97%,30%"
- assertNotVisible:
    id: "shift"
- tapOn:
    id: "reflection-input"
- inputText: " 6"
- assertVisible:
    id: "shift"
- tapOn:
    id: "reflect-question"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "reflect-complete-button"
- assertVisible:
    id: "reflect-return-button"
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "reflection-input"
    text: "(?s)^(?=.*END-006)(?=.*первая)(?=.*вторая)(?=.* 3)(?=.* 4)(?=.* 5)(?=.* 6).*$"
- assertVisible:
    id: "reflect-complete-button"
- takeScreenshot: END-006-reflect-landscape-actions
- setOrientation: PORTRAIT
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
- tapOn:
    id: "journal-button"
- assertVisible: ".*END-006 первая часть.* и вторая.*"
