appId: twinkler
tags:
  - ipad
---
# END-006 (iPad): the takeaway is typed with the keyboard open — the
# «Завершить»/«Вернуться» actions (screens.reflect.finish/return) are hidden;
# rotating portrait→landscape→portrait while typing preserves the text
# verbatim; taps on the left and right margins outside the column and on the
# question close the keyboard and bring the actions back without losing text.
#
# Keyboard visibility is checked via the locale-independent `shift` key
# identifier (see ios-stage03-long-goal.yaml). The on-screen keyboard is raised
# by `inputText`: with the simulator's hardware keyboard connected, tapping the
# field only focuses it, so every cycle starts with typing. A tap on the field
# places the cursor at the tap point rather than at the end of the text, so the
# original parts of the phrase and the appended digits are checked independently
# of their position, not in insertion order.
- launchApp:
    stopApp: true
    clearState: true
- setOrientation: PORTRAIT
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "END-006 вывод на iPad"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- longPressOn:
    id: "threshold-hold-button"
- assertVisible:
    id: "session-title"
- tapOn:
    id: "session-finish-button"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflection-input"
- inputText: "END-006 первая часть"
- assertNotVisible:
    id: "reflect-complete-button"
- assertNotVisible:
    id: "reflect-return-button"
- takeScreenshot: END-006-reflect-portrait-keyboard
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
# rotation in the middle of typing: continue typing after the rotation
- inputText: " и вторая"
- assertVisible:
    id: "reflection-input"
    text: "END-006 первая часть и вторая"
- assertNotVisible:
    id: "reflect-complete-button"
- takeScreenshot: END-006-reflect-landscape-keyboard
- assertVisible:
    id: "shift"
- tapOn:
    point: "3%,40%"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "reflection-input"
    text: "END-006 первая часть и вторая"
- assertVisible:
    id: "reflect-complete-button"
- tapOn:
    id: "reflection-input"
- inputText: " 3"
- assertVisible:
    id: "shift"
- tapOn:
    point: "97%,40%"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "reflect-complete-button"
- tapOn:
    id: "reflection-input"
- inputText: " 4"
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "reflection-input"
    text: "(?s)^(?=.*END-006)(?=.*первая)(?=.*вторая)(?=.* 3)(?=.* 4).*$"
- assertVisible:
    id: "shift"
- tapOn:
    point: "3%,30%"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "reflect-complete-button"
- tapOn:
    id: "reflection-input"
- inputText: " 5"
- assertVisible:
    id: "shift"
- tapOn:
    point: "97%,30%"
- assertNotVisible:
    id: "shift"
- tapOn:
    id: "reflection-input"
- inputText: " 6"
- assertVisible:
    id: "shift"
- tapOn:
    id: "reflect-question"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "reflect-complete-button"
- assertVisible:
    id: "reflect-return-button"
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "reflection-input"
    text: "(?s)^(?=.*END-006)(?=.*первая)(?=.*вторая)(?=.* 3)(?=.* 4)(?=.* 5)(?=.* 6).*$"
- assertVisible:
    id: "reflect-complete-button"
- takeScreenshot: END-006-reflect-landscape-actions
- setOrientation: PORTRAIT
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
- tapOn:
    id: "journal-button"
- assertVisible: ".*END-006 первая часть.* и вторая.*"
