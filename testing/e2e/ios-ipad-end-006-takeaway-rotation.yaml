appId: twinkler
tags:
  - ipad
---
# END-006 (iPad): вывод вводится при открытой клавиатуре — действия
# «Завершить»/«Вернуться» скрыты; поворот портрет→ландшафт→портрет во время
# ввода сохраняет текст дословно; тап мимо поля возвращает действия.
- launchApp:
    stopApp: true
    clearState: true
- setOrientation: PORTRAIT
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "END-006 вывод на iPad"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- longPressOn:
    id: "threshold-hold-button"
- assertVisible:
    id: "session-title"
- tapOn:
    id: "session-finish-button"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflection-input"
- inputText: "END-006 первая часть"
- assertNotVisible:
    id: "reflect-complete-button"
- assertNotVisible:
    id: "reflect-return-button"
- takeScreenshot: END-006-reflect-portrait-keyboard
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
# поворот посреди ввода: дописываем после поворота
- inputText: " и вторая"
- assertVisible:
    id: "reflection-input"
    text: "END-006 первая часть и вторая"
- assertNotVisible:
    id: "reflect-complete-button"
- takeScreenshot: END-006-reflect-landscape-keyboard
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "reflection-input"
    text: "END-006 первая часть и вторая"
# тап мимо поля (по вопросу) закрывает клавиатуру и возвращает действия без
# потери текста. Повторно клавиатуру не открываем: после аппаратного Enter
# (pressKey) симулятор iPad перестаёт показывать экранную клавиатуру.
- tapOn:
    id: "reflect-question"
- assertVisible:
    id: "reflect-complete-button"
- assertVisible:
    id: "reflect-return-button"
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "reflection-input"
    text: "END-006 первая часть и вторая"
- assertVisible:
    id: "reflect-complete-button"
- takeScreenshot: END-006-reflect-landscape-actions
- setOrientation: PORTRAIT
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
- tapOn:
    id: "journal-button"
- assertVisible: ".*END-006 первая часть и вторая.*"
