appId: twinkler
tags:
  - prepared
---
# LOCK-007: the code is requested after a minute in the background, but not
# after a brief switch to another app.
#
# The return is done by tapping the icon on the springboard, not `launchApp`:
# launchApp brings the process up anew, and the lock screen would appear just
# like on a cold start — the check would become meaningless. The sign that the
# process really survived: after returning, the app stays on the journal, not
# on the home screen.
#
# The pause is a deliberately false wait with `optional: true`: Maestro has no
# sleep command of its own.
#
# Precondition: protection disabled. The privacy curtain in the app switcher is
# not automatable and is checked manually — see the report.
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "start-prayer-button"
# An explicit precondition check. Lock overlays are modal for the accessibility
# tree (accessibilityViewIsModal), so the check also catches a regression of
# that modality, not only the protection state.
- assertNotVisible:
    id: "lock-screen"

# Enable PIN 4321.
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
- tapOn:
    id: "lock-toggle"
- assertVisible:
    id: "pin-prompt-enable-create"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-confirm"
- assertVisible:
    id: "pin-prompt-enable-repeat"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-confirm"
- assertVisible:
    id: "change-pin-button"

# Navigate to a screen that a cold start would not restore.
- tapOn:
    point: "10%,11%"
- tapOn:
    id: "journal-button"
- runFlow:
    when:
      notVisible:
        id: "journal-title"
    commands:
      - tapOn:
          id: "journal-button"
- assertVisible:
    id: "journal-title"

# A brief switch does not request the code.
- pressKey: Home
- extendedWaitUntil:
    visible: "ЗАВЕДОМО-ЛОЖНЫЙ-МАРКЕР-ПАУЗЫ"
    timeout: 10000
    optional: true
- tapOn: "Лампада"
- assertVisible:
    id: "journal-title"
- assertNotVisible:
    id: "lock-screen"

# Over a minute in the background — the code is requested.
- pressKey: Home
- extendedWaitUntil:
    visible: "ЗАВЕДОМО-ЛОЖНЫЙ-МАРКЕР-ПАУЗЫ"
    timeout: 70000
    optional: true
- tapOn: "Лампада"
- extendedWaitUntil:
    visible:
      id: "lock-screen"
    timeout: 10000
- assertVisible:
    id: "lock-pin-title"

# Same process: after entering the code the app stays on the journal.
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-1"
- extendedWaitUntil:
    notVisible:
      id: "lock-screen"
    timeout: 5000
- assertVisible:
    id: "journal-title"

# Cleanup: return the app to the unprotected state.
- tapOn:
    point: "10%,11%"
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
- tapOn:
    id: "lock-toggle"
- assertVisible:
    id: "pin-prompt-disable-current"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-1"
- extendedWaitUntil:
    notVisible:
      id: "pin-prompt"
    timeout: 5000
- assertNotVisible:
    id: "change-pin-button"
