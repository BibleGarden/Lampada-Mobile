appId: twinkler
tags:
  - critical
---
# The keyboard is closed with the Enter key (returnKeyType="done" +
# submitBehavior="blurAndSubmit" on the goal field: entry blurs the field
# rather than inserting a newline; the key label depends on the layout), not
# with `hideKeyboard`: on iOS 26.5 / Maestro 2.6.1 the latter closes with a
# downward swipe and drags the prayer setup sheet away together with the
# keyboard. The same trick is used in testing/e2e/ios-lock-*.yaml.
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "Финальный smoke"
- pressKey: Enter
- assertVisible: "Финальный smoke"
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible: ".*5 минут.*финальный smoke.*"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 450
- assertVisible:
    id: "threshold-hold-button"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- assertVisible:
    id: "dock-answer-button"
# The repeated tap guards against a dev-build defect: a LogBox banner over the
# lower part of the screen swallows the first tap. Both known warning sources
# are fixed (the deprecated Skia API on the home screen, the one-sided dashed
# border on the prayer screen, 86cbbqzcj); the branch is usually skipped, and
# the retry stays in case of new warnings. A repeat, not `doubleTapOn`: two
# quick taps manage to both open the sheet and close it right back.
- tapOn:
    id: "dock-answer-button"
- runFlow:
    when:
      notVisible:
        id: "answer-input"
    commands:
      - tapOn:
          id: "dock-answer-button"
- assertVisible:
    id: "answer-input"
- tapOn:
    id: "answer-input"
- inputText: "Финальный ответ"
# The sheet's buttons are visible with the keyboard open too; no need to
# dismiss it separately.
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertVisible:
    id: "dock-answer-edit-button"
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflection-input"
- inputText: "Финальный вывод"
- pressKey: Enter
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
# The takeaway quotation is no longer shown on Home (ADR-0028: finishing goes
# straight to Home); its presence is checked below in the journal and in
# smoke-full-relaunch.
- assertVisible:
    id: "journal-button"
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- assertVisible: ".*Финальный smoke.*"
- tapOn: ".*Финальный smoke.*"
- assertVisible: ".*Финальный ответ.*"
- assertVisible: ".*Финальный вывод.*"
