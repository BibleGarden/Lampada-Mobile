appId: twinkler
tags:
  - prepared
# NEEDS-STUB: questionDelayMs=15000 is set by run-stub-phase.sh; the answer
# arrives after 15 s — later than entering the session. Not included in tagged
# runs.
---
# The AI answer is late: the session opens with a spinner, the question
# appears once the answer has arrived; the ios-stage05-ai-late-response.yaml
# fragment runs inside such a session.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "AI late stub"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
# The first question's pre-request went out on the threshold screen; the
# answer is delayed by 15 s.
- assertVisible:
    id: "threshold-kicker"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
# The question arrives only after the stub has answered. (?s) is dotall: the
# element text wraps onto two lines, and without the flag the dot does not
# cross the newline.
- extendedWaitUntil:
    visible: "(?s).*STUB вопрос с опозданием.*"
    timeout: 40000
- takeScreenshot: AI-late-question-arrived
# The original scenario fragment (see ios-stage05-ai-late-response.yaml).
- runFlow:
    file: ios-stage05-ai-late-response.yaml
