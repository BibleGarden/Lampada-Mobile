appId: twinkler
tags:
  - main
---
# MUS-010: an untimed prayer stops music on explicit finish.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "MUS early finish regression"
- pressKey: Enter
- tapOn:
    id: "setup-preset-0"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-music-off"
- tapOn:
    id: "session-music-off"
- assertVisible:
    id: "music-playing"
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
- assertNotVisible:
    id: "music-playing"
