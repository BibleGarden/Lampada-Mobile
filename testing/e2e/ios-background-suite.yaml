appId: twinkler
---
# Background-suite: the music/music-resume and timer-setup/timer-resume pairs
# have cross-flow dependencies (the app goes to the background and must not
# restart between them) and are excluded from tagged runs.
# Run as a whole: maestro test testing/e2e/ios-background-suite.yaml
- runFlow:
    file: ios-background-music.yaml
- runFlow:
    file: ios-background-music-resume.yaml
- runFlow:
    file: ios-background-timer-setup.yaml
- runFlow:
    file: ios-background-timer-resume.yaml
