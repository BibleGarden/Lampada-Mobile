appId: twinkler
tags:
  - main
---
# Run against scripts/scripture-stub.mjs with EXPO_PUBLIC_SCRIPTURE_SELECT_URL.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "Нужна поддержка"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible: ".*22:1.*6.*"
    timeout: 10000
- assertVisible:
    id: "scripture-preview-highlight-2"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-28-scripture-highlight/preview-highlight
- tapOn:
    id: "scripture-read-full"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-28-scripture-highlight/reader-highlight
