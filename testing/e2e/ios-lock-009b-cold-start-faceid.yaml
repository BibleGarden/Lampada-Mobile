appId: twinkler
tags:
  - prepared
# Only through run-lock-biometrics.sh: the script sends pearl.match after the cold start.
---
# LOCK-009 (part 2): with biometrics enabled, a cold start immediately shows
# the Face ID prompt; a match lets the user into the app without the PIN.
#
# Preconditions: PIN 123456, biometrics enabled, a template enrolled
# (ios-lock-009a run via run-lock-biometrics.sh).
- launchApp:
    stopApp: true
# The system prompt hides the app's AX tree: wait for the prompt itself.
- extendedWaitUntil:
    visible:
      id: "com.apple.localauthentication.ax.authentication.alert"
    timeout: 10000
# The automatic Face ID request fires once per screen appearance; the script
# sends the match while the flow sleeps.
- evalScript: "java.lang.Thread.sleep(20000)"
- extendedWaitUntil:
    notVisible:
      id: "com.apple.localauthentication.ax.authentication.alert"
    timeout: 15000
- assertNotVisible:
    id: "lock-screen"
- assertVisible:
    id: "settings-button"
- takeScreenshot: LOCK-009-faceid-unlock
