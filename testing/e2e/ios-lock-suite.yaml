appId: twinkler
---
# LOCK-suite: the lock flows have cross-flow dependencies (002 enables PIN
# 123456, 003/004/005/007 require the PIN enabled) and are excluded from tagged
# runs. Run as a whole: maestro test testing/e2e/ios-lock-suite.yaml
# Order matters: 001 → 002 → 003 → 004 → 005 → 007.
- runFlow:
    file: ios-lock-001-disabled-by-default.yaml
- runFlow:
    file: ios-lock-002-enable-pin.yaml
- runFlow:
    file: ios-lock-003-wrong-and-correct-pin.yaml
- runFlow:
    file: ios-lock-004-change-pin.yaml
- runFlow:
    file: ios-lock-005-disable-pin.yaml
- runFlow:
    file: ios-lock-007-background-timeout.yaml
