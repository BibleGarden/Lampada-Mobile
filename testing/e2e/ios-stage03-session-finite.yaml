appId: twinkler
---
- launchApp:
    stopApp: true
    clearState: true
- tapOn: "Начать молитву"
- tapOn:
    point: "50%,37%"
- inputText: "SES-001 finite timer"
- hideKeyboard
- tapOn: "5"
- tapOn: "Далее"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "МОЛИТВА"
- tapOn:
    point: "50%,29%"
- assertVisible: "−1"
- assertVisible: "+1"
- tapOn: "−1"
- tapOn: "−1"
- tapOn: "−1"
- tapOn: "−1"
- tapOn: "−1"
- extendedWaitUntil:
    visible: "ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ"
    timeout: 10000
- tapOn: "Вернуться к молитве"
- assertVisible: "МОЛИТВА"
- assertVisible: "SES-001 finite timer"
- tapOn:
    id: "session-finish-button"
- assertVisible: "ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ"
