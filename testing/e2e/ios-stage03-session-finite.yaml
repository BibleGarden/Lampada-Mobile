appId: twinkler
tags:
  - critical
---
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- assertNotVisible:
    id: "home-title"
- tapOn:
    point: "50%,37%"
- inputText: "SES-001 finite timer"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- assertNotVisible:
    id: "home-title"
- tapOn:
    point: "50%,29%"
# the ±step buttons have the accessibility label "Subtract/Add N minutes",
# not "−1"
- assertVisible:
    id: "session-time-subtract"
- assertVisible:
    id: "session-time-add"
# The timer keeps running during the actions: once finished, the adjustment
# buttons are gone.
- repeat:
    times: 5
    while:
      visible:
        id: "session-time-subtract"
    commands:
      - tapOn:
          id: "session-time-subtract"
- extendedWaitUntil:
    visible:
      id: "reflect-kicker"
    timeout: 10000
- assertNotVisible:
    id: "session-title"
- tapOn:
    id: "reflect-return-button"
- assertVisible:
    id: "session-title"
# VoiceOver reads the "goal" kicker and the topic as one phrase
- assertVisible:
    id: "session-goal"
    text: ".*SES-001 finite timer"
- tapOn:
    id: "session-finish-button"
- assertVisible:
    id: "reflect-kicker"
