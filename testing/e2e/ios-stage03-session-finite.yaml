appId: twinkler
tags:
  - critical
---
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SES-001 finite timer"
- hideKeyboard
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    point: "50%,29%"
# у кнопок ±шаг голосовая подпись «Убавить/Добавить N минут», а не «−1»
- assertVisible:
    id: "session-time-subtract"
- assertVisible:
    id: "session-time-add"
- tapOn:
    id: "session-time-subtract"
- tapOn:
    id: "session-time-subtract"
- tapOn:
    id: "session-time-subtract"
- tapOn:
    id: "session-time-subtract"
- tapOn:
    id: "session-time-subtract"
- extendedWaitUntil:
    visible:
      id: "reflect-kicker"
    timeout: 10000
- tapOn:
    id: "reflect-return-button"
- assertVisible:
    id: "session-title"
# кикер «цель» и тема VoiceOver читает одной фразой
- assertVisible:
    id: "session-goal"
    text: ".*SES-001 finite timer"
- tapOn:
    id: "session-finish-button"
- assertVisible:
    id: "reflect-kicker"
