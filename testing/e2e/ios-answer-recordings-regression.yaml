appId: twinkler
tags:
  - main
---
# ANS-019/021/022/024: keyboard dismissal, double-tap guard, and two
# consecutive recordings owned by different questions.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "Регрессия голосовых ответов"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recordings-close-button"
- tapOn:
    id: "answer-input"
- inputText: "Клавиатура должна закрыться"
- tapOn:
    id: "answer-record-button"
- assertVisible:
    id: "recordings-record-button"
- doubleTapOn:
    id: "recordings-record-button"
- waitForAnimationToEnd:
    timeout: 2500
- assertVisible:
    id: "recordings-stop-button"
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-1"
- tapOn:
    id: "recordings-close-button"
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertVisible:
    id: "dock-answer-edit-button"
- tapOn:
    point: "84%,91%"
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recordings-close-button"
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertVisible:
    id: "dock-answer-edit-button"
