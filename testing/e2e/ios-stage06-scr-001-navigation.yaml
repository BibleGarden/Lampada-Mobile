appId: twinkler
# NEEDS-STUB: против живого сервера число и порядок отрывков плавают; под stub
# каталог детерминирован — две фикстуры (Псалом 22 и Иакова 1), прогон через
# run-stub-phase.sh (задача 86cbj95j4). В теговые прогоны не входит.
---
# SCR-001: open reader (companion dock, scripture mode) and page forward/backward;
# navigation must stay stable at list boundaries.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-001 navigation"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/SCR-001-00-initial-scripture
# Part A: page forward WITHOUT favoriting anything (frontier should just swap content)
- tapOn:
    id: "dock-scripture-next"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/SCR-001-A1-next
- tapOn:
    id: "dock-scripture-next"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- tapOn:
    id: "dock-scripture-next"
- tapOn:
    id: "dock-scripture-next"
- tapOn:
    id: "dock-scripture-next"
# Part A: try prev after non-favorited forward paging (index should still be 0 -> disabled)
- tapOn:
    id: "dock-scripture-prev"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/SCR-001-A6-prev-after-noop-forward
# Part B: favorite each item while paging forward. Stub cycles two fixtures:
# после двух «вперёд» каталог повторяется, и состояние избранного при повторе
# сохраняется — это и есть граница каталога.
- tapOn:
    id: "dock-scripture-favorite"
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/SCR-001-B00-favorited
- tapOn:
    id: "dock-scripture-next"
- tapOn:
    id: "dock-scripture-favorite"
- assertVisible:
    id: "dock-scripture-favorite-active"
- tapOn:
    id: "dock-scripture-next"
# Каталог исчерпан: тот же отрывок снова, избранное на месте.
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/SCR-001-B10-next-catalog-exhausted
# Part C: обратно к началу; на первом элементе prev не уходит дальше.
- tapOn:
    id: "dock-scripture-prev"
- assertVisible:
    id: "dock-scripture-favorite-active"
- tapOn:
    id: "dock-scripture-prev"
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/SCR-001-C10-prev-at-start
# Prev на границе — безопасное no-op (состояние не меняется).
- tapOn:
    id: "dock-scripture-prev"
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/SCR-001-C11-prev-boundary-noop
