appId: com.marianovikov.lampada
---
# SCR-001: open reader (companion dock, scripture mode) and page forward/backward;
# navigation must stay stable at list boundaries.
- launchApp:
    stopApp: true
    clearState: true
- tapOn: "Начать молитву"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-001 navigation"
- hideKeyboard
- tapOn: "5"
- tapOn: "Далее"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "МОЛИТВА"
- tapOn:
    point: "84%,70%"
- assertVisible: "Колоссянам 3:23"
- takeScreenshot: /Users/maria/Desktop/Dev/pray/testing/evidence/2026-08-22-stage06/SCR-001-00-initial-scripture
# Part A: page forward WITHOUT favoriting anything (frontier should just swap content)
