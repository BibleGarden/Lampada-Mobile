appId: twinkler
tags:
  - prepared
# NEEDS-STUB: against the live server the number and order of passages vary;
# under the stub the catalog is deterministic — two fixtures (Psalm 22 and
# James 1), run via run-stub-phase.sh (task 86cbj95j4). Not included in tagged
# runs.
---
# SCR-001: open reader (companion dock, scripture mode) and page forward/backward;
# navigation must stay stable at list boundaries.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-001 navigation"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- takeScreenshot: SCR-001-00-initial-scripture
# Part A: page forward WITHOUT favoriting anything (frontier should just swap content)
- tapOn:
    id: "dock-scripture-next"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- takeScreenshot: SCR-001-A1-next
- tapOn:
    id: "dock-scripture-next"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- tapOn:
    id: "dock-scripture-next"
- tapOn:
    id: "dock-scripture-next"
- tapOn:
    id: "dock-scripture-next"
# Part A: try prev after non-favorited forward paging (index should still be 0 -> disabled)
- tapOn:
    id: "dock-scripture-prev"
- takeScreenshot: SCR-001-A6-prev-after-noop-forward
# Part B: favorite each item while paging forward. Stub cycles two fixtures:
# after two "forward" taps the catalog repeats, and the favorite state is
# preserved across the repeat — that is the catalog boundary.
- tapOn:
    id: "dock-scripture-favorite"
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: SCR-001-B00-favorited
- tapOn:
    id: "dock-scripture-next"
- tapOn:
    id: "dock-scripture-favorite"
- assertVisible:
    id: "dock-scripture-favorite-active"
- tapOn:
    id: "dock-scripture-next"
# Catalog exhausted: the same passage again, the favorite is in place.
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: SCR-001-B10-next-catalog-exhausted
# Part C: back to the start; on the first item prev does not go further.
- tapOn:
    id: "dock-scripture-prev"
- assertVisible:
    id: "dock-scripture-favorite-active"
- tapOn:
    id: "dock-scripture-prev"
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: SCR-001-C10-prev-at-start
# Prev at the boundary is a safe no-op (the state does not change).
- tapOn:
    id: "dock-scripture-prev"
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: SCR-001-C11-prev-boundary-noop
