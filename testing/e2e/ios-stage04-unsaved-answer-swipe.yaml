appId: twinkler
tags:
  - main
---
# ANS-003: a downward swipe must not discard a non-empty draft. Discarding it
# remains possible only through the explicit two-step "Cancel" confirmation.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "ANS-003 swipe draft"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-input"
- inputText: "ANS-003 несохранённый текст"
# Tap the static question (not an input) to dismiss the iOS keyboard.
- tapOn:
    id: "answer-question"
- swipe:
    start: "50%,42%"
    end: "50%,92%"
    duration: 500
- assertVisible: ".*ANS-003.*"
# The "Really close?" confirmation lives for 3 s (AnswerSheet.tsx:849) — less
# than Maestro's delay between tapOn and assert. doubleTapOn sends both taps
# as one command.
- doubleTapOn: "Отмена"
- assertVisible:
    id: "session-title"
