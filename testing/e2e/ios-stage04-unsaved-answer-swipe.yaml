appId: twinkler
tags:
  - main
---
# ANS-003: a downward swipe must not discard a non-empty draft. Discarding it
# remains possible only through the explicit two-step "Отмена" confirmation.
- launchApp:
    stopApp: true
    clearState: true
- tapOn: "Начать молитву"
- tapOn:
    point: "50%,37%"
- inputText: "ANS-003 swipe draft"
- hideKeyboard
- tapOn: "5"
- tapOn: "Далее"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "МОЛИТВА"
- tapOn: "Ответить"
- tapOn:
    id: "answer-input"
- inputText: "ANS-003 несохранённый текст"
# Tap the static question (not an input) to dismiss the iOS keyboard.
- tapOn:
    id: "answer-question"
- swipe:
    start: "50%,42%"
    end: "50%,92%"
    duration: 500
- assertVisible: ".*ANS-003.*"
# Окно «Точно закрыть?» живёт 3 с (AnswerSheet.tsx:849) — меньше задержки
# Maestro между tapOn и assert. doubleTapOn шлёт оба касания одной командой.
- doubleTapOn: "Отмена"
- assertVisible: "МОЛИТВА"
