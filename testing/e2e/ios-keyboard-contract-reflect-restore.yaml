appId: twinkler
tags:
  - prepared
---
# Continuation of the open phase: no launch/clearState, so persistence can be verified.
# Enter must restore actions and preserve the text.
- pressKey: Enter
- assertVisible:
    id: reflection-input
    text: "Keyboard matrix reflect"
- assertVisible:
    id: reflect-return-button
- tapOn:
    id: reflect-complete-button
- assertVisible:
    id: home-title-lit
- tapOn:
    id: journal-button
- assertVisible: ".*Keyboard matrix reflect.*"
