appId: twinkler
tags:
  - prepared
# Fragment for run-lock-storage-check.sh: enables protection with PIN 123456.
# Precondition: protection disabled.
---
- launchApp:
    stopApp: true
# LockGate initializes asynchronously: give it time to appear before checking.
- evalScript: "java.lang.Thread.sleep(2500)"
- runFlow:
    when:
      visible:
        id: "lock-screen"
    commands:
      - tapOn:
          id: "pin-key-1"
      - tapOn:
          id: "pin-key-2"
      - tapOn:
          id: "pin-key-3"
      - tapOn:
          id: "pin-key-4"
      - tapOn:
          id: "pin-key-5"
      - tapOn:
          id: "pin-key-6"
      - assertNotVisible:
          id: "lock-screen"
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
# If protection is already enabled — do nothing.
- runFlow:
    when:
      notVisible:
        id: "change-pin-button"
    commands:
      - tapOn:
          id: "lock-toggle"
      - assertVisible:
          id: "pin-prompt-enable-create"
      - tapOn:
          id: "pin-key-1"
      - tapOn:
          id: "pin-key-2"
      - tapOn:
          id: "pin-key-3"
      - tapOn:
          id: "pin-key-4"
      - tapOn:
          id: "pin-key-5"
      - tapOn:
          id: "pin-key-6"
      - tapOn:
          id: "pin-key-confirm"
      - assertVisible:
          id: "pin-prompt-enable-repeat"
      - tapOn:
          id: "pin-key-1"
      - tapOn:
          id: "pin-key-2"
      - tapOn:
          id: "pin-key-3"
      - tapOn:
          id: "pin-key-4"
      - tapOn:
          id: "pin-key-5"
      - tapOn:
          id: "pin-key-6"
      - tapOn:
          id: "pin-key-confirm"
- assertVisible:
    id: "change-pin-button"
