appId: twinkler
# Фрагмент для run-lock-storage-check.sh: включает защиту пином 123456.
# Предусловие: защита выключена.
---
- launchApp:
    stopApp: true
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
- tapOn:
    id: "lock-toggle"
- assertVisible: "Придумайте пин-код"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"
- tapOn:
    id: "pin-key-confirm"
- assertVisible: "Повторите пин-код"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"
- tapOn:
    id: "pin-key-confirm"
- assertVisible:
    id: "change-pin-button"
