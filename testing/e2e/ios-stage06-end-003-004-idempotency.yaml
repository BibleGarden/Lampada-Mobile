appId: twinkler
tags:
  - main
---
# END-003/004: double completion is idempotent; two prayers share one prayed day.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "END-003 double finish"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
- doubleTapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
- assertVisible:
    id: "journal-button"
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "END-004 second prayer"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    point: "10%,11%"
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
- assertVisible:
    id: "journal-button"
- tapOn:
    id: "journal-button"
- assertVisible: ".*END-003 double finish.*"
- assertVisible: ".*END-004 second prayer.*"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/END-003-004-two-prayers-one-day
