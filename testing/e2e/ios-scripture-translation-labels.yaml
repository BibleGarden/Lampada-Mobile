appId: twinkler
tags:
  - rare
---
- launchApp
- tapOn:
    id: "settings-button"
# The language default now follows the device locale (ru) — to get the English
# translation labels (BSB/WEBUS) the picker is switched to en.
- tapOn:
    id: "scripture-language-picker"
- tapOn:
    id: "scripture-language-en"
# New UX (app/settings.tsx:796-820): choosing a language itself advances the
# sheet to the translation step — do not open the picker separately; check the
# labels right in the sheet.
- assertVisible: ".*BSB.*"
- assertVisible: ".*Berean Standard Bible.*"
- assertVisible: ".*WEBUS.*"
- assertVisible: ".*World English Bible – US Edition.*"
- assertVisible: ".*WEBBE.*"
- assertVisible: ".*World English Bible – British Edition.*"
