appId: twinkler
tags:
  - prepared
# Only through run-lock-biometrics.sh: the script sends pearl.nomatch after the cold start.
---
# LOCK-009 (part 3): a biometrics refusal keeps PIN entry as the way in — the
# face is not recognized, the lock screen stays, the PIN works.
#
# Preconditions: PIN 123456, biometrics enabled (009a/009b run).
- launchApp:
    stopApp: true
# The system prompt hides the app's AX tree: wait for the prompt itself.
- extendedWaitUntil:
    visible:
      id: "com.apple.localauthentication.ax.authentication.alert"
    timeout: 10000
# The script sends the non-match while the flow sleeps.
- evalScript: "java.lang.Thread.sleep(20000)"
# iOS keeps the prompt open after a non-match and offers a retry.
- assertVisible:
    id: "com.apple.localauthentication.ax.authentication.alert"
    text: "Повторите|Try Again"
- takeScreenshot: LOCK-009-native-refusal
- tapOn:
    id: "com.apple.localauthentication.ax.authentication.button.cancel"
- extendedWaitUntil:
    visible:
      id: "lock-screen"
    timeout: 10000
- assertVisible:
    id: "lock-pin-title"
# The fallback entry is the PIN: a wrong one does not unlock, the correct one
# does.
- tapOn:
    id: "pin-key-0"
- tapOn:
    id: "pin-key-0"
- tapOn:
    id: "pin-key-0"
- tapOn:
    id: "pin-key-0"
- tapOn:
    id: "pin-key-0"
- tapOn:
    id: "pin-key-6"
- assertVisible: "Неверный пин-код"
- assertVisible:
    id: "lock-screen"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"
- assertNotVisible:
    id: "lock-screen"
- assertVisible:
    id: "settings-button"
- takeScreenshot: LOCK-009-refusal-pin-fallback
