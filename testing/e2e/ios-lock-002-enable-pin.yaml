appId: twinkler
tags:
  - prepared
# Covered only through ios-lock-suite.yaml (order: 002 → 003/004, which require
# an enabled PIN). Not included in tagged runs.
---
# LOCK-002: enabling protection with a six-digit PIN and the lock screen on a
# cold start. Six digits are chosen deliberately: with free-form entry only the
# user finishes entry with the checkmark, so a four-digit auto-submit must not
# fire.
#
# Precondition: protection disabled (state after ios-lock-001).
- launchApp:
    stopApp: true
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
- tapOn:
    id: "lock-toggle"
- assertVisible:
    id: "pin-prompt-enable-create"
- assertVisible:
    id: "pin-prompt"

# Enter a new PIN 123456: after the fourth digit the screen must not advance on
# its own.
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- assertVisible:
    id: "pin-prompt-enable-create"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"
- tapOn:
    id: "pin-key-confirm"

- assertVisible:
    id: "pin-prompt-enable-repeat"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"
- tapOn:
    id: "pin-key-confirm"

# Entry closed, protection enabled: the change-PIN row has appeared.
- assertNotVisible:
    id: "pin-prompt"
- assertVisible:
    id: "change-pin-button"

# The cold start hits the lock screen.
- launchApp:
    stopApp: true
# Cold start: the PIN subsystem initializes asynchronously — without this pause
# a quick code entry right after the relaunch is reliably rejected (LockGate is
# not ready).
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "lock-screen"
- assertVisible:
    id: "lock-pin-title"
- assertVisible:
    id: "forgot-pin"
