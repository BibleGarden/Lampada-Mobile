appId: twinkler
# Покрытие — только через ios-lock-suite.yaml (порядок: 002 → 003/004 требуют
# включённого пина). В теговые прогоны не входит.
---
# LOCK-002: включение защиты пином из шести цифр и блокировка на холодном старте.
# Шесть цифр выбраны намеренно: при свободном вводе завершает набор только сам
# пользователь галочкой, и четырёхзначный автосабмит не должен срабатывать.
#
# Предусловие: защита выключена (состояние после ios-lock-001).
- launchApp:
    stopApp: true
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
- tapOn:
    id: "lock-toggle"
- assertVisible:
    id: "pin-prompt-enable-create"
- assertVisible:
    id: "pin-prompt"

# Придумать 123456: после четвёртой цифры экран не должен уйти сам.
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- assertVisible:
    id: "pin-prompt-enable-create"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"
- tapOn:
    id: "pin-key-confirm"

- assertVisible:
    id: "pin-prompt-enable-repeat"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"
- tapOn:
    id: "pin-key-confirm"

# Ввод закрылся, защита включена: появилась строка смены кода.
- assertNotVisible:
    id: "pin-prompt"
- assertVisible:
    id: "change-pin-button"

# Холодный старт упирается в экран блокировки.
- launchApp:
    stopApp: true
# Холодный старт: подсистема пина поднимается асинхронно — без паузы быстрый
# ввод кода после реланча гарантированно отклоняется (LockGate не готов).
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "lock-screen"
- assertVisible:
    id: "lock-pin-title"
- assertVisible:
    id: "forgot-pin"
