appId: twinkler
# NEEDS-ENV: сборка с EXPO_PUBLIC_FORCE_SESSION_ERROR=1 — e2e-хук в lib/store.ts
# один раз падает на входе и воспроизводит путь generic-catch порога
# (app/threshold.tsx:102) без внешней блокировки SQLite: с WAL (lib/db.ts:60)
# BEGIN EXCLUSIVE / locking_mode=EXCLUSIVE / chmod писателей приложения не
# держат (проверено 20.09, см. testing/reports/2026-09-20-stub-run.md).
# В теговые прогоны не входит.
---
# STG-SQLITE: ошибка входа в молитву — понятный алерт, живой повтор.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "STG sqlite ошибка входа"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible:
    id: "threshold-kicker"
# Первая попытка входа падает (хук).
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "Не удалось начать молитву"
- assertVisible: "Попробуй ещё раз."
- takeScreenshot: STG-sqlite-error
- tapOn: "Понятно"
# Кнопка не мёртвая: повторный вход проходит (хук одноразовый).
- assertVisible:
    id: "threshold-hold-button"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- takeScreenshot: STG-sqlite-retry-ok
