appId: twinkler
---
# Предусловие: требует запуска сразу после ios-stage03-start-sqlite-lock-prepare
# при сделанной только для чтения SQLite-базе приложения (chmod a-w на lampada.db,
# lampada.db-wal, lampada.db-shm). Раньше использовался BEGIN EXCLUSIVE, но с
# PRAGMA journal_mode=WAL (lib/db.ts:60) внешняя блокировка писателей приложения
# не держит — путь тот же generic-catch (app/threshold.tsx:102).
# Фрагмент, не для теговых прогонов.
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "Не удалось начать молитву"
- assertVisible: "Попробуй ещё раз."
- tapOn: "Понятно"
- assertVisible: "НАЖМИ И ДЕРЖИ"
