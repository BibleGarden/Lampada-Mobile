appId: twinkler
tags:
  - prepared
# NEEDS-ENV: a build with EXPO_PUBLIC_FORCE_SESSION_ERROR=1 — the e2e hook in
# lib/store.ts fails once on entry and reproduces the threshold generic-catch
# path (app/threshold.tsx:102) without an external SQLite lock: with WAL
# (lib/db.ts:60) the app's writers hold no BEGIN EXCLUSIVE /
# locking_mode=EXCLUSIVE / chmod (verified 20.09, see
# testing/reports/2026-09-20-stub-run.md). Not included in tagged runs.
---
# STG-SQLITE: entering the prayer fails — a clear alert, a working retry.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "STG sqlite ошибка входа"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible:
    id: "threshold-kicker"
# The first entry attempt fails (the hook).
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "Не удалось начать молитву"
- assertVisible: "Попробуй ещё раз."
- takeScreenshot: STG-sqlite-error
- tapOn: "Понятно"
# The button is not dead: the second entry succeeds (the hook is one-shot).
- assertVisible:
    id: "threshold-hold-button"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- takeScreenshot: STG-sqlite-retry-ok
