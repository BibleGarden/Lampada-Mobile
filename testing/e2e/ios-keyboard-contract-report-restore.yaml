appId: twinkler
tags:
  - prepared
---
# Continuation of the open phase: no launch/clearState, so persistence can be verified.
- tapOn:
    point: "3%,10%"
    retryTapIfNoChange: false
- assertNotVisible:
    id: inputView
- assertVisible:
    id: content-report-comment
    text: "Keyboard matrix report"
- assertVisible:
    id: content-report-send
- tapOn:
    id: content-report-cancel
- assertNotVisible:
    id: content-report-dialog
