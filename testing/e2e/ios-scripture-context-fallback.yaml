appId: twinkler
tags:
  - main
---
# Run stub with SCRIPTURE_STUB_MODE=fallback: 503 -> 429 Retry-After:1 -> success.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "Fallback сценарий"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible: ".*22:1.*6.*"
    timeout: 20000
- assertNotVisible: "temporarily unavailable"
- assertNotVisible: "Scripture selection request limit exceeded"
