appId: twinkler
tags:
  - prepared
---
# JRN-007: delete a prayer after opening its details and confirming twice.
- launchApp:
    stopApp: true
    clearState: false
- runFlow:
    when:
      visible:
        id: "journal-title"
    commands:
      - tapOn:
          point: "10%,8%"
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "journal-button"
- assertVisible: ".*END-003 double finish.*"
- tapOn: ".*END-003 double finish.*"
- assertVisible: ".*Ответ Кириллица про доверие.*"
- assertVisible:
    id: "journal-recording-0"
# Long text/audio details place the actions below the current viewport.
- scrollUntilVisible:
    element:
      id: "journal-delete"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn:
    id: "journal-delete"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: "journal-delete-confirm"
- tapOn:
    id: "journal-delete-confirm"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible: ".*END-003 double finish.*"
- assertVisible: ".*END-004 second prayer.*"
- takeScreenshot: JRN-007-after-delete
