appId: twinkler
---
# Regression: timer completion must not call pause() after AudioPlaylist release.
- launchApp:
    stopApp: true
    clearState: true
- tapOn: "Начать молитву"
- tapOn:
    point: "50%,37%"
- inputText: "MUS timer finish regression"
- hideKeyboard
- tapOn: "5"
- tapOn: "Далее"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "Включить тихую музыку"
- tapOn: "Включить тихую музыку"
- assertVisible:
    id: "music-playing"
- tapOn:
    point: "50%,29%"
- assertVisible: "−1"
- tapOn: "−1"
- tapOn: "−1"
- tapOn: "−1"
- tapOn: "−1"
- tapOn: "−1"
- assertVisible: "ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ"
- assertNotVisible:
    id: "music-playing"
