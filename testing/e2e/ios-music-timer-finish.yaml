appId: twinkler
tags:
  - main
---
# Regression: timer completion must not call pause() after AudioPlaylist release.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "MUS timer finish regression"
- hideKeyboard
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-music-off"
- tapOn:
    id: "session-music-off"
- assertVisible:
    id: "music-playing"
- tapOn:
    id: "session-timer-button"
- assertVisible:
    id: "session-time-subtract"
- tapOn:
    id: "session-time-subtract"
    retryTapIfNoChange: false
- tapOn:
    id: "session-time-subtract"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "reflect-kicker"
    timeout: 360000
- assertNotVisible:
    id: "music-playing"
