appId: twinkler
tags:
  - reminders
---
# REM-004 + REM-011 + REM-013: напоминание срабатывает в заданное время,
# показывается баннером поверх открытого приложения, приходит в день молитвы.
#
# Предусловия: разрешение выдано (прогон ios-rem-001); /tmp/rem-set-time.yaml
# сгенерирован одной целью now+4мин (кратно 5): gen-rem-set-time.mjs HH:MM.
- launchApp:
    stopApp: true
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "reminders-toggle"
    direction: DOWN
- assertVisible:
    id: "reminders-toggle"
    checked: true
# Ставим ближайшее время.
- tapOn:
    id: "reminders-settings-button-0"
- assertVisible:
    id: "reminders-editor-modal"
- runFlow:
    file: /tmp/rem-set-time.yaml
- tapOn:
    id: "reminders-editor-done"
- assertVisible: ".*Настроить расписание 1: Каждый день:.*"

# REM-013: сначала молитва в тот же день.
- openLink: "lampada://"
- assertVisible: "Начать молитву"
- tapOn: "Начать молитву"
# Цель уже задана ранее — подтверждаем пороговый экран.
- tapOn: "Далее"
- assertVisible: "Перед началом"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "МОЛИТВА"
# Накопить elapsed_sec > 0, иначе сессия не попадёт в дневник.
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    point: "10%,11%"
# Назад ведёт на экран итога: «Завершить» (или диалог «ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ» со
# своей кнопкой «Завершить» в старых сборках).
- assertVisible: ".*Завершить.*"
- runFlow:
    when:
      visible: "ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ"
    commands:
      - tapOn: "Завершить"
- runFlow:
    when:
      visible: "Вернуться к молитве"
    commands:
      - tapOn: "Завершить"
- assertVisible:
    id: "prayer-saved-notice"

# REM-004/011: приложение открыто на Home — ждём баннер с фразой из пула.
- extendedWaitUntil:
    visible: ".*(тишине с Богом|время помолиться|Он ждёт|минута молитвы|сказать Богу|Зажги лампаду|Помолимся|Побудь с Ним|станет легче|главному разговору|поблагодарить|Не спеши мимо).*"
    timeout: 300000
- assertVisible: "Lampada"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-09-20-reminders/REM-004-011-013-banner
