appId: twinkler
tags:
  - reminders
  - prepared
---
# REM-002: denying the system prompt keeps the toggle off and shows an
# explanation. Precondition: a clean install (undetermined), onboarding
# completed (editor suite), the permission never requested before.
- launchApp:
    stopApp: true
- assertVisible:
    id: "start-prayer-button"
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "reminders-toggle"
    direction: DOWN
# The system prompt appears exactly at the moment of enabling.
- tapOn:
    id: "reminders-toggle"
- assertVisible: ".*уведомления.*"
- tapOn: "Не разрешать"
# The toggle honestly stays off, a clear text is shown.
- assertVisible:
    id: "reminders-toggle"
    checked: false
- assertVisible:
    id: "reminders-permission-warning"
- assertVisible: "Уведомления запрещены в настройках системы."
# The Settings screen keeps working: the other sections are in place (privacy
# and protection are below the reminders section).
- scrollUntilVisible:
    element:
      id: "privacy-settings-button"
    direction: DOWN
- assertVisible:
    id: "privacy-settings-button"
- assertVisible:
    id: "lock-toggle"
