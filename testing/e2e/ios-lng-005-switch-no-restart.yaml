appId: twinkler
tags:
  - prepared
# NEEDS-RUNNER: the device locale is switched between flows by run-lng.sh
# (the order and locales are hardcoded in the script). Not part of tagged runs.
---
# LNG-005: switching the language in settings updates the chrome immediately, without a restart.
# The starting device language does not matter: selection goes by testID; we check Ukrainian.
#
# The Scripture language is not touched here — independence from it is covered by LNG-008.
- launchApp:
    stopApp: true
    clearState: true
    # Lampada does not use geolocation; the explicit list keeps Maestro from
    # poking locationd (simctl privacy location) right after a cold reboot,
    # where locationd hangs.
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: "settings-button"
- tapOn:
    id: "interface-language-picker"
- tapOn:
    id: "interface-language-uk"
- assertNotVisible:
    id: "interface-language-sheet"
- assertVisible:
    id: "interface-language-picker"
    text: ".*Українська.*"
- assertVisible: "НАЛАШТУВАННЯ"
- assertVisible: "МОВА ІНТЕРФЕЙСУ"
# The back button is tapped by testID: its label follows the language switch.
- tapOn:
    id: "settings-back-button"
- assertVisible: "Почати молитву"
- assertVisible: "Підтримай вогник"
