appId: twinkler
tags:
  - prepared
# NEEDS-STUB: transcription is made deterministic via the :9085 stub (86cbj95j4).
# Not part of tagged runs.
---
# JRN-010: transcribing a voice answer — loading state, text under the player,
# persistence after reopening. JRN-011: searching by a transcript word in a
# different case. The stub replies with the fixed Russian transcript phrase
# «Стабильная расшифровка лампады номер семь».
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "JRN-010 расшифровка"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
# A voice answer with no text.
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recordings-close-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "prayer-saved-notice"
# Journal: open the details and transcribe.
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- tapOn: ".*JRN-010 расшифровка.*"
- assertVisible:
    id: "journal-recording-0"
- tapOn:
    id: "journal-recording-0-transcribe"
# The first tap asks for transcription consent.
- runFlow:
    when:
      visible:
        id: "privacy-consent-audio_transcription"
    commands:
      - tapOn:
          id: "privacy-consent-audio_transcription-allow"
# The stub replies instantly — the "Transcribing…" state is not deterministic
# enough to assert; wait for the finished text right away.
- extendedWaitUntil:
    visible: "Стабильная расшифровка лампады номер семь"
    timeout: 30000
- takeScreenshot: JRN-010-transcript
# JRN-010: after closing and reopening, the text is still there (stored in SQLite).
- tapOn: ".*JRN-010 расшифровка.*"
- tapOn: ".*JRN-010 расшифровка.*"
- assertVisible: "Стабильная расшифровка лампады номер семь"
- tapOn: ".*JRN-010 расшифровка.*"
# JRN-011: search by a transcript word typed in a different case.
- tapOn:
    id: "journal-search-input"
- inputText: "стабильная"
- hideKeyboard
- assertVisible: ".*JRN-010 расшифровка.*"
- takeScreenshot: JRN-011-search-transcript
