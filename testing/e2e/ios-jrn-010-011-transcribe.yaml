appId: twinkler
# NEEDS-STUB: транскрипция детерминирована через stub :9085 (86cbj95j4).
# В теговые прогоны не входит.
---
# JRN-010: расшифровка голосового ответа — лоадинг, текст под плеером,
# сохранение после переоткрытия. JRN-011: поиск по слову расшифровки в другом
# регистре. Stub отвечает текстом «Стабильная расшифровка лампады номер семь».
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "JRN-010 расшифровка"
- hideKeyboard
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
# Голосовой ответ без текста.
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recordings-close-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "prayer-saved-notice"
# Дневник: открываем детали и расшифровываем.
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- tapOn: ".*JRN-010 расшифровка.*"
- assertVisible:
    id: "journal-recording-0"
- tapOn:
    id: "journal-recording-0-transcribe"
# Первое нажатие спрашивает согласие на расшифровку.
- runFlow:
    when:
      visible:
        id: "privacy-consent-audio_transcription"
    commands:
      - tapOn:
          id: "privacy-consent-audio_transcription-allow"
# Stub отвечает мгновенно — состояние «Расшифровываю…» недетерминировано
# для ассерта; ждём сразу готовый текст.
- extendedWaitUntil:
    visible: "Стабильная расшифровка лампады номер семь"
    timeout: 30000
- takeScreenshot: JRN-010-transcript
# JRN-010: после закрытия и переоткрытия текст на месте (сохранён в SQLite).
- tapOn: ".*JRN-010 расшифровка.*"
- tapOn: ".*JRN-010 расшифровка.*"
- assertVisible: "Стабильная расшифровка лампады номер семь"
- tapOn: ".*JRN-010 расшифровка.*"
# JRN-011: поиск слова из расшифровки в другом регистре.
- tapOn:
    id: "journal-search-input"
- inputText: "стабильная"
- hideKeyboard
- assertVisible: ".*JRN-010 расшифровка.*"
- takeScreenshot: JRN-011-search-transcript
