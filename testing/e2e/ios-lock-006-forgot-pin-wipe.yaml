appId: twinkler
tags:
  - prepared
---
# LOCK-006: "Forgot PIN?" is the only way out of a forgotten code, and it costs
# all the data. Verifies that both confirmations really guard against an
# accidental tap, and that after the wipe both the journal and the protection
# itself are gone.
#
# Precondition: ios-lock-006-forgot-pin-prepare (journal entry "LOCK-006 entry",
# PIN 4321).
- launchApp:
    stopApp: true
- assertVisible:
    id: "lock-screen"

# Cancelling at the first confirmation wipes nothing.
#
# The repeated tap works around the same behaviour as on the home screen: the
# first tap after a cold start, while the screen is still appearing, never
# reaches the handler.
- tapOn:
    id: "forgot-pin"
- runFlow:
    when:
      notVisible: "Стереть данные"
    commands:
      - tapOn:
          id: "forgot-pin"
- assertVisible: "Стереть данные"
- tapOn: "Отмена"
- assertVisible:
    id: "lock-screen"

# Cancelling at the second confirmation also wipes nothing.
- tapOn:
    id: "forgot-pin"
- tapOn: "Стереть данные"
- assertVisible: "Точно стереть всё?"
- tapOn: "Отмена"
- assertVisible:
    id: "lock-screen"

# The data is intact: the code is still the same.
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-1"
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "journal-button"
- assertVisible: ".*LOCK-006 запись.*"
- tapOn:
    point: "10%,11%"

# Full path: two confirmations — and the app is wiped.
- launchApp:
    stopApp: true
- assertVisible:
    id: "lock-screen"
- tapOn:
    id: "forgot-pin"
- runFlow:
    when:
      notVisible: "Стереть данные"
    commands:
      - tapOn:
          id: "forgot-pin"
- tapOn: "Стереть данные"
- assertVisible: "Точно стереть всё?"
- tapOn: "Да, стереть"

# Protection is removed along with the data: the lock screen goes away without
# entering the code.
- extendedWaitUntil:
    notVisible:
      id: "lock-screen"
    timeout: 15000
- assertVisible:
    id: "start-prayer-button"

# The journal is empty.
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- assertVisible:
    id: "journal-empty-state"
- assertNotVisible: ".*LOCK-006 запись.*"
- tapOn:
    point: "10%,11%"

# Settings again show protection as disabled.
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
- assertNotVisible:
    id: "change-pin-button"

# The cold start no longer asks for the code.
- launchApp:
    stopApp: true
- assertVisible:
    id: "start-prayer-button"
- assertNotVisible:
    id: "lock-screen"
