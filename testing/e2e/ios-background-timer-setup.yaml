appId: twinkler
tags:
  - rare
---
# Put a five-second finite prayer in background before it reaches zero.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "Background timer smoke"
- hideKeyboard
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- tapOn:
    point: "50%,29%"
- tapOn:
    id: "session-time-subtract"
    retryTapIfNoChange: false
- tapOn:
    id: "session-time-subtract"
    retryTapIfNoChange: false
- tapOn:
    id: "session-time-subtract"
    retryTapIfNoChange: false
- tapOn:
    id: "session-time-subtract"
    retryTapIfNoChange: false
- tapOn:
    id: "session-time-subtract"
    retryTapIfNoChange: false
- pressKey: HOME
