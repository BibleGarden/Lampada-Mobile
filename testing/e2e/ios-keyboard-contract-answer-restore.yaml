appId: twinkler
tags:
  - prepared
---
# Продолжение open-фазы: без launch/clearState, чтобы проверить сохранность.
- tapOn:
    id: answer-sheet-handle
- assertVisible:
    id: answer-input
    text: "Keyboard matrix answer"
- tapOn:
    id: answer-save-button
- runFlow:
    when:
      visible:
        id: privacy-consent-answer_context-allow
    commands:
      - tapOn:
          id: privacy-consent-answer_context-allow
- assertVisible:
    id: dock-answer-edit-button
- tapOn:
    id: dock-answer-edit-button
- assertVisible:
    id: answer-input
    text: "Keyboard matrix answer"
