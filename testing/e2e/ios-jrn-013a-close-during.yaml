appId: twinkler
tags:
  - prepared
# NEEDS-STUB: the stub is in delay mode — the response arrives after 12 s (run-jrn-transcription.sh).
---
# JRN-013 (part 1): closing the details during transcription cancels the
# request — the late response does not put the data back into the UI.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "JRN-013 закрытие"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recordings-close-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "prayer-saved-notice"
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- tapOn: ".*JRN-013 закрытие.*"
- tapOn:
    id: "journal-recording-0-transcribe"
- runFlow:
    when:
      visible:
        id: "privacy-consent-audio_transcription"
    commands:
      - tapOn:
          id: "privacy-consent-audio_transcription-allow"
- assertVisible:
    id: "journal-recording-0-transcribing"
# Close the details before the response arrives (the stub replies after 12 s).
- tapOn: ".*JRN-013 закрытие.*"
- evalScript: "java.lang.Thread.sleep(16000)"
# The late response was ignored: no text and no stuck loading state.
- tapOn: ".*JRN-013 закрытие.*"
- assertNotVisible: "Стабильная расшифровка лампады номер семь"
- assertNotVisible:
    id: "journal-recording-0-transcribing"
- assertVisible:
    id: "journal-recording-0-transcribe"
- takeScreenshot: JRN-013-closed-during
