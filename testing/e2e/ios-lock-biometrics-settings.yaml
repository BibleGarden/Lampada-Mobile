appId: twinkler
tags:
  - prepared
# Only through run-lock-biometrics.sh: opens Settings after enabling the PIN.
---
# The Settings screen queries biometrics on mount: go home and reopen Settings
# via openLink (simctl openurl shows the system "Open in Lampada?" dialog).
# Dismiss the possible "Open" dialog.
- openLink: "lampada://"
- tapOn:
    text: "Open|Открыть"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- openLink: "lampada://settings"
- tapOn:
    text: "Open|Открыть"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: biometrics-toggle
    direction: DOWN
