appId: twinkler
tags:
  - ipad
---
# START-005 (iPad): порог с многострочной целью. Ландшафт — брифинг слева,
# кнопка удержания справа, все три пункта видны; портрет — кнопка под
# брифингом; после поворотов удержание запускает молитву.
- launchApp:
    stopApp: true
    clearState: true
- setOrientation: PORTRAIT
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "START-005 о близких: чтобы мама поправилась после операции, брат нашёл работу рядом с домом, а у нас хватило терпения и мира друг с другом"
- pressKey: Enter
- tapOn:
    id: "setup-preset-15"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible:
    id: "threshold-kicker"
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "threshold-brief-0"
- assertVisible:
    id: "threshold-brief-1"
- assertVisible:
    id: "threshold-brief-2"
- assertVisible: ".*START-005 о близких.*"
- assertVisible:
    id: "threshold-hold-button"
    rightOf:
      id: "threshold-brief-0"
- takeScreenshot: START-005-threshold-landscape
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "threshold-hold-button"
    below:
      id: "threshold-brief-2"
- assertVisible: ".*START-005 о близких.*"
- takeScreenshot: START-005-threshold-portrait
- longPressOn:
    id: "threshold-hold-button"
- assertVisible:
    id: "session-title"
