appId: twinkler
tags:
  - prepared
---
# LOCK-003: a wrong PIN keeps the user on the lock screen with an error, the
# correct one lets them in. The PIN length is known from storage, so the check
# runs by itself on the last digit: there is no separate confirmation when
# unlocking.
#
# Precondition: PIN 123456 enabled (state after ios-lock-002).
- launchApp:
    stopApp: true
- assertVisible:
    id: "lock-screen"

# A wrong code of the same length.
- tapOn:
    id: "pin-key-6"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-1"
- extendedWaitUntil:
    visible: "Неверный пин-код"
    timeout: 5000
- assertVisible:
    id: "lock-screen"
- assertNotVisible:
    id: "start-prayer-button"

# The correct code unlocks without extra confirmation.
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"
- extendedWaitUntil:
    notVisible:
      id: "lock-screen"
    timeout: 5000
- assertVisible:
    id: "start-prayer-button"
