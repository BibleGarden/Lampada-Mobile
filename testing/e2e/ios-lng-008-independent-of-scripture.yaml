appId: twinkler
tags:
  - prepared
# NEEDS-RUNNER: the device locale is switched between flows by run-lng.sh
# (the order and locales are hardcoded in the script). Not part of tagged runs.
---
# LNG-008: the interface language and the Scripture language are independent settings.
# Does not duplicate ios-scripture-default-language / user-choice-overrides-locale:
# here we change only the interface and check that the Scripture triple did not move.
#
# Precondition: the simulator is on locale=en_US, so the Scripture default is
# English / BSB / Bob Souer (as in ios-scripture-default-language.yaml).
- launchApp:
    stopApp: true
    clearState: true
    # Lampada does not use geolocation; the explicit list keeps Maestro from
    # poking locationd (simctl privacy location) right after a cold reboot,
    # where locationd hangs.
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: "settings-button"
- assertVisible:
    id: "interface-language-picker"
    text: ".*English.*"
- assertVisible:
    id: "scripture-language-picker"
- assertVisible: ".*BSB.*"
- assertVisible: ".*Bob Souer.*"
- tapOn:
    id: "interface-language-picker"
- tapOn:
    id: "interface-language-ru"
- assertVisible: "НАСТРОЙКИ"
- assertVisible: "ЯЗЫК ИНТЕРФЕЙСА"
- assertVisible:
    id: "interface-language-picker"
    text: ".*Русский.*"
- assertVisible:
    id: "scripture-language-picker"
    text: ".*Язык цитат.*"
- assertVisible: ".*English.*"
- assertVisible: ".*BSB.*"
- assertVisible: ".*Bob Souer.*"
