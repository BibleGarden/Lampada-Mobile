appId: twinkler
---
# JRN-006: closing one detail stops its audio; another source starts independently.
- launchApp:
    stopApp: true
    clearState: false
- runFlow:
    when:
      visible:
        id: "start-prayer-button"
    commands:
      - tapOn:
          id: "journal-button"
- assertVisible:
    id: "journal-title"
- tapOn: ".*JRN-008 upgrade retest.*"
- tapOn:
    id: "journal-recording-0"
- takeScreenshot: JRN-006-first-playing
- tapOn: ".*JRN-008 upgrade retest.*"
- assertVisible: ".*JRN-006 second audio.*"
- tapOn: ".*JRN-006 second audio.*"
- tapOn:
    id: "journal-recording-0"
- assertVisible:
    id: "journal-title"
- takeScreenshot: JRN-006-second-playing
