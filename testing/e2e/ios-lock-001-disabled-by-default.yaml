appId: twinkler
tags:
  - main
---
# LOCK-001: until the user enables protection, no screen behaves differently.
# Checks the cold start and the PIN item in the "Privacy" section.
#
# Protection keys live in the Keychain rather than the app container, and
# `clearState` does not wipe them. The scenario targets an install where the
# PIN has never been enabled, or a run after ios-lock-005 (protection disabled).
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "start-prayer-button"
- assertNotVisible:
    id: "lock-screen"
- assertNotVisible:
    id: "privacy-curtain"
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
- assertNotVisible:
    id: "change-pin-button"
- assertNotVisible:
    id: "pin-prompt"
