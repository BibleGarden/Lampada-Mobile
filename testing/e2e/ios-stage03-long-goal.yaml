appId: twinkler
tags:
  - main
---
# SETUP-004 (iPhone): a long goal with the keyboard open. The field stays above
# the keyboard, a tap inside the field continues entry, a tap above the field
# closes the keyboard without losing the text, and after that "Next" leads
# into the prayer.
#
# Keyboard visibility is checked via the system keyboard's own elements in the
# XCTest hierarchy: `id: "shift"` is the shift key, `id: "inputView"` is its
# container (for `above:`). The identifiers are not localized (the "shift"
# label is), and `shift` exists in the letter layout of iPhone and iPad in
# both orientations, so the check does not depend on the simulator keyboard
# language. In iPad landscape Maestro reports the keyboard incomplete and with
# unrotated coordinates, so `above: inputView` is checked in portrait only.
#
# It is `inputText` that raises the on-screen keyboard: with the simulator's
# hardware keyboard connected (I/O → Keyboard, on by default) a tap on the
# field only focuses it. Hence the flow does not check "the keyboard appeared
# after the tap" — only "visible after input" and "hidden after a tap
# outside", which holds in both simulator modes.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "SETUP-004"
- assertVisible:
    id: "shift"
- assertNotVisible:
    id: "setup-next-button"
- assertNotVisible:
    id: "setup-duration-value"
- assertVisible:
    id: "setup-kicker"
# a tap inside the field (below the single line — the cursor lands at the end)
# does not close the keyboard; typing continues from the same spot. The text
# before the tap is one short line: a tap next to a word the spell check
# considers a mistake selects it, and typing would replace the word. For the
# same reason Maestro's tap retry is disabled: a second tap in a row selects
# the word.
- tapOn:
    id: "setup-goal-input"
    retryTapIfNoChange: false
- assertVisible:
    id: "shift"
- inputText: " very long prayer goal with multiple clauses and repeated context for layout verification. This text must remain editable while the keyboard is open and must not cover the primary action. Second paragraph equivalent with more content for threshold and session rendering. Third segment adds enough characters to exceed three display lines safely."
# the long text scrolls inside the field: the header and title stay in place,
# the field still ends above the keyboard
- assertVisible:
    id: "setup-kicker"
- assertVisible:
    id: "setup-goal-input"
    below:
      id: "setup-examples-button"
    above:
      id: "inputView"
- tapOn:
    id: "setup-kicker"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "setup-goal-input"
    text: "SETUP-004 very long prayer goal with multiple clauses and repeated context for layout verification. This text must remain editable while the keyboard is open and must not cover the primary action. Second paragraph equivalent with more content for threshold and session rendering. Third segment adds enough characters to exceed three display lines safely."
- assertVisible: "ДЛИТЕЛЬНОСТЬ"
- takeScreenshot: SETUP-004-actions-after-keyboard
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible:
    id: "threshold-kicker"
- assertVisible: ".*SETUP-004 very long prayer goal.*"
- longPressOn:
    id: "threshold-hold-button"
- assertVisible:
    id: "session-title"
- assertVisible: ".*SETUP-004 very long prayer goal.*"
