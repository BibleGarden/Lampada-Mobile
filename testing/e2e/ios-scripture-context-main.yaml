appId: twinkler
tags:
  - main
---
# Run against scripts/scripture-stub.mjs with EXPO_PUBLIC_SCRIPTURE_SELECT_URL.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "Нужна мудрость"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible: ".*22:1.*6.*"
    timeout: 10000
# Компактная карточка показывает выделенные сервером стихи — в фикстуре
# это стих 2 (highlight), а не 1.
- assertVisible: "Он покоит меня.*"
- assertVisible:
    id: "scripture-read-full"
- tapOn:
    id: "scripture-read-full"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-25-scripture-context/reader-short-wrapped
# Шторка ридера не закрывается тапом по фону — только по ✕ (правый верх).
- tapOn:
    point: "89%,18%"
- tapOn:
    id: "dock-scripture-favorite"
- assertVisible:
    id: "dock-scripture-favorite-active"
- tapOn:
    id: "dock-scripture-next"
- assertVisible: "Послание Иакова 1:5–8"
- assertVisible:
    id: "scripture-read-full"
- tapOn:
    id: "scripture-read-full"
- swipe:
    start: "50%,13%"
    end: "50%,3%"
    duration: 700
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-25-scripture-context/reader-safe-area-max
- tapOn:
    point: "89%,18%"
- tapOn:
    id: "dock-scripture-prev"
- assertVisible: ".*22:1.*6.*"
