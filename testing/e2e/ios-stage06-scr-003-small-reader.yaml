appId: twinkler
tags:
  - main
---
# SCR-003 on iPhone SE, entered through the app's registered deep-link scheme.
- launchApp:
    stopApp: true
    clearState: true
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Open"
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Cancel"
- tapOn:
    point: "92%,93%"
- runFlow:
    when:
      visible: "Начать молитву"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn: "Начать молитву"
- runFlow:
    when:
      visible: "Начать молитву"
    commands:
      - tapOn: "Начать молитву"
- assertVisible: "ПЕРЕД МОЛИТВОЙ"
- tapOn: "?"
- tapOn:
    point: "50%,34%"
- tapOn: "5"
- tapOn: "Далее"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- tapOn:
    id: "dock-scripture-tab"
- tapOn: "В избранное"
- tapOn:
    id: "dock-scripture-next"
- tapOn: "В избранное"
- tapOn:
    id: "dock-scripture-next"
- tapOn: "В избранное"
- tapOn:
    id: "dock-scripture-next"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- assertVisible: "Читать отрывок целиком"
- tapOn: "Читать отрывок целиком"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/SCR-003-small-reader-top
- swipe:
    start: "50%,78%"
    end: "50%,30%"
    duration: 800
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/SCR-003-small-reader-bottom
