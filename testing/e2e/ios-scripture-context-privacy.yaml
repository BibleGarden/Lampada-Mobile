appId: twinkler
tags:
  - critical
---
# Run stub with SCRIPTURE_STUB_MODE=privacy. It returns 422 if any reply leaks.
- launchApp:
    stopApp: true
    clearState: true
- openLink: "lampada://settings"
# Согласия живут в BottomSheet «Данные для ИИ» (app/settings.tsx:913,1076).
- tapOn:
    id: "privacy-settings-button"
- scrollUntilVisible:
    element:
      id: "privacy-setting-answer_context-denied"
    direction: DOWN
- tapOn:
    id: "privacy-setting-answer_context-denied"
- tapOn:
    id: "privacy-sheet-done"
- openLink: "lampada://"
- tapOn: "Начать молитву"
- tapOn:
    point: "50%,37%"
- inputText: "Приватная молитва"
- hideKeyboard
- tapOn: "5"
- tapOn: "Далее"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "МОЛИТВА"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible: ".*22:1.*6.*"
    timeout: 10000
- assertNotVisible: "Сейчас не удалось подобрать отрывок."
