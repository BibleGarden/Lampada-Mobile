appId: twinkler
tags:
  - prepared
---
# Build with EXPO_PUBLIC_API_URL=http://localhost:9085 and run the stub with
# SCRIPTURE_STUB_MODE=privacy. It returns 422 if any reply leaks.
- launchApp:
    stopApp: true
    clearState: true
- openLink: "lampada://settings"
# iOS 26 confirms scheme navigation with a system dialog in the simulator's
# language; left unanswered, it survives a restart and breaks the following
# flows.
- runFlow:
    when:
      visible: "Open|Открыть"
    commands:
      - tapOn: "Open|Открыть"
# Consent settings live in the "Data for AI" bottom sheet
# (app/settings.tsx:913,1076). On iPhone SE the row is below the first screen,
# and XCTest does not return invisible nodes.
- scrollUntilVisible:
    element:
      id: "privacy-settings-button"
    direction: DOWN
- tapOn:
    id: "privacy-settings-button"
- scrollUntilVisible:
    element:
      id: "privacy-setting-answer_context-denied"
    direction: DOWN
- tapOn:
    id: "privacy-setting-answer_context-denied"
- tapOn:
    id: "privacy-sheet-close"
- openLink: "lampada://"
- runFlow:
    when:
      visible: "Open|Открыть"
    commands:
      - tapOn: "Open|Открыть"
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "Приватная молитва"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible: ".*22:1.*6.*"
    timeout: 10000
- assertNotVisible: "Сейчас не удалось подобрать отрывок."
