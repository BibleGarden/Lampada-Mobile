appId: twinkler
tags:
  - main
---
# ANS-023: in the recordings sheet, "Done" (while recording) and
# "Record another" (afterwards) are visible and tappable. The flow is not
# device-bound: the `main` tier runs it on an iPhone with a Home Indicator, the
# iPad group on a tablet, and SE by direct launch (testing/README.md).
# Edge-adjacent fields are reviewed by a human from screenshots.
- launchApp:
    stopApp: true
    clearState: true
    # the microphone system dialog is localized — grant the permission up front
    permissions:
      microphone: allow
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "ANS-023 кнопки записей"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- longPressOn:
    id: "threshold-hold-button"
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- waitForAnimationToEnd:
    timeout: 2500
- assertVisible:
    id: "recordings-stop-button"
# The recording timer is driven by the recorder's native clock. The absolute
# value depends on how long Maestro waited before the tap, so we check the m:ss
# format and growth.
- copyTextFrom:
    id: "recording-elapsed"
- evalScript: ${output.elapsed = maestro.copiedText}
- assertTrue: ${/\d+:\d\d$/.test(output.elapsed)}
- extendedWaitUntil:
    notVisible:
      id: "recording-elapsed"
      text: ${output.elapsed}
    timeout: 3000
- takeScreenshot: ANS-023-recording-done
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- assertVisible:
    id: "recordings-record-button"
- assertVisible:
    id: "recordings-close-button"
- takeScreenshot: ANS-023-record-another
- tapOn:
    id: "recordings-record-button"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-1"
- tapOn:
    id: "recordings-close-button"
- assertVisible:
    id: "answer-save-button"
- waitForAnimationToEnd:
    timeout: 2500
# Answer sheet with the keyboard closed: the sheet and its scrim reach the
# screen edge, the buttons sit above the Home Indicator / system navigation.
- takeScreenshot: ANS-023-answer-sheet
# "Save" is reachable above the pinned keyboard and closes the sheet.
# Whether the sheet fully slides off-screen is checked by a human (MANUAL_CHECKS.md).
- tapOn:
    id: "answer-input"
- inputText: "ANS-023 keyboard save"
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context-allow"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertNotVisible:
    id: "answer-input"
- assertVisible:
    id: "dock-answer-edit-button"
- takeScreenshot: ANS-023-saved-with-keyboard
- tapOn:
    id: "dock-answer-edit-button"
- assertVisible:
    id: "answer-input"
    text: "ANS-023 keyboard save"
- takeScreenshot: ANS-023-reopened
