appId: twinkler
# NEEDS-STUB: stub /api/version-check с update_type=soft (run-stub-phase.sh).
# В теговые прогоны не входит.
---
# Баннер мягкого обновления: показывается, «позже» скрывает до конца сессии,
# после перезапуска появляется снова.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: update-soft
    timeout: 20000
- assertVisible:
    id: "update-soft"
- assertVisible:
    id: update-later
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-09-20-stub/UPDATE-soft-banner
# «Позже» скрывает баннер.
- tapOn:
    id: update-later
- assertNotVisible:
    id: update-soft
# До конца сессии баннер не возвращается (сверяем настроики и домой).
- openLink: "lampada://settings"
- assertNotVisible:
    id: update-soft
- openLink: "lampada://"
- assertNotVisible:
    id: update-soft
# Холодный старт: проверка версии повторяется, баннер снова показан.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: update-soft
    timeout: 20000
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-09-20-stub/UPDATE-soft-relaunch
