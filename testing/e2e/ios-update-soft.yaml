appId: twinkler
tags:
  - prepared
# NEEDS-STUB: the stub /api/version-check with update_type=soft
# (run-stub-phase.sh). Not included in tagged runs.
---
# Soft update banner: shown, "later" hides it until the end of the session,
# and it reappears after a restart.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: update-soft
    timeout: 20000
- assertVisible:
    id: "update-soft"
- assertVisible:
    id: update-later
- takeScreenshot: UPDATE-soft-banner
# "Later" hides the banner.
- tapOn:
    id: update-later
- assertNotVisible:
    id: update-soft
# Until the end of the session the banner does not return (check Settings and
# Home).
- openLink: "lampada://settings"
- assertNotVisible:
    id: update-soft
- openLink: "lampada://"
- assertNotVisible:
    id: update-soft
# Cold start: the version check repeats, the banner is shown again.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: update-soft
    timeout: 20000
- takeScreenshot: UPDATE-soft-relaunch
