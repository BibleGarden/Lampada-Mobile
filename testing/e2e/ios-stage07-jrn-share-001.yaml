appId: twinkler
tags:
  - rare
---
# JRN-014: share a prayer from the journal as plain text through the system share sheet.
# Самодостаточен: создаёт запись дневника сам (clearState: true), порядок прогона не важен.
- launchApp:
    stopApp: true
    clearState: true
- runFlow:
    when:
      visible:
        id: "journal-title"
    commands:
      - tapOn:
          point: "10%,8%"
- assertVisible:
    id: "start-prayer-button"
# --- сетап: молитва с одним сохранённым ответом ---
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "JRN-014 share"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
# накопить elapsed_sec > 0, иначе сессия не попадёт в дневник (lib/db.ts:223)
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-input"
- inputText: "JRN-014 answer"
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertVisible:
    id: "dock-answer-edit-button"
# Шторка ответа после сохранения может быть уже закрыта (consent-диалог её
# гасит) или нет — первый тап либо уводит сразу на «ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ»,
# либо только закрывает шторку; во втором случае «Ответить» виден и жмём ещё раз.
- tapOn:
    point: "10%,11%"
- runFlow:
    when:
      visible:
        id: "dock-answer-button"
    commands:
      - tapOn:
          point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflect-complete-button"
# Баннер prayer-saved-notice живёт 4 с и здесь может скрыться до assert —
# для этого флоу достаточно сигнала «завершение сразу на Home» (ADR-0028).
- assertVisible:
    id: "home-title-lit"
# --- конец сетапа ---
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
# expand the created prayer in the list
- tapOn: ".*JRN-014 share.*"
- assertVisible:
    id: "journal-share"
- assertVisible:
    id: "journal-delete"
- tapOn:
    id: "journal-share"
- waitForAnimationToEnd:
    timeout: 4000
# the system share sheet is outside the app, so match its own labels
- assertVisible: ".*(Скопировать|Copy|Ещё|More|Отменить|Cancel).*"
- takeScreenshot: JRN-014-share-sheet
# В шите iOS 26 нет кнопки «Отменить» — закрывается тапом по затемнённой
# области над шитом.
- tapOn:
    point: "50%,12%"
- assertVisible:
    id: "journal-title"
- assertVisible:
    id: "journal-share"
