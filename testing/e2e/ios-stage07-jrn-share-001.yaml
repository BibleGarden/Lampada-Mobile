appId: twinkler
tags:
  - rare
---
# JRN-014: share a prayer from the journal as plain text through the system share sheet.
# Self-contained: creates the journal entry itself (clearState: true); the run
# order does not matter.
- launchApp:
    stopApp: true
    clearState: true
- runFlow:
    when:
      visible:
        id: "journal-title"
    commands:
      - tapOn:
          point: "10%,8%"
- assertVisible:
    id: "start-prayer-button"
# --- setup: a prayer with one saved answer ---
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "JRN-014 share"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
# accumulate elapsed_sec > 0, otherwise the session does not reach the journal
# (lib/db.ts:223)
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-input"
- inputText: "JRN-014 answer"
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertVisible:
    id: "dock-answer-edit-button"
# After saving, the answer sheet may already be closed (the consent dialog
# dismisses it) or not — the first tap either goes straight to the
# «ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ» screen (screens.reflect.before) or only closes the
# sheet; in the latter case the «Ответить» button is visible and we tap again.
- tapOn:
    point: "10%,11%"
- runFlow:
    when:
      visible:
        id: "dock-answer-button"
    commands:
      - tapOn:
          point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflect-complete-button"
# The prayer-saved-notice row replaces the streak caption for 4 s and here may
# hide before the assert — for this flow the "finishing goes straight to Home"
# signal (ADR-0028) is enough.
- assertVisible:
    id: "home-title-lit"
# --- end of setup ---
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
# expand the created prayer in the list
- tapOn: ".*JRN-014 share.*"
- assertVisible:
    id: "journal-share"
- assertVisible:
    id: "journal-delete"
- tapOn:
    id: "journal-share"
- waitForAnimationToEnd:
    timeout: 4000
# the system share sheet is outside the app, so match its own labels
- assertVisible: ".*(Скопировать|Copy|Ещё|More|Отменить|Cancel).*"
- takeScreenshot: JRN-014-share-sheet
# On iOS 26.5 the Dismiss Popover AX action reports success but leaves the
# sheet open.
- swipe:
    start: "50%,62%"
    end: "50%,94%"
    duration: 650
- assertNotVisible: ".*(Скопировать|Copy|Ещё|More).*"
- assertVisible:
    id: "journal-title"
- assertVisible:
    id: "journal-share"
