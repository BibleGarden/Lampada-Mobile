appId: twinkler
tags:
  - prepared
# NEEDS-RUNNER: the device locale is switched between flows by run-lng.sh
# (the order and locales are hardcoded in the script). Not part of tagged runs.
---
# LNG-007: an explicit choice is not reset by changing the device language.
#
# Precondition: ios-lng-006-persist-relaunch.yaml has just run
# (SQLite holds ui_language=uk). The runner switched the simulator to
# locale=de_DE — Maestro cannot change the system language itself. clearState
# is forbidden here: it would wipe the saved choice and there would be nothing
# to check.
- launchApp:
    stopApp: true
    # Lampada does not use geolocation; the explicit list keeps Maestro from
    # poking locationd (simctl privacy location) right after a cold reboot,
    # where locationd hangs.
    permissions:
      notifications: allow
      microphone: allow
- assertVisible: "Почати молитву"
- assertNotVisible: "Begin prayer"
- tapOn:
    id: "settings-button"
- assertVisible:
    id: "interface-language-picker"
    text: ".*Українська.*"
- assertVisible: "НАЛАШТУВАННЯ"
- assertNotVisible: "SETTINGS"
