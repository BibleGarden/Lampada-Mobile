appId: twinkler
tags:
  - reminders
---
# REM-008: выключение тумблера отменяет все запланированные уведомления —
# после выключения ничего не приходит.
#
# Предусловия: прогон ios-rem-005 (две строки времени); /tmp/rem-set-time.yaml
# сгенерирован одной целью now+4мин для первой строки:
# gen-rem-set-time.mjs --init <текущее первое время> HH:MM.
- launchApp:
    stopApp: true
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "reminders-toggle"
    direction: DOWN
# Ближайшее время запланировано, тумблер включён.
- tapOn:
    id: "reminders-settings-button-0"
- assertVisible:
    id: "reminders-editor-modal"
- runFlow:
    file: /tmp/rem-set-time.yaml
- tapOn:
    id: "reminders-editor-done"
- assertVisible:
    id: "reminders-toggle"
    checked: true
# Выключили: планировщик снимает все свои уведомления.
- tapOn:
    id: "reminders-toggle"
- assertVisible:
    id: "reminders-toggle"
    checked: false
- openLink: "lampada://"
# Раннер дописывает в /tmp/rem-set-time.yaml sleep до «цель + 90 с»: к этому
# моменту баннера быть не должно.
- assertNotVisible: ".*(тишине с Богом|время помолиться|Он ждёт|минута молитвы|сказать Богу|Зажги лампаду|Помолимся|Побудь с Ним|станет легче|главному разговору|поблагодарить|Не спеши мимо).*"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-09-20-reminders/REM-008-no-banner
