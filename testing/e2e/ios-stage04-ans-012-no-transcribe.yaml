appId: twinkler
---
# ANS-012 (часть про UI): после остановки записи видны карточка и кнопка
# «Расшифровать», запроса нет — нет и состояния загрузки.
#
# Что сеть и токены действительно не тратятся, Maestro не доказывает: это
# ручная проверка прокси / логов сервера.
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- runFlow:
    when:
      notVisible:
        id: "setup-kicker"
    commands:
      - tapOn:
          id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "ANS-012 без расшифровки"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-answer-button"
- runFlow:
    when:
      notVisible:
        id: "answer-record-button"
    commands:
      - tapOn:
          id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- assertVisible:
    id: "recording-transcribe-0"
- assertVisible:
    id: "recording-transcribe-0"
- assertNotVisible:
    id: "recording-transcribing-0"
- assertNotVisible: "РАСШИФРОВКА"
- assertNotVisible: "Не удалось расшифровать"
