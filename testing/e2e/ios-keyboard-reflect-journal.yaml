appId: twinkler
tags:
  - main
---
# Plan section 9, iPhone: the keyboard in reflection and in journal search. The
# field and actions are not covered by the keyboard, a tap inside the field
# continues typing, a tap outside closes the keyboard without losing text.
#
# Keyboard visibility is checked via the locale-independent system keyboard
# identifiers: `shift` (the shift key) and `inputView` (the container used with
# `above:`); see ios-stage03-long-goal.yaml for details. The text before the
# tap inside the field is digits: a tap next to a word the spell checker
# considers misspelled would select it. The repeat tap is disabled for the same
# reason.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "Клавиатура в размышлении"
- tapOn:
    id: "setup-kicker"
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- longPressOn:
    id: "threshold-hold-button"
- assertVisible:
    id: "session-title"
- tapOn:
    id: "session-finish-button"
- assertVisible:
    id: "reflect-kicker"

# Reflection: with the keyboard up, the actions are hidden and the field sits
# above the keyboard
- tapOn:
    id: "reflection-input"
- inputText: "4821"
- assertVisible:
    id: "shift"
- assertNotVisible:
    id: "reflect-complete-button"
- tapOn:
    id: "reflection-input"
    retryTapIfNoChange: false
- assertVisible:
    id: "shift"
- inputText: " вывод"
- assertVisible:
    id: "reflection-input"
    text: "4821 вывод"
    above:
      id: "inputView"
- assertVisible:
    id: "reflect-question"
    above:
      id: "inputView"
# tap on the question — outside the field
- tapOn:
    id: "reflect-question"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "reflection-input"
    text: "4821 вывод"
- assertVisible:
    id: "reflect-return-button"
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"

# Journal search
- tapOn:
    id: "journal-button"
- tapOn:
    id: "journal-search-input"
- inputText: "4821"
- assertVisible:
    id: "shift"
- tapOn:
    id: "journal-search-input"
    retryTapIfNoChange: false
- assertVisible:
    id: "shift"
- inputText: " вывод"
- assertVisible:
    id: "journal-search-input"
    text: "4821 вывод"
    above:
      id: "inputView"
- tapOn:
    id: "journal-title"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "journal-search-input"
    text: "4821 вывод"
- assertVisible: ".*Клавиатура в размышлении.*"
