appId: twinkler
---
# ADR-0033: a finite prayer with music reaches zero in the background.
# Run through run-background-music-timer-end.sh: whether the music stopped is
# checked in the simulator audio log, which Maestro cannot see; the app is then
# resumed with ios-background-timer-resume.yaml.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "Background music timer end"
- hideKeyboard
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- tapOn:
    id: "session-music-off"
- assertVisible:
    id: "music-playing"
# Leave under two minutes, so that the deadline passes in the background: each
# Maestro command waits for the animated ring. Below 5:00 the step is one
# minute, so first let the timer drop under it.
- extendedWaitUntil:
    visible: "ЗАВЕДОМО-ЛОЖНЫЙ-МАРКЕР-ПАУЗЫ"
    timeout: 2000
    optional: true
- tapOn:
    id: "session-timer-button"
- tapOn:
    id: "session-time-subtract"
    retryTapIfNoChange: false
- tapOn:
    id: "session-time-subtract"
    retryTapIfNoChange: false
- tapOn:
    id: "session-time-subtract"
    retryTapIfNoChange: false
- assertVisible:
    id: "music-playing"
- pressKey: HOME
# Maestro has no sleep command: a deliberately false wait lets the deadline pass.
- extendedWaitUntil:
    visible: "ЗАВЕДОМО-ЛОЖНЫЙ-МАРКЕР-ПАУЗЫ"
    timeout: 150000
    optional: true
