appId: twinkler
tags:
  - main
---
# ANS-005/006/008/028: player controls, persistence after reopening, deletion,
# and ownership by different questions. Audio content is verified separately on
# the physical iPad; this flow checks deterministic UI/store behavior.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "Persistence голосовых записей"
- hideKeyboard
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recording-play-0"
- assertVisible:
    id: "recording-play-0"
- tapOn:
    id: "recording-play-0"
- assertVisible:
    id: "recording-play-0"
- tapOn:
    id: "recordings-record-button"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-1"
- tapOn:
    id: "recordings-close-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- tapOn:
    id: "dock-answer-edit-button"
- tapOn:
    id: "answer-record-button"
- assertVisible:
    id: "recording-card-0"
- assertVisible:
    id: "recording-card-1"
- doubleTapOn:
    id: "recording-delete-0"
- assertNotVisible:
    id: "recording-card-1"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recording-play-0"
- assertVisible:
    id: "recording-play-0"
- tapOn:
    id: "recording-play-0"
- tapOn:
    id: "recordings-close-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertVisible:
    id: "dock-answer-edit-button"
- tapOn:
    point: "84%,91%"
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recordings-close-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- tapOn:
    point: "16%,91%"
- tapOn:
    id: "dock-answer-edit-button"
- tapOn:
    id: "answer-record-button"
- assertVisible:
    id: "recording-card-0"
- assertNotVisible:
    id: "recording-card-1"
