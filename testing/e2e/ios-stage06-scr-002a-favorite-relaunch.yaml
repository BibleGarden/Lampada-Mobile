appId: twinkler
tags:
  - prepared
# NEEDS-STUB: run-stub-phase.sh resets the stub counter between the parts
# (POST /__control {"resetScripture":true}) — both sessions get the first
# fixture (Psalm 22), so the favorites are comparable. Not included in tagged
# runs.
---
# SCR-002 (part 1): add a passage to favorites and relaunch the app.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-002 favorite relaunch"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- tapOn:
    id: "dock-scripture-favorite"
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: SCR-002-before-relaunch
