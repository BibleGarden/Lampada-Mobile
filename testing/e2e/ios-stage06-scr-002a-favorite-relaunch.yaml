appId: twinkler
# NEEDS-STUB: run-stub-phase.sh сбрасывает счётчик stub между частями
# (POST /__control {"resetScripture":true}) — обе сессии получают первую
# фикстуру (Псалом 22), поэтому избранное сопоставимо. В теговые прогоны не входит.
---
# SCR-002 (часть 1): добавить отрывок в избранное и перезапустить приложение.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-002 favorite relaunch"
- hideKeyboard
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- tapOn:
    id: "dock-scripture-favorite"
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: SCR-002-before-relaunch
