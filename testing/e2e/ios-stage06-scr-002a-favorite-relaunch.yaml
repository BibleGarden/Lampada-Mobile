appId: twinkler
# NEEDS-STUB: run-stub-phase.sh сбрасывает счётчик stub между частями
# (POST /__control {"resetScripture":true}) — обе сессии получают первую
# фикстуру (Псалом 22), поэтому избранное сопоставимо. В теговые прогоны не входит.
---
# SCR-002 (часть 1): добавить отрывок в избранное и перезапустить приложение.
- launchApp:
    stopApp: true
    clearState: true
- tapOn: "Начать молитву"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-002 favorite relaunch"
- hideKeyboard
- tapOn: "5"
- tapOn: "Далее"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "МОЛИТВА"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- tapOn: "В избранное"
- assertVisible: "В избранном"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-09-20-stub/SCR-002-before-relaunch
