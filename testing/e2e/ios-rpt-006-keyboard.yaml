appId: twinkler
tags:
  - main
---
# RPT-006: actions stay above the keyboard; dismissal retains the comment.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      notifications: allow
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: RPT-006 keyboard
- pressKey: Enter
- tapOn:
    id: setup-preset-0
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: privacy-consent-core_prayer_ai-allow
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: session-title
- extendedWaitUntil:
    visible:
      id: question-report-button
    timeout: 30000
- tapOn:
    id: question-report-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: content-report-dialog
- tapOn:
    id: content-report-comment
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: 6217
- assertVisible:
    id: inputView
- takeScreenshot: RPT-006-keyboard-actions
- assertVisible:
    id: content-report-send
    above:
      id: inputView
- assertVisible:
    id: content-report-cancel
    above:
      id: inputView
- assertVisible:
    id: content-report-comment
    above:
      id: inputView
# Tap the open left edge of the background, not its centre under the card.
- tapOn:
    point: "3%,10%"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible:
    id: inputView
- assertVisible:
    id: content-report-comment
    text: 6217
- tapOn:
    id: content-report-comment
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
# inputText raises the on-screen keyboard even with a hardware one attached.
# Digits do not trigger the spell-check menu on a repeated tap.
- inputText: "x"
- copyTextFrom:
    id: content-report-comment
- assertTrue: ${ maestro.copiedText.replace('x', '') === '6217' && maestro.copiedText.includes('x') }
- assertVisible:
    id: inputView
- tapOn:
    id: content-report-send
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: content-report-done
    timeout: 20000
- assertVisible: "Спасибо. Мы её проверим.|Thank you. We will review it.|Дякуємо. Ми її перевіримо."
- assertNotVisible:
    id: inputView
- takeScreenshot: RPT-006-sent
- tapOn:
    id: content-report-done
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible:
    id: content-report-dialog
- assertVisible:
    id: session-title
