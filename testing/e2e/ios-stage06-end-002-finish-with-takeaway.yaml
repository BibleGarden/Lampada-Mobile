appId: twinkler
tags:
  - critical
---
# END-002: a saved takeaway returns directly Home and remains in the journal.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "END-002 с выводом"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
# по testID, а не по точке: на iPhone SE в 47% высоты лежит вопрос, а не поле
- tapOn:
    id: "reflection-input"
- inputText: "END-002 вывод молитвы"
# Кикер «ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ» скрывается при открытой клавиатуре
# (app/reflect.tsx:144) — гасим клавиатуру через Enter (как в smoke-full).
- pressKey: Enter
- assertVisible:
    id: "reflect-complete-button"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/END-002-reflect-filled
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
- assertVisible:
    id: "prayer-saved-notice"
- assertVisible:
    id: "journal-button"
- assertVisible:
    id: "home-title-lit"
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- assertVisible: ".*END-002 с выводом.*"
- assertVisible: ".*END-002 вывод молитвы.*"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/END-002-journal-takeaway
