appId: twinkler
---
# END-002: a saved takeaway is shown on the final screen and in the journal.
- launchApp:
    stopApp: true
    clearState: true
- tapOn: "Начать молитву"
- tapOn:
    point: "50%,37%"
- inputText: "END-002 с выводом"
- hideKeyboard
- tapOn: "5"
- tapOn: "Далее"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "МОЛИТВА"
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    point: "10%,11%"
- assertVisible: "ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ"
- tapOn:
    point: "50%,47%"
- inputText: "END-002 вывод молитвы"
- tapOn: "ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ"
- assertVisible: "Сохранить и завершить"
- takeScreenshot: /Users/maria/Desktop/Dev/pray/testing/evidence/2026-08-22-stage06/END-002-reflect-filled
- tapOn: "Сохранить и завершить"
- assertVisible: "Огонёк горит"
- assertVisible: "ТЫ ВЫНЕС ИЗ МОЛИТВЫ"
- assertVisible: ".*END-002 вывод молитвы.*"
- takeScreenshot: /Users/maria/Desktop/Dev/pray/testing/evidence/2026-08-22-stage06/END-002-done-takeaway-card
- tapOn: "На главную"
- assertVisible: "Огонёк горит"
- tapOn:
    point: "76%,12%"
- assertVisible: "ДНЕВНИК"
- assertVisible: ".*END-002 с выводом.*"
- assertVisible: ".*END-002 вывод молитвы.*"
- takeScreenshot: /Users/maria/Desktop/Dev/pray/testing/evidence/2026-08-22-stage06/END-002-journal-takeaway
