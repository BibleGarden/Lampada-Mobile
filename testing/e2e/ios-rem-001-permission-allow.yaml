appId: twinkler
tags:
  - reminders
  - prepared
---
# REM-001: the first enabling of reminders shows the system prompt exactly
# once, at the moment of enabling, not at app start.
# Precondition: a clean install after the REM-002 run (permission undetermined),
# onboarding completed.
- launchApp:
    stopApp: true
# App launch shows no system dialog — otherwise the next assert would see it
# on top of Home.
- assertVisible:
    id: "start-prayer-button"
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "reminders-toggle"
    direction: DOWN
- tapOn:
    id: "reminders-toggle"
- assertVisible: ".*уведомления.*"
- tapOn: "Разрешить"
# Allowed: the toggle is on, the schedule row has appeared.
- assertVisible:
    id: "reminders-toggle"
    checked: true
- assertVisible:
    id: "reminders-summary"
- assertVisible: ".*Настроить расписание 1: Каждый день: 09:00.*"
# Toggling off/on again without a system permission change does not ask again.
- tapOn:
    id: "reminders-toggle"
- assertVisible:
    id: "reminders-toggle"
    checked: false
- tapOn:
    id: "reminders-toggle"
- assertVisible:
    id: "reminders-toggle"
    checked: true
- assertVisible:
    id: "reminders-summary"
