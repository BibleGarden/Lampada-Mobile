appId: twinkler
tags:
  - prepared
---
# LOCK-005: only someone who knows the current code can disable protection.
# Cancelling and a wrong entry do not remove it; after a successful removal the
# cold start opens the app straight away.
#
# Precondition: PIN 9876 enabled (state after ios-lock-004).
- launchApp:
    stopApp: true
- assertVisible:
    id: "lock-screen"
- tapOn:
    id: "pin-key-9"
- tapOn:
    id: "pin-key-8"
- tapOn:
    id: "pin-key-7"
- tapOn:
    id: "pin-key-6"
- assertVisible:
    id: "start-prayer-button"

- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN

# Cancelling the code prompt keeps protection enabled.
#
# The second tap on "Cancel" works around the same behaviour as on the home
# screen: a tap that lands while the overlay is appearing never reaches the
# handler.
- tapOn:
    id: "lock-toggle"
- assertVisible:
    id: "pin-prompt-disable-current"
- assertVisible: "Подтверди, что это ты выключаешь защиту"
- tapOn:
    id: "pin-prompt-cancel"
- runFlow:
    when:
      visible:
        id: "pin-prompt"
    commands:
      - tapOn:
          id: "pin-prompt-cancel"
- assertNotVisible:
    id: "pin-prompt"
- assertVisible:
    id: "change-pin-button"

# A wrong code does not disable protection.
- tapOn:
    id: "lock-toggle"
- assertVisible:
    id: "pin-prompt-disable-current"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-1"
- extendedWaitUntil:
    visible: "Неверный пин-код"
    timeout: 5000
- assertVisible:
    id: "pin-prompt"

# The correct code removes protection: the change-PIN row disappears and the
# hint again offers to set up a code.
- tapOn:
    id: "pin-key-9"
- tapOn:
    id: "pin-key-8"
- tapOn:
    id: "pin-key-7"
- tapOn:
    id: "pin-key-6"
- extendedWaitUntil:
    notVisible:
      id: "pin-prompt"
    timeout: 5000
- assertNotVisible:
    id: "change-pin-button"

# The cold start no longer asks for the code.
- launchApp:
    stopApp: true
- assertVisible:
    id: "start-prayer-button"
- assertNotVisible:
    id: "lock-screen"
