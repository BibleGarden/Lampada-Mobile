appId: twinkler
tags:
  - main
---
# ANS-032 and the keyboard in the answer sheet (plan section 9), iPhone.
# Recordings open, a recording plays and pauses, the chevron closes the
# recordings — the answer field and actions stay usable; likewise after a
# keyboard cycle. The keyboard does not cover the field and "Save"; a tap inside
# the field continues typing; the question and the sheet handle close the
# keyboard without losing text; a tap on the scrim does not discard the unsaved
# answer; after saving, the scrim goes away and the session screen is tappable.
#
# Keyboard visibility is checked via the locale-independent system keyboard
# identifiers `shift` and `inputView` (see ios-stage03-long-goal.yaml). The text
# before the tap inside the field is digits, and the repeat tap is disabled:
# otherwise iOS would select the word and typing would replace it.
- launchApp:
    stopApp: true
    clearState: true
    # the microphone system dialog is localized — grant the permission up front
    permissions:
      microphone: allow
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "Записи и клавиатура"
- tapOn:
    id: "setup-kicker"
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- longPressOn:
    id: "threshold-hold-button"
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-answer-button"
- waitForAnimationToEnd:
    timeout: 2000

# No recordings yet — the recordings sheet opens straight into recording
- tapOn:
    id: "answer-record-button"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recording-play-0"
- assertVisible:
    id: "recording-play-0"
    text: "Пауза, запись 1"
- tapOn:
    id: "recording-play-0"
- assertVisible:
    id: "recording-play-0"
    text: "Прослушать запись 1"
- tapOn:
    id: "recordings-close-button"
- assertNotVisible:
    id: "recordings-close-button"
- assertVisible:
    id: "answer-save-button"

# Keyboard cycle
- tapOn:
    id: "answer-input"
- inputText: "3217"
- assertVisible:
    id: "shift"
- tapOn:
    id: "answer-input"
    retryTapIfNoChange: false
- assertVisible:
    id: "shift"
- inputText: " ответ"
- assertVisible:
    id: "answer-input"
    text: "3217 ответ"
    above:
      id: "inputView"
- assertVisible:
    id: "answer-save-button"
    above:
      id: "inputView"
- tapOn:
    id: "answer-question"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "answer-input"
    text: "3217 ответ"
- tapOn:
    id: "answer-input"
- inputText: " дальше"
- assertVisible:
    id: "shift"
- tapOn:
    id: "answer-sheet-handle"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "answer-input"
    text: "3217 ответ дальше"
# Scrim above the sheet (the sheet sits at 62% of the height): with an
# unsaved answer, tapping it does not dismiss anything
- tapOn:
    point: "50%,20%"
- assertVisible:
    id: "answer-input"
    text: "3217 ответ дальше"

# Recordings after the keyboard cycle: open as a list, play, and close with
# the chevron
- tapOn:
    id: "answer-record-button"
- assertVisible:
    id: "recording-card-0"
- assertVisible:
    id: "recordings-record-button"
- tapOn:
    id: "recording-play-0"
- assertVisible:
    id: "recording-play-0"
    text: "Пауза, запись 1"
- tapOn:
    id: "recording-play-0"
- assertVisible:
    id: "recording-play-0"
    text: "Прослушать запись 1"
- tapOn:
    id: "recordings-close-button"
- assertNotVisible:
    id: "recordings-close-button"
- assertVisible:
    id: "answer-input"
    text: "3217 ответ дальше"
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
# the scrim is gone along with the sheet: the dock button beneath it is tappable
- tapOn:
    id: "dock-answer-edit-button"
- assertVisible:
    id: "answer-input"
    text: "3217 ответ дальше"
- assertVisible:
    id: "answer-record-badge"
