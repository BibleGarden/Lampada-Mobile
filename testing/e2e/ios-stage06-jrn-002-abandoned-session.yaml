appId: twinkler
tags:
  - main
---
# JRN-002: a prayer abandoned with no answers and no takeaway never reaches the journal.
- launchApp:
    stopApp: true
    clearState: false
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "JRN-002 брошенная сессия"
- hideKeyboard
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- takeScreenshot: JRN-002-session-started
# kill the app mid-prayer: nothing was answered, nothing was concluded
- stopApp
- launchApp:
    stopApp: false
    clearState: false
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- assertVisible:
    id: "journal-empty-state"
- assertNotVisible: "JRN-002 брошенная сессия"
- takeScreenshot: JRN-002-journal-after-abandon
