appId: twinkler
tags:
  - prepared
# Only through run-lock-storage-check.sh (LOCK-011): the script simultaneously
# writes the device system log and greps the app container.
---
# LOCK-011 (part 2): entering a wrong and the correct PIN while the log is
# being recorded. The script has already checked the container; here we
# generate PIN entry events.
#
# Preconditions: protection enabled with PIN 123456 (see run-lock-storage-check.sh).
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "lock-screen"
# Wrong PIN (000000): does not unlock, the error is shown.
- tapOn:
    id: "pin-key-0"
- tapOn:
    id: "pin-key-0"
- tapOn:
    id: "pin-key-0"
- tapOn:
    id: "pin-key-0"
- tapOn:
    id: "pin-key-0"
- tapOn:
    id: "pin-key-0"
- assertVisible: "Неверный пин-код"
# Correct PIN: unlocks.
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"
- assertNotVisible:
    id: "lock-screen"
- assertVisible:
    id: "settings-button"
