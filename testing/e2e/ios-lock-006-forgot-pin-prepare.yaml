appId: twinkler
---
# LOCK-006, подготовка: завести запись в дневнике и включить пин 4321, чтобы
# следующий сценарий мог доказать, что стирание убирает именно пользовательские
# данные, а не только ключи защиты.
#
# Повторный тап по кнопке на главной — защита от dev-баннера LogBox, съедавшего
# первый тап (86cbbqzcj; источники устранены, ретрай оставлен на случай новых
# предупреждений). Клавиатура закрывается кнопкой «Готово»,
# а не `hideKeyboard`: свайп закрытия клавиатуры уводит и сам лист настройки
# молитвы.
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "start-prayer-button"
# Явная проверка предусловия. Оверлеи блокировки модальны для дерева доступности
# (accessibilityViewIsModal), поэтому «Начать молитву» уже само по себе говорит
# о снятой защите — но проверка оставлена: она ловит регресс этой модальности,
# а не только состояние защиты.
- assertNotVisible:
    id: "lock-screen"
- tapOn:
    id: "start-prayer-button"
- runFlow:
    when:
      notVisible:
        id: "setup-kicker"
    commands:
      - tapOn:
          id: "start-prayer-button"
- extendedWaitUntil:
    visible:
      id: "setup-kicker"
    timeout: 8000
- tapOn:
    point: "50%,37%"
- inputText: "LOCK-006 запись"
- tapOn: "Готово"
- assertVisible: "LOCK-006 запись"
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- extendedWaitUntil:
    visible: ".*5 минут.*LOCK-006 запись.*"
    timeout: 8000
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 450
- assertVisible:
    id: "threshold-hold-button"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflection-input"
- inputText: "LOCK-006 вывод"
- pressKey: Enter
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
- assertVisible:
    id: "journal-button"
# Запись действительно в дневнике.
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- assertVisible: ".*LOCK-006 запись.*"
- tapOn:
    point: "10%,11%"

# Включить пин 4321.
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
- tapOn:
    id: "lock-toggle"
- assertVisible:
    id: "pin-prompt-enable-create"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-confirm"
- assertVisible:
    id: "pin-prompt-enable-repeat"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-confirm"
- assertNotVisible:
    id: "pin-prompt"
- assertVisible:
    id: "change-pin-button"
