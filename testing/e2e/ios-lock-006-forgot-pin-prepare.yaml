appId: twinkler
---
# LOCK-006, подготовка: завести запись в дневнике и включить пин 4321, чтобы
# следующий сценарий мог доказать, что стирание убирает именно пользовательские
# данные, а не только ключи защиты.
#
# Повторный тап по кнопке на главной — защита от dev-баннера LogBox, съедавшего
# первый тап (86cbbqzcj; источники устранены, ретрай оставлен на случай новых
# предупреждений). Клавиатура закрывается кнопкой «Готово»,
# а не `hideKeyboard`: свайп закрытия клавиатуры уводит и сам лист настройки
# молитвы.
- launchApp:
    stopApp: true
    clearState: true
- assertVisible: "Начать молитву"
# Явная проверка предусловия. Оверлеи блокировки модальны для дерева доступности
# (accessibilityViewIsModal), поэтому «Начать молитву» уже само по себе говорит
# о снятой защите — но проверка оставлена: она ловит регресс этой модальности,
# а не только состояние защиты.
- assertNotVisible:
    id: "lock-screen"
- tapOn: "Начать молитву"
- runFlow:
    when:
      notVisible: "ПЕРЕД МОЛИТВОЙ"
    commands:
      - tapOn: "Начать молитву"
- extendedWaitUntil:
    visible: "ПЕРЕД МОЛИТВОЙ"
    timeout: 8000
- tapOn:
    point: "50%,37%"
- inputText: "LOCK-006 запись"
- tapOn: "Готово"
- assertVisible: "LOCK-006 запись"
- tapOn: "5"
- tapOn: "Далее"
- extendedWaitUntil:
    visible: ".*5 минут.*LOCK-006 запись.*"
    timeout: 8000
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 450
- assertVisible: "НАЖМИ И ДЕРЖИ"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "МОЛИТВА"
- tapOn:
    point: "10%,11%"
- assertVisible: "ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ"
- tapOn: "Одна-две строки…"
- inputText: "LOCK-006 вывод"
- pressKey: Enter
- tapOn: "Сохранить и завершить"
- assertVisible: "Огонёк горит"
- tapOn: "На главную"
# Защита от dev-баннера LogBox поверх нижней кнопки (86cbbqzcj). Известные
# источники предупреждений устранены, ветка обычно пропускается; ретрай
# оставлен на случай новых предупреждений в dev-сборке.
- runFlow:
    when:
      notVisible:
        id: "journal-button"
    commands:
      - tapOn: "На главную"

# Запись действительно в дневнике.
- tapOn:
    id: "journal-button"
- assertVisible: "ДНЕВНИК"
- assertVisible: ".*LOCK-006 запись.*"
- tapOn:
    point: "10%,11%"

# Включить пин 4321.
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
- tapOn:
    id: "lock-toggle"
- assertVisible: "Придумайте пин-код"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-confirm"
- assertVisible: "Повторите пин-код"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-confirm"
- assertNotVisible:
    id: "pin-prompt"
- assertVisible:
    id: "change-pin-button"
