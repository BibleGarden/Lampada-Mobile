appId: twinkler
tags:
  - prepared
---
# LOCK-006, preparation: create a journal entry and enable PIN 4321 so that the
# next scenario can prove the wipe removes the user data itself, not only the
# protection keys.
#
# The repeated tap on the home button guards against the LogBox dev banner that
# swallowed the first tap (86cbbqzcj; the sources are fixed, the retry stays in
# case of new warnings). The keyboard is closed with the Enter key (on the goal
# field it reads "Done"), not with `hideKeyboard`: the keyboard-dismiss swipe
# also drags away the prayer setup sheet.
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "start-prayer-button"
# An explicit precondition check. Lock overlays are modal for the accessibility
# tree (accessibilityViewIsModal), so "Start prayer" being visible already
# implies protection is off — but the check stays: it catches a regression of
# that modality, not only the protection state.
- assertNotVisible:
    id: "lock-screen"
- tapOn:
    id: "start-prayer-button"
- runFlow:
    when:
      notVisible:
        id: "setup-kicker"
    commands:
      - tapOn:
          id: "start-prayer-button"
- extendedWaitUntil:
    visible:
      id: "setup-kicker"
    timeout: 8000
- tapOn:
    point: "50%,37%"
- inputText: "LOCK-006 запись"
- pressKey: Enter
- assertVisible: "LOCK-006 запись"
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- extendedWaitUntil:
    visible: ".*5 минут.*LOCK-006 запись.*"
    timeout: 8000
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 450
- assertVisible:
    id: "threshold-hold-button"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflection-input"
- inputText: "LOCK-006 вывод"
- pressKey: Enter
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
- assertVisible:
    id: "journal-button"
# The entry is really in the journal.
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- assertVisible: ".*LOCK-006 запись.*"
- tapOn:
    point: "10%,11%"

# Enable PIN 4321.
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
- tapOn:
    id: "lock-toggle"
- assertVisible:
    id: "pin-prompt-enable-create"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-confirm"
- assertVisible:
    id: "pin-prompt-enable-repeat"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-confirm"
- assertNotVisible:
    id: "pin-prompt"
- assertVisible:
    id: "change-pin-button"
