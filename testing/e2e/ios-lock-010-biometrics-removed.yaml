appId: twinkler
tags:
  - prepared
# Only through run-lock-biometrics.sh: the script unenrolls the template before the start.
---
# LOCK-010: after the biometric templates are removed from the system, the lock
# screen no longer offers Face ID, while the PIN keeps working.
#
# Preconditions: PIN 123456, biometrics enabled (009a/009b run). The script has
# performed the unenroll: no templates remain in the system, but the app's
# biometrics flag has persisted.
- launchApp:
    stopApp: true
# LockGate initializes asynchronously: wait for the lock screen to appear.
- extendedWaitUntil:
    visible:
      id: "lock-screen"
    timeout: 10000
- assertVisible:
    id: "lock-pin-title"
# Face ID is no longer offered: neither the biometrics login button nor the
# automatic prompt (it is unavailable without an enrolled template).
- assertNotVisible:
    id: "pin-key-biometry"
# The PIN works.
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"
- assertNotVisible:
    id: "lock-screen"
- assertVisible:
    id: "settings-button"
- takeScreenshot: LOCK-010-pin-after-unenroll

# Tear down protection: biometrics is disabled together with the PIN.
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
- tapOn:
    id: "lock-toggle"
- assertVisible:
    id: "pin-prompt-disable-current"
- tapOn:
    id: "pin-key-1"
- tapOn:
    id: "pin-key-2"
- tapOn:
    id: "pin-key-3"
- tapOn:
    id: "pin-key-4"
- tapOn:
    id: "pin-key-5"
- tapOn:
    id: "pin-key-6"
- assertNotVisible:
    id: "change-pin-button"
- assertNotVisible:
    id: "biometrics-toggle"
- takeScreenshot: LOCK-010-lock-disabled
