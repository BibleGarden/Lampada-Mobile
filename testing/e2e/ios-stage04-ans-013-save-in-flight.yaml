appId: twinkler
tags:
  - prepared
---
# ANS-013: after "Transcribe" a loading state appears, and after 4 s — the
# hint "you can close the window". Close the recordings sheet and save while
# the request is in flight: "Save" waits for the answer, and after reopening
# the recording has the transcription text. Stub flow: run-stub-phase.sh,
# transcription=delay mode (the answer arrives after 12 s).
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- runFlow:
    when:
      notVisible:
        id: "setup-kicker"
    commands:
      - tapOn:
          id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "ANS-013 сохранение в полёте"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-answer-button"
- runFlow:
    when:
      notVisible:
        id: "answer-record-button"
    commands:
      - tapOn:
          id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "recordings-stop-button"
- tapOn:
    id: "recording-transcribe-0"
- assertVisible:
    id: "privacy-consent-audio_transcription"
- tapOn:
    id: "privacy-consent-audio_transcription-allow"
- assertVisible:
    id: "recording-transcribing-0"
- extendedWaitUntil:
    visible:
      id: "recording-transcription-hint-0"
    timeout: 8000
- takeScreenshot: ANS-013-transcription-hint
- tapOn:
    id: "recordings-close-button"
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
# Saving waits for the transcription (up to 60 s, lib/transcription.ts).
- extendedWaitUntil:
    visible:
      id: "dock-answer-edit-button"
    timeout: 70000
- tapOn:
    id: "dock-answer-edit-button"
- tapOn:
    id: "answer-record-button"
- assertVisible:
    id: "recording-card-0"
- assertVisible: ".*Стабильная расшифровка лампады номер семь.*"
