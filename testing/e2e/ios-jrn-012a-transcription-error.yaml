appId: twinkler
# NEEDS-STUB: режим fail выставлен через POST /__control (run-jrn-transcription.sh).
---
# JRN-012 (часть 1): ошибка расшифровки — запись остаётся доступной,
# предложен повтор.
- launchApp:
    stopApp: true
    clearState: true
- tapOn: "Начать молитву"
- tapOn:
    point: "50%,37%"
- inputText: "JRN-012 повтор расшифровки"
- hideKeyboard
- tapOn: "5"
- tapOn: "Далее"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "МОЛИТВА"
- tapOn: "Ответить"
- tapOn:
    id: "answer-record-button"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recordings-close-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    point: "10%,11%"
- assertVisible: "ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ"
- tapOn: "Завершить"
- assertVisible:
    id: "prayer-saved-notice"
- tapOn:
    id: "journal-button"
- assertVisible: "ДНЕВНИК"
- tapOn: ".*JRN-012 повтор расшифровки.*"
- assertVisible: ".*Аудиозапись ·.*"
# Stub в режиме fail: ошибка понятна, аудио на месте, есть кнопка повтора.
- tapOn: "Расшифровать"
- runFlow:
    when:
      visible:
        id: "privacy-consent-audio_transcription"
    commands:
      - tapOn:
          id: "privacy-consent-audio_transcription-allow"
- extendedWaitUntil:
    visible: "Не удалось расшифровать"
    timeout: 30000
- assertVisible: "Повторить"
- assertVisible: ".*Аудиозапись ·.*"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-09-20-jrn/JRN-012-error
