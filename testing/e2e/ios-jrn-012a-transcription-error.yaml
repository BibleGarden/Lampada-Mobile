appId: twinkler
tags:
  - prepared
# NEEDS-STUB: fail mode is set via POST /__control (run-jrn-transcription.sh).
---
# JRN-012 (part 1): transcription error — the recording stays available,
# a retry is offered.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "JRN-012 повтор расшифровки"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recordings-close-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "prayer-saved-notice"
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- tapOn: ".*JRN-012 повтор расшифровки.*"
- assertVisible:
    id: "journal-recording-0"
# Stub in fail mode: the error is clear, the audio is intact, and a retry button is shown.
- tapOn:
    id: "journal-recording-0-transcribe"
- runFlow:
    when:
      visible:
        id: "privacy-consent-audio_transcription"
    commands:
      - tapOn:
          id: "privacy-consent-audio_transcription-allow"
- extendedWaitUntil:
    visible: "Сервис расшифровки сейчас недоступен. Попробуй позже."
    timeout: 30000
- assertVisible:
    id: "journal-recording-0-transcribe"
- assertVisible:
    id: "journal-recording-0"
- takeScreenshot: JRN-012-error
