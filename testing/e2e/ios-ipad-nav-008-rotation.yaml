appId: twinkler
tags:
  - ipad
---
# NAV-008 (iPad): Home and the secondary screen survive portrait→landscape→
# portrait rotations — elements stay in place and tappable. Background coverage
# in screenshots is reviewed by a human; Maestro cannot reproduce "JS busy
# during rotation".
- launchApp:
    stopApp: true
    clearState: true
- setOrientation: PORTRAIT
- assertVisible:
    id: "home-title"
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "home-title"
- assertVisible:
    id: "start-prayer-button"
- assertVisible:
    id: "journal-button"
- assertVisible:
    id: "settings-button"
- takeScreenshot: NAV-008-home-landscape
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "start-prayer-button"
- takeScreenshot: NAV-008-home-portrait
# secondary screen: rotate while on Settings, then return home in landscape
- tapOn:
    id: "settings-button"
- assertVisible:
    id: "settings-back-button"
- setOrientation: LANDSCAPE_RIGHT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "settings-back-button"
- assertVisible:
    id: "interface-language-selector"
- takeScreenshot: NAV-008-settings-landscape
- tapOn:
    id: "settings-back-button"
- assertVisible:
    id: "start-prayer-button"
- takeScreenshot: NAV-008-home-back-landscape
- setOrientation: PORTRAIT
- assertVisible:
    id: "start-prayer-button"
