appId: twinkler
tags:
  - rare
---
# SCR-003: long scripture opens in a scrollable reader without losing controls.
- launchApp:
    stopApp: true
    clearState: true
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Open|Открыть"
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Cancel"
- tapOn:
    point: "92%,93%"
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible:
        id: "start-prayer-button"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          id: "start-prayer-button"
- runFlow:
    when:
      visible:
        id: "start-prayer-button"
    commands:
      - tapOn:
          id: "start-prayer-button"
- assertVisible:
    id: "setup-kicker"
- tapOn:
    id: "setup-examples-button"
- tapOn:
    point: "50%,34%"
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
# Режим цитаты открывается табом дока (CompanionDock.tsx:144), а не точкой:
# на старом месте координаты теперь кнопка жалобы на вопрос.
- tapOn:
    id: "dock-scripture-tab"
- assertVisible:
    id: "dock-scripture-favorite"
- tapOn:
    id: "dock-scripture-favorite"
# После добавления надпись меняется на «В избранном» (CompanionDock.tsx:368) —
# ждём её, затем листаем к следующему отрывку, где состояние сброшено.
- assertVisible:
    id: "dock-scripture-favorite-active"
- tapOn:
    id: "dock-scripture-next"
- tapOn:
    id: "dock-scripture-favorite"
- assertVisible:
    id: "dock-scripture-favorite-active"
- tapOn:
    id: "dock-scripture-next"
- tapOn:
    id: "dock-scripture-favorite"
- assertVisible:
    id: "dock-scripture-favorite-active"
- tapOn:
    id: "dock-scripture-next"
# Конкретный отрывок не фиксируем: список цитат зависит от ответа сервера
# (в 08-22 флоу жил на старых фикстурах). Проверяем, что 4-й отрывок загружен.
- assertVisible:
    id: "scripture-audio-button"
- assertVisible:
    id: "scripture-read-full"
- tapOn:
    id: "scripture-read-full"
- takeScreenshot: SCR-003-long-reader-top
- swipe:
    start: "50%,78%"
    end: "50%,30%"
    duration: 800
- takeScreenshot: SCR-003-long-reader-bottom
