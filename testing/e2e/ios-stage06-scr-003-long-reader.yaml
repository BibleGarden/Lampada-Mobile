appId: twinkler
tags:
  - rare
---
# SCR-003: long scripture opens in a scrollable reader without losing controls.
- launchApp:
    stopApp: true
    clearState: true
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Open"
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Cancel"
- tapOn:
    point: "92%,93%"
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Начать молитву"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn: "Начать молитву"
- runFlow:
    when:
      visible: "Начать молитву"
    commands:
      - tapOn: "Начать молитву"
- assertVisible: "ПЕРЕД МОЛИТВОЙ"
- tapOn: "?"
- tapOn:
    point: "50%,34%"
- tapOn: "5"
- tapOn: "Далее"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
# Режим цитаты открывается табом дока (CompanionDock.tsx:144), а не точкой:
# на старом месте координаты теперь кнопка жалобы на вопрос.
- tapOn:
    id: "dock-scripture-tab"
- assertVisible: "В избранное"
- tapOn: "В избранное"
# После добавления надпись меняется на «В избранном» (CompanionDock.tsx:368) —
# ждём её, затем листаем к следующему отрывку, где состояние сброшено.
- assertVisible: "В избранном"
- tapOn:
    id: "dock-scripture-next"
- tapOn: "В избранное"
- assertVisible: "В избранном"
- tapOn:
    id: "dock-scripture-next"
- tapOn: "В избранное"
- assertVisible: "В избранном"
- tapOn:
    id: "dock-scripture-next"
# Конкретный отрывок не фиксируем: список цитат зависит от ответа сервера
# (в 08-22 флоу жил на старых фикстурах). Проверяем, что 4-й отрывок загружен.
- assertVisible:
    id: "scripture-audio-button"
- assertVisible: "Читать отрывок целиком"
- tapOn: "Читать отрывок целиком"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/SCR-003-long-reader-top
- swipe:
    start: "50%,78%"
    end: "50%,30%"
    duration: 800
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/SCR-003-long-reader-bottom
