appId: twinkler
tags:
  - rare
---
# SCR-003: long scripture opens in a scrollable reader without losing controls.
- launchApp:
    stopApp: true
    clearState: true
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Open|Открыть"
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Cancel"
- tapOn:
    point: "92%,93%"
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible:
        id: "start-prayer-button"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          id: "start-prayer-button"
- runFlow:
    when:
      visible:
        id: "start-prayer-button"
    commands:
      - tapOn:
          id: "start-prayer-button"
- assertVisible:
    id: "setup-kicker"
- tapOn:
    id: "setup-examples-button"
- tapOn:
    point: "50%,34%"
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
# The scripture mode is opened via the dock tab (CompanionDock.tsx:144), not
# by point: the report-question button now sits at the old coordinates.
- tapOn:
    id: "dock-scripture-tab"
- assertVisible:
    id: "dock-scripture-favorite"
- tapOn:
    id: "dock-scripture-favorite"
# After favoriting, the label changes to «В избранном»
# (components.reader.saved, CompanionDock.tsx:368) — wait for it, then page
# to the next passage, where the state is reset.
- assertVisible:
    id: "dock-scripture-favorite-active"
- tapOn:
    id: "dock-scripture-next"
- tapOn:
    id: "dock-scripture-favorite"
- assertVisible:
    id: "dock-scripture-favorite-active"
- tapOn:
    id: "dock-scripture-next"
- tapOn:
    id: "dock-scripture-favorite"
- assertVisible:
    id: "dock-scripture-favorite-active"
- tapOn:
    id: "dock-scripture-next"
# No specific passage is pinned: the quotation list depends on the server's
# answer (in the 08-22 run the flow lived on old fixtures). We check that the
# 4th passage has loaded.
- assertVisible:
    id: "scripture-audio-button"
- assertVisible:
    id: "scripture-read-full"
- tapOn:
    id: "scripture-read-full"
- takeScreenshot: SCR-003-long-reader-top
- swipe:
    start: "50%,78%"
    end: "50%,30%"
    duration: 800
- takeScreenshot: SCR-003-long-reader-bottom
