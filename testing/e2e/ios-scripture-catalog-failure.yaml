appId: twinkler
tags:
  - prepared
---
# SCR-013, phase 1 of 3: scripts/test-scripture-initialization.py sets
# catalog=fail and checks that the simulator's primary language is Russian.
# The clean install shows no Bible choice, the prayer still starts, and the
# scripture block shows the catalog error with Retry. The runner then reads
# SQLite: no meta.scripture_preferences, ui_language=en.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "settings-button"
- assertVisible: ".*Не удалось загрузить список.*"
- assertNotVisible: ".*BSB.*"
- assertNotVisible: ".*Bob Souer.*"
- tapOn:
    id: "interface-language-picker"
- tapOn:
    id: "interface-language-en"
- assertVisible: ".*Could not load the list.*"
- tapOn:
    id: "settings-back-button"
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "SCR-013 catalog offline"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- longPressOn:
    id: "threshold-hold-button"
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-retry-button"
    timeout: 30000
- assertVisible: ".*Bible catalog unavailable.*"
- assertVisible: ".*Try again.*"
- assertNotVisible:
    id: "scripture-audio-button"
