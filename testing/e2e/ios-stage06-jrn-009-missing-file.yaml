appId: twinkler
---
# JRN-009: a missing recording file must not crash journal details or playback attempt.
- launchApp:
    stopApp: true
    clearState: false
- runFlow:
    when:
      visible:
        id: "journal-title"
    commands:
      - tapOn:
          point: "10%,8%"
- tapOn:
    id: "journal-button"
- assertVisible: ".*JRN-009 missing file.*"
- tapOn: ".*JRN-009 missing file.*"
- assertVisible:
    id: "journal-recording-0"
- tapOn:
    id: "journal-recording-0"
- assertVisible:
    id: "journal-title"
- assertVisible: ".*JRN-009 missing file.*"
- takeScreenshot: JRN-009-missing-file-handled
