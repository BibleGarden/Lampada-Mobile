appId: twinkler
tags:
  - prepared
---
# JRN-009: a missing recording file keeps its row, is marked unavailable and cannot be played.
- launchApp:
    stopApp: true
    clearState: false
- runFlow:
    when:
      visible:
        id: "journal-title"
    commands:
      - tapOn:
          point: "10%,8%"
- tapOn:
    id: "journal-button"
- assertVisible: ".*JRN-009 missing file.*"
- tapOn: ".*JRN-009 missing file.*"
- assertVisible:
    id: "journal-recording-0"
    enabled: false
- assertVisible:
    id: "journal-recording-0-missing"
- assertNotVisible:
    id: "journal-recording-0-transcribe"
- assertVisible:
    id: "journal-title"
- assertVisible: ".*JRN-009 missing file.*"
- takeScreenshot: JRN-009-missing-file-handled
