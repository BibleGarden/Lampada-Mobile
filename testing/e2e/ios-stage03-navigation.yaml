appId: twinkler
tags:
  - critical
---
- launchApp:
    stopApp: true
    clearState: true
- doubleTapOn:
    id: "start-prayer-button"
- assertVisible:
    id: "setup-kicker"
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "NAV-002 draft"
- hideKeyboard
- tapOn: "30"
- doubleTapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible: ".*30 минут.*NAV-002 draft.*"
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "setup-kicker"
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- assertVisible:
    id: "setup-duration-value"
    text: "10 минут"
- assertNotVisible: "NAV-002 draft"
