appId: twinkler
# NEEDS-STUB: продолжение ios-stage06-scr-002a; stub-счётчик сброшен раннером.
# В теговые прогоны не входит.
---
# SCR-002 (часть 2): после перезапуска избранное восстановилось из SQLite;
# снятие избранного тоже переживает перезапуск.
- launchApp:
    stopApp: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-002 favorite restored"
- hideKeyboard
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: SCR-002-after-relaunch
- tapOn:
    id: "dock-scripture-favorite-active"
- assertVisible:
    id: "dock-scripture-favorite"
- launchApp:
    stopApp: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-002 favorite removed"
- hideKeyboard
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- assertVisible:
    id: "dock-scripture-favorite"
- takeScreenshot: SCR-002-removed-after-relaunch
