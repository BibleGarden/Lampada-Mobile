appId: twinkler
tags:
  - prepared
# NEEDS-STUB: a continuation of ios-stage06-scr-002a; the stub counter is
# reset by the runner. Not included in tagged runs.
---
# SCR-002 (part 2): after the relaunch the favorite is restored from SQLite;
# removing the favorite also survives a relaunch.
- launchApp:
    stopApp: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-002 favorite restored"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- assertVisible:
    id: "dock-scripture-favorite-active"
- takeScreenshot: SCR-002-after-relaunch
- tapOn:
    id: "dock-scripture-favorite-active"
- assertVisible:
    id: "dock-scripture-favorite"
- launchApp:
    stopApp: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "SCR-002 favorite removed"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-button"
    timeout: 20000
- assertVisible:
    id: "dock-scripture-favorite"
- takeScreenshot: SCR-002-removed-after-relaunch
