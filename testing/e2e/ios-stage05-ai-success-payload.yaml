appId: twinkler
---
- launchApp:
    stopApp: true
    clearState: true
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- assertVisible: "Начать молитву"
- tapOn: "Начать молитву"
- tapOn:
    point: "50%,37%"
- inputText: "QA payload control"
- hideKeyboard
- tapOn: "Далее"
- assertVisible: ".*QA payload control.*"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "МОЛИТВА"
