appId: twinkler
---
# JRN-003/004: search covers topic, takeaway, question and answer; Cyrillic is case-insensitive.
- launchApp:
    stopApp: true
    clearState: false
- runFlow:
    when:
      visible:
        id: "journal-title"
    commands:
      - tapOn:
          point: "10%,8%"
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- tapOn:
    id: "journal-search-input"
- inputText: "END-004"
- hideKeyboard
- assertVisible: ".*END-004 second prayer.*"
- tapOn: "END-004"
- eraseText
- inputText: "надежда"
- hideKeyboard
- assertVisible: ".*END-003 double finish.*"
- tapOn: "надежда"
- eraseText
- inputText: "тревожит"
- hideKeyboard
- assertVisible: ".*END-003 double finish.*"
- tapOn: "тревожит"
- eraseText
- inputText: "кириллица"
- hideKeyboard
- assertVisible: ".*END-003 double finish.*"
- takeScreenshot: JRN-003-004-search-cyrillic
