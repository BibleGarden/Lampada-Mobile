appId: twinkler
tags:
  - prepared
# NEEDS-STUB: immediately before the run the stub is switched to
# contentReports=fail-once (run-stub-phase.sh). Self-contained: starts a new
# session to report a question.
---
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "RPT 003 retry"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
# === RPT-003: failure and retry ===
- tapOn:
    id: "question-report-button"
- assertVisible:
    id: "content-report-dialog"
- tapOn:
    id: "content-report-comment"
- inputText: "Черновик комментария RPT-003"
- tapOn:
    id: "content-report-send"
# The first request in fail-once mode gets a 500: the error, the dialog and the
# text all survive.
- assertVisible: "Сейчас не удалось отправить жалобу. Попробуй ещё раз."
- assertVisible:
    id: "content-report-dialog"
- assertVisible:
    id: "content-report-comment"
- takeScreenshot: RPT-003-error
# Retry — the stub is back to ok, the comment has survived in the field.
- tapOn:
    id: "content-report-send"
- assertVisible: "Спасибо. Мы её проверим."
- takeScreenshot: RPT-003-retry-sent
- tapOn:
    id: "content-report-done"
