appId: twinkler
---
# ANS-015 (часть про удаление во время запроса): запись пропадает из списка,
# запрос отменяется. Что поздний ответ сервера не вернёт строку в БД, Maestro
# не доказывает — нужна медленная сеть и ручная проверка.
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- runFlow:
    when:
      notVisible:
        id: "setup-kicker"
    commands:
      - tapOn:
          id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "ANS-015 удаление во время расшифровки"
- pressKey: Enter
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-answer-button"
- runFlow:
    when:
      notVisible:
        id: "answer-record-button"
    commands:
      - tapOn:
          id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "recordings-stop-button"
- tapOn:
    id: "recording-transcribe-0"
- tapOn:
    id: "privacy-consent-audio_transcription-allow"
- extendedWaitUntil:
    visible:
      id: "recording-transcribing-0"
    timeout: 8000
    optional: true
- doubleTapOn:
    id: "recording-delete-0"
- assertNotVisible:
    id: "recording-card-0"
- assertNotVisible:
    id: "recording-transcribing-0"
