appId: twinkler
---
- launchApp:
    stopApp: true
    clearState: true
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "privacy-setting-core_prayer_ai"
    direction: DOWN
- assertVisible:
    id: "privacy-setting-core_prayer_ai"
- assertVisible:
    id: "privacy-setting-answer_context"
- tapOn:
    id: "privacy-setting-core_prayer_ai-allowed"
- tapOn:
    id: "privacy-setting-answer_context-denied"
- scrollUntilVisible:
    element:
      id: "privacy-setting-audio_transcription"
    direction: DOWN
- tapOn:
    id: "privacy-setting-audio_transcription-allowed"
- launchApp:
    stopApp: true
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "privacy-setting-core_prayer_ai-allowed"
    direction: DOWN
- assertVisible:
    id: "privacy-setting-core_prayer_ai-allowed"
- assertVisible:
    id: "privacy-setting-answer_context-denied"
- scrollUntilVisible:
    element:
      id: "privacy-setting-audio_transcription-allowed"
    direction: DOWN
- assertVisible:
    id: "privacy-setting-audio_transcription-allowed"
