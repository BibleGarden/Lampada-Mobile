appId: twinkler
---
- launchApp:
    stopApp: true
    clearState: true
- assertVisible: "Начать молитву"
- tapOn: "Начать молитву"
- tapOn:
    point: "50%,37%"
- inputText: "QA first-question HTTP error"
- hideKeyboard
- tapOn: "Далее"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "МОЛИТВА"
- assertVisible: "Ответить"
