appId: twinkler
tags:
  - prepared
# NEEDS-STUB: before this run the script switched the stub back to ok (run-jrn-transcription.sh).
---
# JRN-012 (part 2): retrying after the error saves the text. The error state
# is not persisted: after an app restart the recording offers "Transcribe"
# again — this is expected behavior, the retry starts from a clean slate.
- launchApp:
    stopApp: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- tapOn: ".*JRN-012 повтор расшифровки.*"
- assertVisible:
    id: "journal-recording-0"
- assertVisible:
    id: "journal-recording-0-transcribe"
- tapOn:
    id: "journal-recording-0-transcribe"
- extendedWaitUntil:
    visible: "Стабильная расшифровка лампады номер семь"
    timeout: 30000
- takeScreenshot: JRN-012-retry-saved
# The text survived reopening the details.
- tapOn: ".*JRN-012 повтор расшифровки.*"
- tapOn: ".*JRN-012 повтор расшифровки.*"
- assertVisible: "Стабильная расшифровка лампады номер семь"
