---
# JRN-012 (часть 2): повтор после ошибки сохраняет текст. Состояние ошибки не
# персистится: после перезапуска приложения запись снова предлагает
# «Расшифровать» — это ожидаемое поведение, повтор идёт с чистого листа.
- launchApp:
    stopApp: true
- assertVisible: "Начать молитву"
- tapOn:
    id: "journal-button"
- assertVisible: "ДНЕВНИК"
- tapOn: ".*JRN-012 повтор расшифровки.*"
- assertVisible: ".*Аудиозапись ·.*"
- assertVisible: "Расшифровать"
- tapOn: "Расшифровать"
- extendedWaitUntil:
    visible: "Стабильная расшифровка лампады номер семь"
    timeout: 30000
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-09-20-jrn/JRN-012-retry-saved
# Текст пережил переоткрытие деталей.
