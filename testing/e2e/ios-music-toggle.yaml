appId: twinkler
tags:
  - main
---
# MUS-001: local prayer music has an explicit, reversible session control.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "MUS-001 local music"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-music-off"
- tapOn:
    id: "session-music-off"
- assertVisible:
    id: "music-playing"
- assertVisible:
    id: "session-music-on"
- takeScreenshot: MUS-001-music-on
- tapOn:
    id: "session-music-on"
- assertNotVisible:
    id: "music-playing"
- assertVisible:
    id: "session-music-off"
