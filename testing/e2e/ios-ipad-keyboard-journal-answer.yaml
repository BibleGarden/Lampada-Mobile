appId: twinkler
tags:
  - ipad
---
# Plan section 9 (iPad): taps on the left and right margins outside the column
# close the keyboard in journal search and in the answer sheet, in portrait and
# in landscape, without losing text. In portrait, the field and "Save" stay
# above the keyboard.
#
# Keyboard visibility is checked via the locale-independent system keyboard
# identifiers `shift` and `inputView` (see ios-stage03-long-goal.yaml). The
# on-screen keyboard is raised by `inputText`, so every cycle starts with
# typing. The text is digits: a tap next to a word the spell checker considers
# misspelled would select it.
- launchApp:
    stopApp: true
    clearState: true
- setOrientation: PORTRAIT

# Journal search
- tapOn:
    id: "journal-button"
- tapOn:
    id: "journal-search-input"
- inputText: "4821"
- assertVisible:
    id: "shift"
- assertVisible:
    id: "journal-search-input"
    above:
      id: "inputView"
- tapOn:
    point: "3%,50%"
- assertNotVisible:
    id: "shift"
- tapOn:
    id: "journal-search-input"
- inputText: " 7"
- assertVisible:
    id: "shift"
- tapOn:
    point: "97%,50%"
- assertNotVisible:
    id: "shift"
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "journal-search-input"
- inputText: " 8"
- assertVisible:
    id: "shift"
- tapOn:
    point: "3%,40%"
- assertNotVisible:
    id: "shift"
- tapOn:
    id: "journal-search-input"
- inputText: " 9"
- assertVisible:
    id: "shift"
- tapOn:
    point: "97%,40%"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "journal-search-input"
    text: "4821 7 8 9"

# Answer sheet
- setOrientation: PORTRAIT
- launchApp:
    stopApp: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "iPad keyboard margins"
- tapOn:
    id: "setup-kicker"
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- longPressOn:
    id: "threshold-hold-button"
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-answer-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "answer-input"
- inputText: "3217"
- assertVisible:
    id: "shift"
- assertVisible:
    id: "answer-input"
    above:
      id: "inputView"
- assertVisible:
    id: "answer-save-button"
    above:
      id: "inputView"
- tapOn:
    point: "3%,30%"
- assertNotVisible:
    id: "shift"
- tapOn:
    id: "answer-input"
- inputText: " 1"
- assertVisible:
    id: "shift"
- tapOn:
    point: "97%,30%"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "answer-input"
    text: "3217 1"
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "answer-input"
- inputText: " 2"
- assertVisible:
    id: "shift"
- tapOn:
    point: "3%,25%"
- assertNotVisible:
    id: "shift"
- tapOn:
    id: "answer-input"
- inputText: " 3"
- assertVisible:
    id: "shift"
- tapOn:
    point: "97%,25%"
- assertNotVisible:
    id: "shift"
- assertVisible:
    id: "answer-input"
    text: "3217 1 2 3"
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertVisible:
    id: "dock-answer-edit-button"
