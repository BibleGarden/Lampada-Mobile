appId: twinkler
tags:
  - prepared
# NEEDS-RUNNER: the device locale is switched between flows by run-lng.sh
# (the order and locales are hardcoded in the script). Not part of tagged runs.
---
# LNG-009: the local pool of fallback questions follows the interface language.
# The AI core is denied in settings up front so the flow never hits a live server answer.
# The default_language field in HTTP is LNG-011, invisible to Maestro.
- launchApp:
    stopApp: true
    clearState: true
    # Lampada does not use geolocation; the explicit list keeps Maestro from
    # poking locationd (simctl privacy location) right after a cold reboot,
    # where locationd hangs.
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: "settings-button"
- tapOn:
    id: "interface-language-picker"
- tapOn:
    id: "interface-language-en"
- tapOn:
    id: "privacy-settings-button"
- tapOn:
    id: "privacy-setting-core_prayer_ai-denied"
- tapOn:
    id: "privacy-sheet-close"
- openLink: "lampada://setup"
- runFlow:
    when:
      visible: "Open|Открыть"
    commands:
      - tapOn: "Open|Открыть"
- tapOn: "Continue"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-timer-button"
- assertVisible:
    id: "question-source-label"
- assertVisible: "Backup question"
- assertVisible: "What is truly worrying you most right now\\?|What do you truly want in this situation\\?|What are you afraid of losing\\?|What does your conscience tell you when you become still\\?|If God were beside you listening right now, what would you tell Him\\?"
