appId: twinkler
tags:
  - prepared
# NEEDS-RUNNER: the device locale is switched between flows by run-lng.sh
# (the order and locales are hardcoded in the script). Not part of tagged runs.
---
# LNG-004: clean install with an unsupported device language.
# initialUiLanguage picks the first en/ru/uk from getLocales() and otherwise falls back to en.
#
# Precondition: the simulator is already on locale=de_DE, and AppleLanguages
# lists only de — without an English fallback language, otherwise the en choice
# would come from the list rather than the hard-coded fallback. Maestro cannot
# change the system language itself.
- launchApp:
    stopApp: true
    clearState: true
    # Lampada does not use geolocation; the explicit list keeps Maestro from
    # poking locationd (simctl privacy location) right after a cold reboot,
    # where locationd hangs.
    permissions:
      notifications: allow
      microphone: allow
- assertVisible: "Begin prayer"
- assertVisible: "Keep the flame glowing"
- tapOn:
    id: "settings-button"
- assertVisible: "SETTINGS"
- assertVisible: "INTERFACE LANGUAGE"
- assertVisible:
    id: "interface-language-picker"
    text: ".*English.*"
- tapOn:
    id: "interface-language-picker"
- assertVisible:
    id: "interface-language-sheet"
- assertVisible:
    id: "interface-language-en"
- assertVisible:
    id: "interface-language-ru"
    text: ".*Русский.*"
- assertVisible:
    id: "interface-language-uk"
    text: ".*Українська.*"
