appId: twinkler
tags:
  - reminders
  - prepared
---
# REM-006: restarting the app preserves the schedule (the system WEEKLY
# triggers do not depend on the process; at startup the app merely reconciles
# them with the stored one).
#
# Preconditions: the ios-rem-005 run (the rule has two time rows; the schedule
# row text with two times is visible on the Settings screen).
- launchApp:
    stopApp: true
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "reminders-toggle"
    direction: DOWN
- assertVisible:
    id: "reminders-toggle"
    checked: true
# The schedule row survived the restart.
- assertVisible:
    id: "reminders-summary"
- assertVisible: ".*Настроить расписание 1: Каждый день:.*"
# Cold start: stopApp + launchApp.
- launchApp:
    stopApp: true
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "reminders-toggle"
    direction: DOWN
- assertVisible:
    id: "reminders-toggle"
    checked: true
- assertVisible:
    id: "reminders-summary"
- assertVisible: ".*Настроить расписание 1: Каждый день:.*"
