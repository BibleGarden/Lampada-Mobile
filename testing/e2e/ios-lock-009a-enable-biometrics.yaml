appId: twinkler
tags:
  - prepared
# Only through run-lock-biometrics.sh: after the tap on the toggle the script
# sends a Face ID match signal (simctl spawn ... notifyutil -p ...pearl.match).
---
# LOCK-009 (part 1): the biometrics toggle is visible with the PIN enabled and
# a template enrolled; enabling is confirmed by a successful Face ID.
#
# Preconditions (set up by the script): protection enabled with PIN 123456, a
# Face ID template enrolled, the app unlocked.
- launchApp:
    stopApp: true
# LockGate initializes asynchronously: give it time to appear before checking.
- evalScript: "java.lang.Thread.sleep(2500)"
# With the PIN enabled, a cold start opens on the lock screen.
- runFlow:
    when:
      visible:
        id: "lock-screen"
    commands:
      - tapOn:
          id: "pin-key-1"
      - tapOn:
          id: "pin-key-2"
      - tapOn:
          id: "pin-key-3"
      - tapOn:
          id: "pin-key-4"
      - tapOn:
          id: "pin-key-5"
      - tapOn:
          id: "pin-key-6"
      - assertNotVisible:
          id: "lock-screen"
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "biometrics-toggle"
    direction: DOWN
- assertVisible:
    id: "change-pin-button"
- assertVisible:
    id: "biometrics-toggle"
# Enabling: the app immediately asks to confirm with the face. The script sends
# the match while the flow sleeps; enabling happens without entering the PIN.
- tapOn:
    id: "biometrics-toggle"
- extendedWaitUntil:
    visible:
      id: "com.apple.localauthentication.ax.authentication.alert"
    timeout: 10000
- evalScript: "java.lang.Thread.sleep(20000)"
- assertVisible:
    id: "biometrics-toggle"
    checked: true
- takeScreenshot: LOCK-009-biometrics-enabled
