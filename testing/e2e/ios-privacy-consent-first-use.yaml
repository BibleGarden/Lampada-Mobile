appId: twinkler
tags:
  - critical
---
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "PRV first use"
- pressKey: Enter
- tapOn:
    id: "setup-next-button"
- assertVisible:
    id: "privacy-consent-core_prayer_ai"
- assertVisible: "Чтобы задать вопросы.*тему твоей молитвы.*Google Gemini.*платный API Google.*"
- assertVisible:
    id: "privacy-consent-core_prayer_ai-deny"
- assertVisible:
    id: "privacy-consent-core_prayer_ai-allow"
- tapOn:
    id: "privacy-consent-core_prayer_ai-deny"
# After the denial the app goes to the threshold "Before the start" screen
# (screens.threshold.before/title); the separate pre-entry screen no longer
# exists.
- assertVisible:
    id: "threshold-kicker"
- openLink: "lampada://settings"
# iOS 26 confirms scheme navigation with a system dialog in the simulator's
# language; left unanswered, it survives a restart and breaks the following
# flows.
- runFlow:
    when:
      visible: "Open|Открыть"
    commands:
      - tapOn: "Open|Открыть"
# Consent settings live in the "Data for AI" bottom sheet
# (app/settings.tsx:913,1076). On iPhone SE the row is below the first screen,
# and XCTest does not return invisible nodes.
- scrollUntilVisible:
    element:
      id: "privacy-settings-button"
    direction: DOWN
- tapOn:
    id: "privacy-settings-button"
- scrollUntilVisible:
    element:
      id: "privacy-setting-core_prayer_ai"
    direction: DOWN
- assertVisible:
    id: "privacy-setting-core_prayer_ai-denied"
