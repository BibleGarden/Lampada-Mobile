appId: twinkler
tags:
  - reminders
  - prepared
---
# REM-014/REM-015: two-step deletion of reminder times and rules.
# Precondition: a clean install (xcrun simctl uninstall/install Release).
# Notification permission is not required — the editor is accessible even with
# the toggle off.
- launchApp:
    stopApp: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "REM editor"
- pressKey: Enter
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-deny"
- assertVisible:
    id: "threshold-kicker"
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "reminders-toggle"
    direction: DOWN

# === REM-014: the first tap on the trash can only arms it, the second deletes ===
- tapOn:
    id: "reminders-settings-button-0"
- assertVisible:
    id: "reminders-editor-modal"
- tapOn:
    id: "reminder-add-time-0"
- assertVisible:
    id: "reminder-rule-0-time-10:00"
# First tap: the row stays, the button switched to the confirm state.
- tapOn:
    id: "reminder-delete-time-10:00"
- assertVisible:
    id: "reminder-rule-0-time-10:00"
- assertVisible:
    id: "reminder-delete-time-10:00-confirm"
# Second tap: the row is deleted, the confirmation is gone, 09:00 is in place.
- tapOn:
    id: "reminder-delete-time-10:00-confirm"
- assertNotVisible:
    id: "reminder-rule-0-time-10:00"
- assertNotVisible:
    id: "reminder-delete-time-10:00-confirm"
- assertVisible:
    id: "reminder-rule-0-time-09:00"

# === REM-015: the 3 s timeout resets the confirmation ===
# A lone time has no trash can (canRemove = times.length > 1), so we work with
# two rows: add 10:00 and arm its deletion specifically.
- tapOn:
    id: "reminder-add-time-0"
- assertVisible:
    id: "reminder-rule-0-time-10:00"
- tapOn:
    id: "reminder-delete-time-10:00"
- assertVisible:
    id: "reminder-delete-time-10:00-confirm"
# Java.sleep via Rhino is the only reliable sleep in Maestro.
- evalScript: "java.lang.Thread.sleep(3600)"
- assertVisible:
    id: "reminder-delete-time-10:00"
- assertNotVisible:
    id: "reminder-delete-time-10:00-confirm"

# === REM-015: closing the editor resets the confirmation ===
- tapOn:
    id: "reminder-delete-time-10:00"
- assertVisible:
    id: "reminder-delete-time-10:00-confirm"
- tapOn:
    id: "reminders-editor-done"
- tapOn:
    id: "reminders-settings-button-0"
- assertVisible:
    id: "reminders-editor-modal"
- assertVisible:
    id: "reminder-delete-time-10:00"
- assertNotVisible:
    id: "reminder-delete-time-10:00-confirm"

# === REM-015: arming another target cancels the previous one ===
- tapOn:
    id: "reminder-delete-time-10:00"
- assertVisible:
    id: "reminder-delete-time-10:00-confirm"
- tapOn:
    id: "reminder-delete-time-09:00"
- assertVisible:
    id: "reminder-delete-time-09:00-confirm"
- assertNotVisible:
    id: "reminder-delete-time-10:00-confirm"

# === REM-015: editing the schedule resets the confirmation ===
- tapOn:
    id: "reminder-time-09:00-minutes-forward"
- assertNotVisible:
    id: "reminder-delete-time-09:00-confirm"
- assertVisible:
    id: "reminder-delete-time-09:05"
# Restore the default schedule.
- tapOn:
    id: "reminder-time-09:05-minutes-back"
- assertVisible:
    id: "reminder-rule-0-time-09:00"
# Remove the second row so the rest works with the default schedule.
- tapOn:
    id: "reminder-delete-time-10:00"
- tapOn:
    id: "reminder-delete-time-10:00-confirm"
- assertNotVisible:
    id: "reminder-rule-0-time-10:00"

# === REM-014: two-step deletion of a rule (schedule) ===
# The second rule appears with Sat–Sun days and a time +1 hour from the last
# one. The editor opens on the new rule: inside the modal we check the day
# chips and the time row (the list's Sat–Sun row under the modal is not
# visible).
- tapOn:
    id: "reminders-editor-done"
- tapOn:
    id: "reminders-add-rule"
- assertVisible:
    id: "reminders-editor-modal"
- assertVisible:
    id: "reminder-rule-1"
- assertVisible:
    id: "reminder-rule-1-day-6"
    selected: true
- assertVisible:
    id: "reminder-rule-1-day-7"
    selected: true
- assertVisible:
    id: "reminder-rule-1-time-10:00"
# First tap: the rule is not deleted — the button switched to confirmation.
# (The rule list under the editor modal is not visible — check by the button's
# testID.)
- tapOn:
    id: "reminders-delete-rule"
- assertVisible:
    id: "reminders-delete-rule-confirm"
# Second tap: the rule is deleted, the editor closed, the list again has one
# schedule.
- tapOn:
    id: "reminders-delete-rule-confirm"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible:
    id: "reminders-summary-1"
- assertVisible:
    id: "reminders-summary"
- assertVisible: ".*Настроить расписание 1: Каждый день: 09:00.*"
