appId: twinkler
tags:
  - main
---
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "PRV audio consent"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- tapOn:
    id: "privacy-consent-core_prayer_ai-deny"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-record-button"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recording-transcribe-0"
- assertVisible:
    id: "privacy-consent-audio_transcription"
- assertVisible: "Выбранный аудиофайл будет отправлен.*сервер приложения.*"
- assertVisible:
    id: "privacy-consent-audio_transcription-deny"
- assertVisible:
    id: "privacy-consent-audio_transcription-allow"
- tapOn:
    id: "privacy-consent-audio_transcription-deny"
- assertVisible:
    id: "recording-transcribe-0"
- assertNotVisible:
    id: "recording-transcribing-0"
- tapOn:
    id: "recording-transcribe-0"
- assertVisible: "Расшифровка отключена в настройках конфиденциальности"
