appId: twinkler
tags:
  - rare
---
# SCR-015: a cached resume cannot publish playing state after the Scripture
# context is disabled or replaced.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "Отмена продолжения аудио Писания"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-label-idle"
    timeout: 15000
- tapOn:
    id: "scripture-audio-button"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-label-playing"
    timeout: 15000
- tapOn:
    id: "scripture-audio-button"
- assertVisible:
    id: "scripture-audio-label-paused"
- tapOn:
    id: "scripture-audio-button"
- tapOn:
    id: "dock-question-tab"
- assertVisible:
    id: "dock-answer-button"
- tapOn:
    id: "dock-scripture-tab"
- assertVisible:
    id: "scripture-audio-label-idle"
- tapOn:
    id: "scripture-audio-button"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-label-playing"
    timeout: 15000
- tapOn:
    id: "scripture-audio-button"
- assertVisible:
    id: "scripture-audio-label-paused"
- tapOn:
    id: "scripture-audio-button"
- tapOn:
    point: "84%,91%"
- extendedWaitUntil:
    visible:
      id: "scripture-audio-label-idle"
    timeout: 15000
