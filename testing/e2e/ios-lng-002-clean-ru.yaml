appId: twinkler
tags:
  - prepared
# NEEDS-RUNNER: the device locale is switched between flows by run-lng.sh
# (the order and locales are hardcoded in the script). Not part of tagged runs.
---
# LNG-002: clean install with the device language set to Russian.
#
# Precondition: the simulator is already on locale=ru_RU (AppleLocale + AppleLanguages=ru).
# Maestro cannot change the iOS system language inside a flow — that is done by
# scripts/run-all-tests.sh before the run.
- launchApp:
    stopApp: true
    clearState: true
    # Lampada does not use geolocation; the explicit list keeps Maestro from
    # poking locationd (simctl privacy location) right after a cold reboot,
    # where locationd hangs.
    permissions:
      notifications: allow
      microphone: allow
- assertVisible: "Начать молитву"
- assertVisible: "Поддержи огонёк"
- tapOn:
    id: "settings-button"
- assertVisible: "НАСТРОЙКИ"
- assertVisible: "ЯЗЫК ИНТЕРФЕЙСА"
- assertVisible:
    id: "interface-language-picker"
    text: ".*Русский.*"
