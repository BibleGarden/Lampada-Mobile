appId: twinkler
tags:
  - reminders
---
# REM-005: несколько времён в правиле — строка расписания читается корректно,
# уведомление приходит на каждое установленное время.
#
# Предусловия: прогон ios-rem-fire завершён (в правиле одна строка времени,
# начальное время известно); /tmp/rem-set-time.yaml сгенерирован двумя целями
# now+4мин и now+9мин: gen-rem-set-time.mjs --init <текущее> HH:MM HH:MM.
- launchApp:
    stopApp: true
- openLink: "lampada://settings"
- scrollUntilVisible:
    element:
      id: "reminders-toggle"
    direction: DOWN
- tapOn:
    id: "reminders-settings-button-0"
- assertVisible:
    id: "reminders-editor-modal"
- runFlow:
    file: /tmp/rem-set-time.yaml
- tapOn:
    id: "reminders-editor-done"
# Строка расписания показывает оба времени (значения через -e REM_T1/REM_T2).
- assertVisible: ".*${REM_T1}.*"
- assertVisible: ".*${REM_T2}.*"
- openLink: "lampada://"
# Первое время.
- extendedWaitUntil:
    visible: ".*(тишине с Богом|время помолиться|Он ждёт|минута молитвы|сказать Богу|Зажги лампаду|Помолимся|Побудь с Ним|станет легче|главному разговору|поблагодарить|Не спеши мимо).*"
    timeout: 300000
- assertVisible: "Lampada"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-09-20-reminders/REM-005-first
# Второе время: баннер приходит повторно.
- extendedWaitUntil:
    visible: ".*(тишине с Богом|время помолиться|Он ждёт|минута молитвы|сказать Богу|Зажги лампаду|Помолимся|Побудь с Ним|станет легче|главному разговору|поблагодарить|Не спеши мимо).*"
    timeout: 420000
- assertVisible: "Lampada"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-09-20-reminders/REM-005-second
