appId: twinkler
tags:
  - main
---
# JRN-005 (data setup A): a finished prayer that has both a text answer and a real voice recording.
# Без clearState: флоу входит в ios-jrn-suite.yaml и должен накапливать данные
# (в теговых прогонах ассертит только собственную запись — clearState не нужен).
- launchApp:
    stopApp: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "Тревога перед разговором с отцом"
- hideKeyboard
- tapOn: "5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- tapOn:
    point: "92%,95%"
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-input"
- inputText: "Первый ответ молитвы А про страх и надежду"
- tapOn:
    id: "answer-question"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "answer-record-button"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/JRN-005-recording-overlay-a
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recordings-close-button"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/JRN-005-recording-saved-a
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertVisible:
    id: "dock-answer-edit-button"
- tapOn:
    point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
- assertVisible:
    id: "journal-button"
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- assertVisible: ".*Тревога перед разговором с отцом.*"
- tapOn: ".*Тревога перед разговором с отцом.*"
- assertVisible: ".*Первый ответ молитвы А про страх и надежду.*"
- assertVisible:
    id: "journal-recording-0"
- takeScreenshot: /Users/maria/Desktop/Dev/cep/pray/testing/evidence/2026-08-22-stage06/JRN-005-journal-detail-text-audio
