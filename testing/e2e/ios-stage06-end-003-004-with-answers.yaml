appId: twinkler
tags:
  - prepared
---
# A fragment for ios-jrn-suite.yaml; do not run on its own.
# END-003/004 for the jrn-suite: a variant of
# ios-stage06-end-003-004-idempotency.yaml without launchApp/clearState — the
# suite guarantees a clean state (jrn-001). The first session additionally
# leaves an answer with the Cyrillic keywords «Кириллица про доверие» and
# «надежда», a voice recording (jrn-007-delete expects the «Аудиозапись»
# label in the details), and a takeaway with the Cyrillic keywords «тревожит»
# and «Кириллица» — these are what ios-stage06-jrn-003-004-search later
# searches for.
# Before the start — a relaunch without clearState: the suite's previous flow
# may end on any screen, while the fragment starts from Home.
- launchApp:
    stopApp: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "END-003 double finish"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- waitForAnimationToEnd:
    timeout: 9000

# An answer with the Cyrillic keywords «Кириллица про доверие» and «надежда» —
# jrn-003/004-search searches by «надежда», and jrn-007-delete expects this
# text in the END-003 details.
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-input"
- inputText: "Ответ Кириллица про доверие и надежда"
- tapOn:
    id: "answer-question"
# A voice recording attached to the answer — jrn-007-delete expects the
# «Аудиозапись» entry in the END-003 details.
- tapOn:
    id: "answer-record-button"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "recordings-stop-button"
- assertVisible:
    id: "recording-card-0"
- tapOn:
    id: "recordings-close-button"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertVisible:
    id: "dock-answer-edit-button"
# After saving, the answer sheet may already be closed (the consent dialog
# dismisses it) or not — the first tap either goes straight to the
# «ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ» screen (screens.reflect.before) or only closes the
# sheet; in the latter case the «Ответить» button is visible and we tap again.
- tapOn:
    point: "10%,11%"
- runFlow:
    when:
      visible:
        id: "dock-answer-button"
    commands:
      - tapOn:
          point: "10%,11%"
- assertVisible:
    id: "reflect-kicker"

# A takeaway with the Cyrillic keywords «тревожит» and «Кириллица» — what
# jrn-003/004-search searches for.
- tapOn:
    id: "reflection-input"
- inputText: "END-003 вывод: тревожит разговор; Кириллица тест"
# The «ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ» kicker (screens.reflect.before) is hidden while
# the keyboard is open (app/reflect.tsx:144) — dismiss the keyboard with
# Enter (as in smoke-full).
- pressKey: Enter
- assertVisible:
    id: "reflect-complete-button"
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
- assertVisible:
    id: "journal-button"

# The second session — as in the original (ios-stage06-end-003-004-idempotency).
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "END-004 second prayer"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    point: "10%,11%"
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
- assertVisible:
    id: "journal-button"
- tapOn:
    id: "journal-button"
- assertVisible: ".*END-003 double finish.*"
- assertVisible: ".*END-004 second prayer.*"
- takeScreenshot: END-003-004-two-prayers-one-day
