appId: twinkler
tags:
  - prepared
# Hybrid scenario: the app-switcher snapshot is captured by
# run-lock-appswitcher.sh (AppleScript → Simulator menu → App Switcher →
# simctl io screenshot). Not included in tagged runs.
---
# LOCK-008: with protection enabled, going to the background covers the app
# with the privacy curtain — the app snapshot for the switcher contains no
# content.
# Precondition: protection disabled.
- launchApp:
    stopApp: true
- evalScript: "java.lang.Thread.sleep(2500)"
# With the PIN enabled, a cold start opens on the lock screen.
- runFlow:
    when:
      visible:
        id: "lock-screen"
    commands:
      - tapOn:
          id: "pin-key-1"
      - tapOn:
          id: "pin-key-2"
      - tapOn:
          id: "pin-key-3"
      - tapOn:
          id: "pin-key-4"
      - tapOn:
          id: "pin-key-5"
      - tapOn:
          id: "pin-key-6"
      - assertNotVisible:
          id: "lock-screen"
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "lock-toggle"
    direction: DOWN
# If protection is not enabled yet — enable PIN 123456.
- runFlow:
    when:
      notVisible:
        id: "change-pin-button"
    commands:
      - tapOn:
          id: "lock-toggle"
      - assertVisible:
          id: "pin-prompt-enable-create"
      - tapOn:
          id: "pin-key-1"
      - tapOn:
          id: "pin-key-2"
      - tapOn:
          id: "pin-key-3"
      - tapOn:
          id: "pin-key-4"
      - tapOn:
          id: "pin-key-5"
      - tapOn:
          id: "pin-key-6"
      - tapOn:
          id: "pin-key-confirm"
      - assertVisible:
          id: "pin-prompt-enable-repeat"
      - tapOn:
          id: "pin-key-1"
      - tapOn:
          id: "pin-key-2"
      - tapOn:
          id: "pin-key-3"
      - tapOn:
          id: "pin-key-4"
      - tapOn:
          id: "pin-key-5"
      - tapOn:
          id: "pin-key-6"
      - tapOn:
          id: "pin-key-confirm"
- assertVisible:
    id: "change-pin-button"
# Content before backgrounding: the journal with an entry.
- openLink: "lampada://journal"
- assertVisible:
    id: "journal-title"
# Going home: the app is in the background, the privacy curtain is active
# (obscured).
- pressKey: HOME
- assertNotVisible:
    id: "journal-title"
- takeScreenshot: LOCK-008-home-screen
# The script opens the app switcher and captures the snapshot.
