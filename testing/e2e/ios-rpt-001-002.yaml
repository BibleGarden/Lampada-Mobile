appId: twinkler
tags:
  - prepared
# NEEDS-STUB: пейлоды жалоб принимает stub :9085 (run-stub-phase.sh или
# вручную: npm run scripture:stub). В теговые прогоны не входит.
---
# RPT-001: жалоба на вопрос без комментария.
# RPT-002: жалоба на отрывок из карточки с комментарием.
# Предусловие: stub в режиме contentReports=ok.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "RPT content reports"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"

# === RPT-001: вопрос без комментария ===
- tapOn:
    id: "question-report-button"
- assertVisible:
    id: "content-report-dialog"
- takeScreenshot: RPT-001-dialog
- tapOn:
    id: "content-report-send"
- assertVisible: "Спасибо. Жалоба отправлена на проверку."
- takeScreenshot: RPT-001-sent
- tapOn:
    id: "content-report-done"

# === RPT-002: отрывок из карточки с комментарием ===
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-report-button"
    timeout: 20000
- takeScreenshot: RPT-002-scripture-card
- tapOn:
    id: "scripture-report-button"
- assertVisible:
    id: "content-report-dialog"
- tapOn:
    id: "content-report-comment"
- inputText: "Тестовый комментарий RPT-002"
- tapOn:
    id: "content-report-send"
- assertVisible: "Спасибо. Жалоба отправлена на проверку."
- takeScreenshot: RPT-002-sent
- tapOn:
    id: "content-report-done"
# В полном ридере своей кнопки жалобы больше нет. Кнопка карточки остаётся
# в дереве под шторкой, поэтому ищем только в ряду кнопок ридера.
- tapOn:
    id: "scripture-read-full"
- extendedWaitUntil:
    visible:
      id: "scripture-reader-close"
    timeout: 10000
- assertNotVisible:
    id: "scripture-report-button"
    rightOf:
      id: "scripture-reader-favorite.*"
    leftOf:
      id: "scripture-reader-close"
- tapOn:
    id: "scripture-reader-close"
