appId: twinkler
tags:
  - prepared
# NEEDS-STUB: report payloads are accepted by the stub on :9085
# (run-stub-phase.sh, or manually: npm run scripture:stub). Not included in
# tagged runs.
---
# RPT-001: reporting a question without a comment.
# RPT-002: reporting a passage from the card with a comment.
# Precondition: the stub in contentReports=ok mode.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    point: "50%,37%"
- inputText: "RPT content reports"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"

# === RPT-001: question without a comment ===
- tapOn:
    id: "question-report-button"
- assertVisible:
    id: "content-report-dialog"
- takeScreenshot: RPT-001-dialog
- tapOn:
    id: "content-report-send"
- assertVisible: "Спасибо. Мы её проверим."
- assertVisible: "Жалоба отправлена"
- assertNotVisible: "Пожаловаться на этот .*"
- takeScreenshot: RPT-001-sent
- tapOn:
    id: "content-report-done"

# === RPT-002: passage from the card with a comment ===
- tapOn:
    id: "dock-scripture-tab"
- extendedWaitUntil:
    visible:
      id: "scripture-report-button"
    timeout: 20000
- takeScreenshot: RPT-002-scripture-card
- tapOn:
    id: "scripture-report-button"
- assertVisible:
    id: "content-report-dialog"
- tapOn:
    id: "content-report-comment"
- inputText: "Тестовый комментарий RPT-002"
- tapOn:
    id: "content-report-send"
- assertVisible: "Спасибо. Мы её проверим."
- assertVisible: "Жалоба отправлена"
- assertNotVisible: "Пожаловаться на этот .*"
- takeScreenshot: RPT-002-sent
- tapOn:
    id: "content-report-done"
# The full reader no longer has its own report button. The card's button stays
# in the tree under the sheet, so search only within the reader's button row.
- tapOn:
    id: "scripture-read-full"
- extendedWaitUntil:
    visible:
      id: "scripture-reader-close"
    timeout: 10000
- assertNotVisible:
    id: "scripture-report-button"
    rightOf:
      id: "scripture-reader-favorite.*"
    leftOf:
      id: "scripture-reader-close"
- tapOn:
    id: "scripture-reader-close"
