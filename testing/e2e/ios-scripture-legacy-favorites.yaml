appId: twinkler
# NEEDS-ENV: требует сеятеля legacy-favorites в SQLite — задача 86cbj95j4
---
# Precondition: legacy `favorites` contains known and unknown refs; migration marker is absent.
- launchApp:
    stopApp: true
- openLink: "lampada://favorites"
- extendedWaitUntil:
    visible: "Колоссянам 3:23"
    timeout: 10000
- assertVisible: "И всё, что делаете.*"
- scrollUntilVisible:
    element:
      text: "Неизвестная старая ссылка"
    direction: DOWN
- assertVisible: "Сохранено ранее"
