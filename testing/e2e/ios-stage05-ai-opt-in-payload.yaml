appId: twinkler
---
- launchApp:
    stopApp: true
    clearState: true
- openLink: "lampada://settings"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- scrollUntilVisible:
    element:
      id: "privacy-setting-answer_context-allowed"
    direction: DOWN
- tapOn:
    id: "privacy-setting-answer_context-allowed"
- openLink: "lampada://setup"
- tapOn:
    point: "50%,37%"
- inputText: "QA opt-in payload"
- hideKeyboard
- tapOn: "Далее"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible: "Ответить"
- tapOn: "Ответить"
- tapOn:
    id: "answer-input"
- inputText: "QA private answer"
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertVisible: "Изменить"
- tapOn:
    point: "85%,77%"
- assertVisible: "Ответить"
