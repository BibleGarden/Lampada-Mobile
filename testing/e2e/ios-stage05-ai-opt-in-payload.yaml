appId: twinkler
tags:
  - main
---
- launchApp:
    stopApp: true
    clearState: true
- openLink: "lampada://settings"
- runFlow:
    when:
      visible: "Open|Открыть"
    commands:
      - tapOn: "Open|Открыть"
# Согласия живут в BottomSheet «Данные для ИИ» (app/settings.tsx:913,1076).
- tapOn:
    id: "privacy-settings-button"
- assertVisible:
    id: "privacy-sheet"
- assertVisible:
    id: "privacy-setting-answer_context-allowed"
- tapOn:
    id: "privacy-setting-answer_context-allowed"
- openLink: "lampada://setup"
- tapOn:
    point: "50%,37%"
- inputText: "QA opt-in payload"
- hideKeyboard
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "dock-answer-button"
- tapOn:
    id: "dock-answer-button"
- tapOn:
    id: "answer-input"
- inputText: "QA private answer"
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertVisible:
    id: "dock-answer-edit-button"
# Цель флоу (opt-in payload отправлен с ответом) достигнута — состояние
# «Изменить» подтверждает сохранение. Шторку больше не закрываем координатой:
# вёрстка дока менялась, точка 85%,77% попадает в кнопку «+» (коммит 595a742).
