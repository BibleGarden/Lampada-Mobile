appId: twinkler
tags:
  - prepared
---
# Music returns with the prayer (iOS): music on, the prayer ends, "Return to
# prayer". Screenshots, in order: the session with the music on, the session
# after the return. On a build without the return behaviour the music button is
# off after the return. The Control Center of the CI simulator shows no Now
# Playing tile (checked in the first runs), so the playing track cannot be
# captured on iOS.
# The prayer is left with "Finish", not by the timer: on the CI simulator each
# Maestro command takes tens of seconds, so no timer short enough to wait for
# is long enough to reach the end of the flow. "Finish" and the timer end go
# through the same stop (ADR-0033, ADR-0046). The preset is an hour for the same
# reason.
# Used by the preview workflow (docs: testing/README.md).
- launchApp:
    stopApp: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: start-prayer-button
    timeout: 60000
# The real test server can answer the version check with a soft "Update
# available" sheet a few seconds after launch; it covers the app. Dismiss it.
- extendedWaitUntil:
    visible:
      id: update-later
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: update-later
    commands:
      - tapOn:
          id: update-later
- tapOn:
    id: start-prayer-button
- tapOn:
    id: setup-examples-button
- tapOn:
    id: setup-example-0
- tapOn:
    id: setup-preset-60
- tapOn:
    id: setup-next-button
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
- longPressOn:
    id: threshold-hold-button
- assertVisible:
    id: session-title
- tapOn:
    id: session-music-off
- extendedWaitUntil:
    visible:
      id: music-playing
    timeout: 60000
# Maestro has no sleep command: a deliberately false wait lets the music play.
- extendedWaitUntil:
    visible: "no-such-text-wait-for-the-music"
    timeout: 8000
    optional: true
- takeScreenshot: music-before-session
- tapOn:
    id: session-finish-button
- extendedWaitUntil:
    visible:
      id: reflect-kicker
    timeout: 120000
- tapOn:
    id: reflect-return-button
- extendedWaitUntil:
    visible:
      id: session-title
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: music-playing
    timeout: 60000
    optional: true
- extendedWaitUntil:
    visible: "no-such-text-wait-for-the-music"
    timeout: 6000
    optional: true
- takeScreenshot: music-after-session

