appId: com.nf404.twinkler
tags:
  - main
---
# Android counterpart of ios-ans-023-recordings-actions.yaml; native selectors and untimed fixtures.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      microphone: allow
      notifications: allow
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: ANS-023 кнопки записей
- runFlow: helpers/dismiss-keyboard.yaml
- tapOn:
    id: setup-preset-0
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: session-title
- tapOn:
    id: dock-answer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: answer-record-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 2500
- assertVisible:
    id: recordings-stop-button
- copyTextFrom:
    id: recording-elapsed
- evalScript: ${output.elapsed = maestro.copiedText}
- assertTrue: ${/\d+:\d\d$/.test(output.elapsed)}
- extendedWaitUntil:
    notVisible:
      id: recording-elapsed
      text: ${output.elapsed}
    timeout: 3000
- takeScreenshot: ANS-023-recording-done
- tapOn:
    id: recordings-stop-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: recording-card-0
- assertVisible:
    id: recordings-record-button
- assertVisible:
    id: recordings-close-button
- takeScreenshot: ANS-023-record-another
- tapOn:
    id: recordings-record-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: recordings-stop-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: recording-card-1
- tapOn:
    id: recordings-close-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: answer-save-button
- waitForAnimationToEnd:
    timeout: 2500
# Шторка ответа с закрытой клавиатурой: шторка и затемнение доходят до края
# экрана, кнопки — над Home Indicator / системной навигацией.
- takeScreenshot: ANS-023-answer-sheet
