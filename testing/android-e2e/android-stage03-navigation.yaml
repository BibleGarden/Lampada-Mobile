appId: com.nf404.twinkler
tags:
  - critical
---
- launchApp:
    stopApp: true
    clearState: true
- doubleTapOn:
    id: "start-prayer-button"
- assertVisible:
    id: "setup-kicker"
- tapOn: "Назад"
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "NAV-002 draft"
- pressKey: Enter
- tapOn:
    id: "setup-preset-30"
- doubleTapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible: ".*30 минут.*NAV-002 draft.*"
- tapOn: "Назад"
- assertVisible:
    id: "setup-kicker"
- tapOn: "Назад"
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- assertVisible:
    id: "setup-duration-value"
    text: "10 минут"
- assertNotVisible: "NAV-002 draft"
