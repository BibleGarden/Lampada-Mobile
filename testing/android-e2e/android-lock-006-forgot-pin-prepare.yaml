appId: com.nf404.twinkler
tags:
  - prepared
---
# LOCK-006: real journal data must survive both cancellation paths.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      notifications: allow
      microphone: allow
- assertVisible:
    id: start-prayer-button
- assertNotVisible:
    id: lock-screen
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      notVisible:
        id: setup-kicker
    commands:
      - tapOn:
          id: start-prayer-button
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: setup-kicker
    timeout: 8000
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: LOCK-006 запись
- pressKey: Enter
- assertVisible: LOCK-006 запись
- tapOn:
    id: setup-preset-5
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible: .*5 минут.*LOCK-006 запись.*
    timeout: 8000
- tapOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: threshold-hold-button
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: session-title
- tapOn:
    text: Назад
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: reflect-kicker
- tapOn:
    id: reflection-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: LOCK-006 вывод
- tapOn:
    id: reflect-question
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: reflect-complete-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: home-title-lit
- assertVisible:
    id: journal-button
- tapOn:
    id: journal-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: journal-title
- assertVisible: .*LOCK-006 запись.*
- tapOn:
    text: Назад
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: settings-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- scrollUntilVisible:
    element:
      id: lock-toggle
    direction: DOWN
- tapOn:
    id: lock-toggle
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: pin-prompt-enable-create
- tapOn:
    id: pin-key-4
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: pin-key-3
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: pin-key-2
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: pin-key-1
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: pin-key-confirm
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: pin-prompt-enable-repeat
- tapOn:
    id: pin-key-4
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: pin-key-3
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: pin-key-2
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: pin-key-1
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: pin-key-confirm
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible:
    id: pin-prompt
- assertVisible:
    id: change-pin-button
