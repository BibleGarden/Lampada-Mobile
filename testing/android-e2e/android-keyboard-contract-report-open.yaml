appId: com.nf404.twinkler
tags:
  - prepared
---
# Геометрия проверяется хостовым runner после остановки драйвера Maestro.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: start-prayer-button
- tapOn:
    id: setup-examples-button
- tapOn:
    id: setup-example-0
- tapOn:
    id: setup-preset-0
- tapOn:
    id: setup-next-button
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
- longPressOn:
    id: threshold-hold-button
- assertVisible:
    id: session-title
- extendedWaitUntil:
    visible:
      id: question-report-button
    timeout: 30000
- tapOn:
    id: question-report-button
- assertVisible:
    id: content-report-dialog
- tapOn:
    id: content-report-comment
- runFlow:
    when:
      true: ${KEYBOARD_MODE != 'hardware'}
    commands:
      - inputText: "Keyboard matrix report"
      - assertVisible:
          id: report-keyboard-dismiss
- assertVisible:
    id: content-report-send
