appId: app.lampada
tags:
  - critical
---
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "PRV first use"
- pressKey: Enter
- tapOn:
    id: "setup-next-button"
- assertVisible:
    id: "privacy-consent-core_prayer_ai"
- assertVisible: "Чтобы задать вопросы.*тему твоей молитвы.*Google Gemini.*платный API Google.*"
- assertVisible:
    id: "privacy-consent-core_prayer_ai-deny"
- assertVisible:
    id: "privacy-consent-core_prayer_ai-allow"
- tapOn:
    id: "privacy-consent-core_prayer_ai-deny"
# After denial the app goes to the threshold «Перед началом» screen
# (screens.threshold.before/title); the separate pre-entry screen no longer exists.
- assertVisible:
    id: "threshold-kicker"
- openLink: "lampada://settings"
# iOS 26 confirms URL-scheme navigation with a system dialog in the
# simulator's language; left unanswered, it survives a restart and breaks later flows.
- runFlow:
    when:
      visible: "Open|Открыть"
    commands:
      - tapOn: "Open|Открыть"
# Consents live in the "Data for AI" BottomSheet (app/settings.tsx:913,1076).
# On iPhone SE the row is below the first screen, and XCTest does not expose off-screen nodes.
- scrollUntilVisible:
    element:
      id: "privacy-settings-button"
    direction: DOWN
- tapOn:
    id: "privacy-settings-button"
- scrollUntilVisible:
    element:
      id: "privacy-setting-core_prayer_ai"
    direction: DOWN
- assertVisible:
    id: "privacy-setting-core_prayer_ai-denied"
