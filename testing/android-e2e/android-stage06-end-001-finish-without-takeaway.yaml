appId: app.lampada
tags:
  - critical
---
# END-001: finishing without a takeaway completes the session and returns directly Home.
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "home-title"
- takeScreenshot: END-001-home-before
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "END-001 без вывода"
- runFlow: helpers/dismiss-keyboard.yaml
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
# Accumulate elapsed_sec > 0, otherwise the session never reaches the journal (lib/db.ts:223)
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    id: "session-finish-button"
- assertVisible:
    id: "reflect-kicker"
- takeScreenshot: END-001-reflect-empty-input
- assertVisible:
    id: "reflect-complete-button"
- tapOn:
    id: "reflect-complete-button"
# The prayer-saved-notice line replaces the streak caption and hides after 4 s (app/index.tsx) —
# check it immediately, before the remaining Home asserts.
- assertVisible:
    id: "prayer-saved-notice"
- assertNotVisible:
    id: "home-streak-line"
- extendedWaitUntil:
    notVisible:
      id: "prayer-saved-notice"
    timeout: 6000
- assertVisible:
    id: "home-streak-line"
- assertVisible:
    id: "home-title-lit"
- assertVisible:
    id: "journal-button"
- assertVisible:
    id: "home-title-lit"
- takeScreenshot: END-001-home-after
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- assertVisible: ".*END-001 без вывода.*"
- takeScreenshot: END-001-journal
