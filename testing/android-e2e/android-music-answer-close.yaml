appId: app.lampada
tags:
  - main
---
# MUS-012: narration keeps music paused while the reader closes; switching to
# questions stops narration before the answer sheet can be opened.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: start-prayer-button
- tapOn:
    id: setup-goal-input
- inputText: MUS-012 audio ownership
- pressKey: Enter
- tapOn:
    id: setup-preset-0
- tapOn:
    id: setup-next-button
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
- longPressOn:
    id: threshold-hold-button
- tapOn:
    id: session-music-off
- assertVisible:
    id: music-playing
- tapOn:
    id: dock-scripture-tab
- extendedWaitUntil:
    visible:
      id: scripture-audio-label-idle
    timeout: 15000
- tapOn:
    id: scripture-audio-button
- extendedWaitUntil:
    visible:
      id: scripture-audio-label-playing
    timeout: 15000
- assertNotVisible:
    id: music-playing
- tapOn:
    id: scripture-(preview|read-full)
- assertVisible:
    id: scripture-reader-reference
- tapOn:
    id: scripture-reader-close
- tapOn:
    id: dock-question-tab
- extendedWaitUntil:
    visible:
      id: music-playing
    timeout: 5000
- tapOn:
    id: dock-answer-button
- assertVisible:
    id: answer-cancel-button
- tapOn:
    id: answer-cancel-button
- assertVisible:
    id: music-playing
