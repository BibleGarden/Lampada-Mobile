appId: app.lampada
tags:
  - critical
---
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- assertNotVisible:
    id: "home-title"
- tapOn:
    id: "setup-goal-input"
- inputText: "SES-001 finite timer"
- pressKey: Enter
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- assertNotVisible:
    id: "home-title"
- tapOn:
    id: "session-timer-button"
# у кнопок ±шаг голосовая подпись «Убавить/Добавить N минут», а не «−1»
- assertVisible:
    id: "session-time-subtract"
- assertVisible:
    id: "session-time-add"
# Таймер идёт во время действий: после завершения кнопок корректировки уже нет.
- repeat:
    times: 5
    while:
      visible:
        id: "session-time-subtract"
    commands:
      - tapOn:
          id: "session-time-subtract"
- extendedWaitUntil:
    visible:
      id: "reflect-kicker"
    timeout: 10000
- assertNotVisible:
    id: "session-title"
- tapOn:
    id: "reflect-return-button"
- assertVisible:
    id: "session-title"
# кикер «цель» и тема VoiceOver читает одной фразой
- assertVisible:
    text: ".*SES-001 finite timer"
    childOf:
      id: "session-goal"
- tapOn:
    id: "session-finish-button"
- assertVisible:
    id: "reflect-kicker"
