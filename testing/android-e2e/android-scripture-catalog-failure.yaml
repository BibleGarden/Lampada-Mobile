appId: com.nf404.twinkler
tags:
  - prepared
---
# Android version of ios-scripture-catalog-failure.yaml (SCR-013, phase 1 of 3).
# scripts/test-android-prepared.py sets catalog=fail; scripts/test-android.sh
# requires Russian as the primary emulator locale.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: settings-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible: ".*Не удалось загрузить список.*"
- assertNotVisible: ".*BSB.*"
- assertNotVisible: ".*Bob Souer.*"
- tapOn:
    id: interface-language-picker
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: interface-language-en
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible: ".*Could not load the list.*"
- tapOn:
    id: settings-back-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: SCR-013 catalog offline
- pressKey: Enter
- tapOn:
    id: setup-preset-5
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: session-title
- tapOn:
    id: dock-scripture-tab
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-retry-button
    timeout: 30000
- assertVisible: ".*Bible catalog unavailable.*"
- assertVisible: ".*Try again.*"
- assertNotVisible:
    id: scripture-audio-button
