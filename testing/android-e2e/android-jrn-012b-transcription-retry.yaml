appId: app.lampada
tags:
  - prepared
---
# Android-версия управляемого сценария ios-jrn-012b-transcription-retry.yaml.
- launchApp:
    stopApp: true
    permissions:
      notifications: allow
      microphone: allow
- assertVisible:
    id: start-prayer-button
- tapOn:
    id: journal-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: journal-title
- tapOn: .*JRN-012 повтор расшифровки.*
- assertVisible:
    id: journal-recording-0
- assertVisible:
    id: journal-recording-0-transcribe
- tapOn:
    id: journal-recording-0-transcribe
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: Стабильная расшифровка лампады номер семь
    timeout: 30000
- takeScreenshot: JRN-012-retry-saved
- tapOn: .*JRN-012 повтор расшифровки.*
- tapOn: .*JRN-012 повтор расшифровки.*
- assertVisible: Стабильная расшифровка лампады номер семь
