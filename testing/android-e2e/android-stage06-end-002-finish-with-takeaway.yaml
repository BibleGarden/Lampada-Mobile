appId: com.nf404.twinkler
tags:
  - critical
---
# END-002: a saved takeaway returns directly Home and remains in the journal.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "END-002 с выводом"
- runFlow: helpers/dismiss-keyboard.yaml
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    id: "session-finish-button"
- assertVisible:
    id: "reflect-kicker"
# по testID, а не по точке: на iPhone SE в 47% высоты лежит вопрос, а не поле
- tapOn:
    id: "reflection-input"
- inputText: "END-002 вывод молитвы"
# Кикер «ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ» скрывается при открытой клавиатуре
# Закрываем клавиатуру явной кнопкой после ввода Unicode.
- runFlow: helpers/dismiss-keyboard.yaml
- assertVisible:
    id: "reflect-complete-button"
- takeScreenshot: END-002-reflect-filled
- tapOn:
    id: "reflect-complete-button"
# Остаточный риск: tapOn ждёт успокоения экрана, и долгий переход может съесть часть 4-секундного окна баннера.
- assertVisible:
    id: "prayer-saved-notice"
- assertVisible:
    id: "home-title-lit"
- assertVisible:
    id: "journal-button"
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- assertVisible: ".*END-002 с выводом.*"
- assertVisible: ".*END-002 вывод молитвы.*"
- takeScreenshot: END-002-journal-takeaway
