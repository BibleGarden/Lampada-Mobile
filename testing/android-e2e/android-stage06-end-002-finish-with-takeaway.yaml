appId: app.lampada
tags:
  - critical
---
# END-002: a saved takeaway returns directly Home and remains in the journal.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "END-002 с выводом"
- runFlow: helpers/dismiss-keyboard.yaml
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    id: "session-finish-button"
- assertVisible:
    id: "reflect-kicker"
# By testID, not by coordinates: on iPhone SE the question sits at 47% height, not the field
- tapOn:
    id: "reflection-input"
- inputText: "END-002 вывод молитвы"
# The «ПРЕЖДЕ ЧЕМ ЗАКРЫТЬ» kicker (screens.reflect.before) is hidden while
# the keyboard is open.
# Dismiss the keyboard by tapping outside the field after the Unicode input.
- runFlow: helpers/dismiss-keyboard.yaml
- assertVisible:
    id: "reflect-complete-button"
- takeScreenshot: END-002-reflect-filled
- tapOn:
    id: "reflect-complete-button"
# Residual risk: tapOn waits for the screen to settle, and a slow transition may eat into the 4-second notice window.
- assertVisible:
    id: "prayer-saved-notice"
- assertNotVisible:
    id: "home-streak-line"
- extendedWaitUntil:
    notVisible:
      id: "prayer-saved-notice"
    timeout: 6000
- assertVisible:
    id: "home-streak-line"
- assertVisible:
    id: "home-title-lit"
- assertVisible:
    id: "journal-button"
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- assertVisible: ".*END-002 с выводом.*"
- assertVisible: ".*END-002 вывод молитвы.*"
- takeScreenshot: END-002-journal-takeaway
