appId: com.nf404.twinkler
tags:
  - prepared
---
# Android ordered counterpart of ios-lock-006-forgot-pin-wipe.yaml.
- launchApp:
    stopApp: true
    permissions:
      notifications: allow
      microphone: allow
- assertVisible:
    id: lock-screen
- tapOn:
    id: forgot-pin
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      notVisible: Стереть данные
    commands:
      - tapOn:
          id: forgot-pin
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- assertVisible: Стереть данные
- tapOn: Отмена
- assertVisible:
    id: lock-screen
- tapOn:
    id: forgot-pin
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn: Стереть данные
- assertVisible: Точно стереть всё?
- tapOn: Отмена
- assertVisible:
    id: lock-screen
- tapOn:
    id: pin-key-4
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: pin-key-3
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: pin-key-2
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: pin-key-1
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: start-prayer-button
- tapOn:
    id: journal-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible: .*LOCK-006 запись.*
- tapOn:
    text: Назад
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- launchApp:
    stopApp: true
    permissions:
      notifications: allow
      microphone: allow
- assertVisible:
    id: lock-screen
- tapOn:
    id: forgot-pin
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      notVisible: Стереть данные
    commands:
      - tapOn:
          id: forgot-pin
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- tapOn: Стереть данные
- assertVisible: Точно стереть всё?
- tapOn: Да, стереть
- extendedWaitUntil:
    notVisible:
      id: lock-screen
    timeout: 15000
- assertVisible:
    id: start-prayer-button
- tapOn:
    id: journal-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: journal-title
- assertVisible:
    id: journal-empty-state
- assertNotVisible: .*LOCK-006 запись.*
- tapOn:
    text: Назад
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: settings-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- scrollUntilVisible:
    element:
      id: lock-toggle
    direction: DOWN
- assertNotVisible:
    id: change-pin-button
- launchApp:
    stopApp: true
    permissions:
      notifications: allow
      microphone: allow
- assertVisible:
    id: start-prayer-button
- assertNotVisible:
    id: lock-screen
