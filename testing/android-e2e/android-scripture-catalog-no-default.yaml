appId: com.nf404.twinkler
tags:
  - prepared
---
# Android version of ios-scripture-catalog-no-default.yaml (SCR-027).
# scripts/test-android-prepared.py sets catalog=unvoiced-ru; scripts/test-android.sh
# requires Russian as the primary emulator locale.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: SCR-027 no default Bible
- pressKey: Enter
- tapOn:
    id: setup-preset-5
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: session-title
- tapOn:
    id: dock-scripture-tab
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-open-settings-button
    timeout: 30000
- assertVisible: ".*Для языка интерфейса нет Библии.*"
- assertNotVisible:
    id: scripture-retry-button
- tapOn:
    id: scripture-open-settings-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-default-unavailable
    timeout: 30000
- tapOn:
    id: scripture-language-picker
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: scripture-language-en
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-translation-16
    timeout: 30000
- tapOn:
    id: scripture-translation-16
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: scripture-voice-151
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible:
    id: scripture-default-unavailable
- assertNotVisible:
    id: scripture-save-error
- assertVisible: ".*BSB.*"
- assertVisible: ".*Bob Souer.*"
- tapOn:
    id: settings-back-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-audio-button
    timeout: 30000
