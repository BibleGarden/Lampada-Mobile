appId: com.nf404.twinkler
tags:
  - main
---
# Android counterpart of ios-keyboard-reflect-journal.yaml; native selectors and untimed fixtures.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: Клавиатура в размышлении
- tapOn:
    id: setup-kicker
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-preset-0
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: session-title
- tapOn:
    id: session-finish-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: reflect-kicker
- tapOn:
    id: reflection-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: "4821"
- assertVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- assertNotVisible:
    id: reflect-complete-button
- tapOn:
    id: reflection-input
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- inputText: " вывод"
- assertVisible:
    id: reflection-input
    text: 4821 вывод
    above:
      id: com.google.android.inputmethod.latin:id/keyboard_holder
- assertVisible:
    id: reflect-question
    above:
      id: com.google.android.inputmethod.latin:id/keyboard_holder
- tapOn:
    id: reflect-question
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- assertVisible:
    id: reflection-input
    text: 4821 вывод
- assertVisible:
    id: reflect-return-button
- tapOn:
    id: reflect-complete-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: home-title-lit
- tapOn:
    id: journal-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: journal-search-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: "4821"
- assertVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- tapOn:
    id: journal-search-input
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- inputText: " вывод"
- assertVisible:
    id: journal-search-input
    text: 4821 вывод
    above:
      id: com.google.android.inputmethod.latin:id/keyboard_holder
- tapOn:
    id: journal-title
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- assertVisible:
    id: journal-search-input
    text: 4821 вывод
- assertVisible: .*Клавиатура в размышлении.*
