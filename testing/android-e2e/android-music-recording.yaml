appId: app.lampada
tags:
  - main
---
# MUS-005: the music plays again after a voice recording. While the answer
# sheet is open, the session screen with the music indicator is hidden from the
# accessibility tree, so the pause itself is not observable here.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: MUS-005 music and recording
- pressKey: Enter
- tapOn:
    id: setup-preset-0
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- tapOn:
    id: session-music-off
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: music-playing
# An empty recordings list starts recording immediately.
- tapOn:
    id: dock-answer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: answer-record-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 2500
- assertVisible:
    id: recordings-stop-button
# Stopping is allowed no earlier than 1.5 s into the recording: wait for a
# two-second timer, otherwise a tap without retry may land too early.
- extendedWaitUntil:
    visible:
      id: recording-elapsed
      text: ".*0:0[2-9]"
    timeout: 5000
- takeScreenshot: MUS-005-recording
- tapOn:
    id: recordings-stop-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: recording-card-0
- tapOn:
    id: recordings-close-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
# Unsaved recording: the first "Cancel" tap asks for confirmation.
- tapOn:
    id: answer-cancel-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: answer-cancel-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible:
    id: answer-input
- extendedWaitUntil:
    visible:
      id: music-playing
    timeout: 5000
- assertVisible:
    id: session-music-on
- takeScreenshot: MUS-005-music-resumed
