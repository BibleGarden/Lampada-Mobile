appId: com.nf404.twinkler
tags:
  - prepared
---
# Unicode injection can blur the editor while leaving the IME visible.
# Use the existing outside-tap targets, without adding application controls.
- runFlow:
    when:
      visible:
        id: setup-goal-input
    commands:
      - tapOn:
          id: setup-kicker
- runFlow:
    when:
      visible:
        id: reflection-input
    commands:
      - tapOn:
          id: reflect-question
- runFlow:
    when:
      visible:
        id: journal-search-input
    commands:
      - tapOn:
          id: journal-title
