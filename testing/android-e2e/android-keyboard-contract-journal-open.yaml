appId: com.nf404.twinkler
tags:
  - prepared
---
# Геометрия проверяется хостовым runner после остановки драйвера Maestro.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: start-prayer-button
- tapOn:
    id: setup-examples-button
- tapOn:
    id: setup-example-0
- tapOn:
    id: setup-preset-0
- tapOn:
    id: setup-next-button
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
- longPressOn:
    id: threshold-hold-button
- assertVisible:
    id: session-title
- tapOn:
    id: session-finish-button
- tapOn:
    id: reflect-complete-button
- assertVisible:
    id: home-title-lit
- tapOn:
    id: journal-button
- tapOn:
    id: journal-search-input
- runFlow:
    when:
      true: ${KEYBOARD_MODE != 'hardware'}
    commands:
      - inputText: "Keyboard matrix journal"
      - assertVisible:
          id: journal-keyboard-dismiss
- assertVisible:
    id: journal-search-input
