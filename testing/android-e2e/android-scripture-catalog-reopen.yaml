appId: com.nf404.twinkler
tags:
  - prepared
---
# SCR-013 on Android, phase 2 of 4. The database probe after the failure phase
# runs `am instrument`, which stops the app, so the prayer from phase 1 is gone.
# With catalog=fail still set, a cold start must keep the English interface
# saved in phase 1, and a new prayer must again show the catalog error. The
# recovery phase continues this prayer; the runner runs no probe in between.
- launchApp:
    stopApp: true
    clearState: false
- assertVisible: ".*Begin prayer.*"
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: SCR-013 catalog recovery
- pressKey: Enter
- tapOn:
    id: setup-preset-5
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: session-title
- tapOn:
    id: dock-scripture-tab
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-retry-button
    timeout: 30000
- assertVisible: ".*Bible catalog unavailable.*"
- assertNotVisible:
    id: scripture-audio-button
