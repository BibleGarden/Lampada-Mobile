appId: com.nf404.twinkler
tags:
  - prepared
---
# Продолжение open-фазы: без launch/clearState, чтобы проверить сохранность.
# Enter ends editing with software or emulated hardware input.
- pressKey: Enter
- assertVisible:
    id: reflection-input
    text: '${KEYBOARD_MODE == "hardware" ? "Matrix_hardware" : "Keyboard matrix reflect"}'
- assertVisible:
    id: reflect-return-button
- tapOn:
    id: reflect-complete-button
- assertVisible:
    id: home-title-lit
- tapOn:
    id: journal-button
- assertVisible: '${KEYBOARD_MODE == "hardware" ? ".*Matrix_hardware.*" : ".*Keyboard matrix reflect.*"}'
