          retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 9000
- tapOn:
    id: session-finish-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: reflect-complete-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: home-title-lit
- assertVisible:
    id: journal-button
- tapOn:
    id: journal-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible: .*END-003 double finish.*
- assertVisible: .*END-004 second prayer.*
- takeScreenshot: END-003-004-two-prayers-one-day
