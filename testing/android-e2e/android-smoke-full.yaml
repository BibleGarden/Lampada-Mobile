appId: app.lampada
tags:
  - critical
---
# The keyboard is dismissed by tapping outside the field (helpers/dismiss-keyboard.yaml),
# not with `hideKeyboard`: on iOS 26.5 / Maestro 2.6.1 the latter closes it with a
# downward swipe and dismisses the prayer setup sheet along with the keyboard.
# The same trick is used in testing/e2e/ios-lock-*.yaml.
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- inputText: "Финальный smoke"
- runFlow: helpers/dismiss-keyboard.yaml
- assertVisible: "Финальный smoke"
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible: ".*5 минут.*финальный smoke.*"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 450
- assertVisible:
    id: "threshold-hold-button"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
- assertVisible:
    id: "dock-answer-button"
- tapOn:
    id: "dock-answer-button"
- assertVisible:
    id: "answer-input"
- tapOn:
    id: "answer-input"
- inputText: "Финальный ответ"
# The sheet's buttons are visible even with the keyboard open; no need to dismiss it separately.
- tapOn:
    id: "answer-save-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-answer_context"
    commands:
      - tapOn:
          id: "privacy-consent-answer_context-allow"
- assertVisible:
    id: "dock-answer-edit-button"
- tapOn:
    id: "session-finish-button"
- assertVisible:
    id: "reflect-kicker"
- tapOn:
    id: "reflection-input"
- inputText: "Финальный вывод"
- runFlow: helpers/dismiss-keyboard.yaml
- tapOn:
    id: "reflect-complete-button"
- assertVisible:
    id: "home-title-lit"
# The takeaway quote is no longer shown on Home (ADR-0028: finishing lands
# directly on Home); its presence is checked below in the journal and in smoke-full-relaunch.
- assertVisible:
    id: "journal-button"
- tapOn:
    id: "journal-button"
- assertVisible:
    id: "journal-title"
- assertVisible: ".*Финальный smoke.*"
- tapOn: ".*Финальный smoke.*"
- assertVisible: ".*Финальный ответ.*"
- assertVisible: ".*Финальный вывод.*"
