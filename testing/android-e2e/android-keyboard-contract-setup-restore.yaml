appId: com.nf404.twinkler
tags:
  - prepared
---
# Продолжение open-фазы: без launch/clearState, чтобы проверить сохранность.
- runFlow:
    when:
      true: ${KEYBOARD_MODE != 'hardware'}
    commands:
      # Enter must close the IME and restore actions without a second tap.
      - pressKey: Enter
- assertVisible:
    id: setup-goal-input
    text: '${KEYBOARD_MODE == "hardware" ? "Matrix_hardware" : "Keyboard matrix setup"}'
- assertVisible:
    id: setup-duration-value
- assertVisible:
    id: setup-next-button
