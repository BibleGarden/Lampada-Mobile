appId: com.nf404.twinkler
tags:
  - main
---
# Android counterpart of ios-stage03-long-goal.yaml; native selectors and untimed fixtures.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: SETUP-004
- assertVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- assertNotVisible:
    id: setup-next-button
- assertNotVisible:
    id: setup-duration-value
- assertVisible:
    id: setup-kicker
- tapOn:
    id: setup-goal-input
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- inputText: " very long prayer goal with multiple clauses and repeated context
    for layout verification. This text must remain editable while the keyboard
    is open and must not cover the primary action. Second paragraph equivalent
    with more content for threshold and session rendering. Third segment adds
    enough characters to exceed three display lines safely."
- assertVisible:
    id: setup-kicker
- assertVisible:
    id: setup-goal-input
    below:
      id: setup-examples-button
    above:
      id: com.google.android.inputmethod.latin:id/keyboard_holder
- tapOn:
    id: setup-kicker
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- assertVisible:
    id: setup-goal-input
    text: SETUP-004 very long prayer goal with multiple clauses and repeated context
      for layout verification. This text must remain editable while the keyboard
      is open and must not cover the primary action. Second paragraph equivalent
      with more content for threshold and session rendering. Third segment adds
      enough characters to exceed three display lines safely.
- assertVisible: ДЛИТЕЛЬНОСТЬ
- takeScreenshot: SETUP-004-actions-after-keyboard
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- assertVisible:
    id: threshold-kicker
- assertVisible: .*SETUP-004 very long prayer goal.*
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: session-title
- assertVisible: .*SETUP-004 very long prayer goal.*
