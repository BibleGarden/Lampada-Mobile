appId: com.nf404.twinkler
tags:
  - main
---
# Android counterpart of ios-ans-032-recordings-keyboard.yaml; native selectors and untimed fixtures.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      microphone: allow
      notifications: allow
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: Записи и клавиатура
- tapOn:
    id: setup-kicker
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-preset-0
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: session-title
- tapOn:
    id: dock-answer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: answer-record-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: recordings-stop-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: recording-card-0
- tapOn:
    id: recording-play-0
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: recording-play-0
    text: Пауза, запись 1
- tapOn:
    id: recording-play-0
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: recording-play-0
    text: Прослушать запись 1
- tapOn:
    id: recordings-close-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible:
    id: recordings-close-button
- assertVisible:
    id: answer-save-button
- tapOn:
    id: answer-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: "3217x"
- assertVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- tapOn:
    id: answer-input
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
# Unicode inputText переключает IME Maestro и теряет фокус RN.
# Кириллицу вводим настоящей клавишей Gboard, сохраняя пользовательский путь.
- tapOn:
    id: com.google.android.inputmethod.latin:id/key_pos_1_3
    text: "а"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: answer-input
    text: 3217xа
    above:
      id: com.google.android.inputmethod.latin:id/keyboard_holder
- assertVisible:
    id: answer-save-button
    above:
      id: com.google.android.inputmethod.latin:id/keyboard_holder
- tapOn:
    id: answer-question
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- assertVisible:
    id: answer-input
    text: 3217xа
- tapOn:
    id: answer-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: "b"
- assertVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- tapOn:
    id: answer-sheet-handle
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible:
    id: com.google.android.inputmethod.latin:id/keyboard_holder
- assertVisible:
    id: answer-input
    text: 3217xаb
- tapOn:
    point: 50%,20%
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: answer-input
    text: 3217xаb
- tapOn:
    id: answer-record-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: recording-card-0
- assertVisible:
    id: recordings-record-button
- tapOn:
    id: recording-play-0
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: recording-play-0
    text: Пауза, запись 1
- tapOn:
    id: recording-play-0
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: recording-play-0
    text: Прослушать запись 1
- tapOn:
    id: recordings-close-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertNotVisible:
    id: recordings-close-button
- assertVisible:
    id: answer-input
    text: 3217xаb
- tapOn:
    id: answer-save-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-answer_context
    commands:
      - tapOn:
          id: privacy-consent-answer_context-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- tapOn:
    id: dock-answer-edit-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: answer-input
    text: 3217xаb
- assertVisible:
    id: answer-record-badge
