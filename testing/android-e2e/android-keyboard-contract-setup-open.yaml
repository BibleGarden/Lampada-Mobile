appId: com.nf404.twinkler
tags:
  - prepared
---
# Геометрия проверяется хостовым runner после остановки драйвера Maestro.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: start-prayer-button
- tapOn:
    id: setup-goal-input
- runFlow:
    when:
      true: ${KEYBOARD_MODE != 'hardware'}
    commands:
      - inputText: "Keyboard matrix setup"
      - assertNotVisible:
          id: setup-next-button
