appId: app.lampada
tags:
  - prepared
---
# Geometry is verified by the host runner after the Maestro driver stops.
- launchApp:
    stopApp: true
    clearState: true
- tapOn:
    id: start-prayer-button
- tapOn:
    id: setup-goal-input
- runFlow:
    when:
      true: ${KEYBOARD_MODE != 'hardware'}
    commands:
      - inputText: "Keyboard matrix setup"
      - assertNotVisible:
          id: setup-next-button
