---
# Android counterpart of ios-scripture-default-language.yaml; native selectors and untimed fixtures.
- launchApp:
    clearState: true
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: settings-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible: .*Русский.*
- assertVisible: .*BTI.*
- assertVisible: .*Никита Семёнов-Прозоровский.*
