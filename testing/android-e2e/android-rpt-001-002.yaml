appId: com.nf404.twinkler
tags:
  - prepared
---
# Android-версия управляемого сценария ios-rpt-001-002.yaml.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: RPT content reports
- pressKey: Enter
- tapOn:
    id: setup-preset-5
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: session-title
- tapOn:
    id: question-report-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: content-report-dialog
- takeScreenshot: RPT-001-dialog
- tapOn:
    id: content-report-send
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible: Спасибо. Жалоба отправлена на проверку.
- takeScreenshot: RPT-001-sent
- tapOn:
    id: content-report-done
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: dock-scripture-tab
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-report-button
    timeout: 20000
- takeScreenshot: RPT-002-scripture-card
- tapOn:
    id: scripture-report-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: content-report-dialog
- tapOn:
    id: content-report-comment
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: Тестовый комментарий RPT-002
- tapOn:
    id: content-report-send
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible: Спасибо. Жалоба отправлена на проверку.
- takeScreenshot: RPT-002-sent
- tapOn:
    id: content-report-done
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: scripture-read-full
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-reader-close
    timeout: 10000
- assertNotVisible:
    id: scripture-report-button
    rightOf:
      id: scripture-reader-favorite.*
    leftOf:
      id: scripture-reader-close
- tapOn:
    id: scripture-reader-close
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
