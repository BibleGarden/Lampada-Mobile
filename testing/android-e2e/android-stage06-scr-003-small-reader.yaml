appId: com.nf404.twinkler
tags:
  - main
---
# Выбираем длинный отрывок по доступности раскрытия, а не по его номеру.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      notifications: allow
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: SCR-003 long reader
- pressKey: Enter
- tapOn:
    id: setup-preset-0
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- tapOn:
    id: dock-scripture-tab
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-audio-button
    timeout: 20000
- repeat:
    times: 12
    while:
      notVisible:
        id: scripture-read-full
    commands:
      - tapOn:
          id: dock-scripture-next
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: scripture-audio-button
          timeout: 20000
- assertVisible:
    id: scripture-read-full
- tapOn:
    id: scripture-read-full
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- takeScreenshot: SCR-003-small-reader-top
- swipe:
    start: 50%,78%
    end: 50%,30%
    duration: 800
- takeScreenshot: SCR-003-small-reader-bottom
