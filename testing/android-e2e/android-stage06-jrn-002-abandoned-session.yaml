appId: com.nf404.twinkler
tags:
  - main
---
# Android counterpart of ios-stage06-jrn-002-abandoned-session.yaml; native selectors and untimed fixtures.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: JRN-002 брошенная сессия
- runFlow: helpers/dismiss-keyboard.yaml
- tapOn:
    id: setup-preset-0
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: session-title
- takeScreenshot: JRN-002-session-started
- stopApp
- launchApp:
    stopApp: false
    clearState: false
    permissions:
      notifications: allow
      microphone: allow
- assertVisible:
    id: start-prayer-button
- tapOn:
    id: journal-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: journal-title
- assertVisible:
    id: journal-empty-state
- assertNotVisible: JRN-002 брошенная сессия
- takeScreenshot: JRN-002-journal-after-abandon
