appId: app.lampada
tags:
  - prepared
---
# Continuation of the open phase: no launch/clearState, to verify persistence.
- runFlow:
    when:
      true: ${KEYBOARD_MODE != 'hardware'}
    commands:
      - tapOn:
          id: journal-title
- assertVisible:
    id: journal-search-input
    text: '${KEYBOARD_MODE == "hardware" ? "Matrix_hardware" : "Keyboard matrix journal"}'
- assertVisible:
    id: journal-clear-search
- tapOn:
    id: journal-clear-search
- assertNotVisible:
    id: journal-clear-search
