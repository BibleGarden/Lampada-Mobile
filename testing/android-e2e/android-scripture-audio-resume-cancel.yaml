appId: com.nf404.twinkler
tags:
  - rare
---
# Android counterpart of ios-scripture-audio-resume-cancel.yaml; native selectors and untimed fixtures.
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      notifications: allow
      microphone: allow
- tapOn:
    id: start-prayer-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-goal-input
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- inputText: Отмена продолжения аудио Писания
- runFlow: helpers/dismiss-keyboard.yaml
- tapOn:
    id: setup-preset-0
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: setup-next-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- longPressOn:
    id: threshold-hold-button
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: session-title
- tapOn:
    id: dock-scripture-tab
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-audio-label-idle
    timeout: 15000
- tapOn:
    id: scripture-audio-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-audio-label-playing
    timeout: 15000
- tapOn:
    id: scripture-audio-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: scripture-audio-label-paused
- tapOn:
    id: scripture-audio-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: dock-question-tab
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: dock-answer-button
- tapOn:
    id: dock-scripture-tab
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: scripture-audio-label-idle
- tapOn:
    id: scripture-audio-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-audio-label-playing
    timeout: 15000
- tapOn:
    id: scripture-audio-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    id: scripture-audio-label-paused
- tapOn:
    id: scripture-audio-button
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: dock-scripture-next
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: scripture-audio-label-idle
    timeout: 15000
