appId: app.lampada
tags:
  - prepared
---
# Before running, enable floating mode in the Samsung keyboard.
# The scenario does not clear data on the personal phone.
- launchApp:
    stopApp: true
- tapOn:
    id: "start-prayer-button"
- tapOn:
    id: "setup-goal-input"
- assertVisible:
    id: "setup-kicker"
- assertNotVisible:
    id: "setup-duration-value"
- assertNotVisible:
    id: "setup-next-button"
- inputText: "Floating keyboard layout"
- assertVisible: "Floating keyboard layout"
- assertNotVisible:
    id: "setup-duration-value"
- assertNotVisible:
    id: "setup-next-button"
- hideKeyboard
- assertVisible: "Floating keyboard layout"
- assertVisible:
    id: "setup-duration-value"
- assertVisible:
    id: "setup-next-button"
