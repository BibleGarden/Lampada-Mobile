appId: app.lampada
tags:
  - prepared
---
# Continuation of the open phase: no launch/clearState, to verify persistence.
- runFlow:
    when:
      true: ${KEYBOARD_MODE != 'hardware'}
    commands:
      - tapOn:
          id: answer-sheet-handle
- assertVisible:
    id: answer-input
    text: '${KEYBOARD_MODE == "hardware" ? "Matrix_hardware" : "Keyboard matrix answer"}'
- tapOn:
    id: answer-save-button
- runFlow:
    when:
      visible:
        id: privacy-consent-answer_context-allow
    commands:
      - tapOn:
          id: privacy-consent-answer_context-allow
- assertVisible:
    id: dock-answer-edit-button
- tapOn:
    id: dock-answer-edit-button
- assertVisible:
    id: answer-input
    text: '${KEYBOARD_MODE == "hardware" ? "Matrix_hardware" : "Keyboard matrix answer"}'
