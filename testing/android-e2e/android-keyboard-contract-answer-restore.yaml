appId: com.nf404.twinkler
tags:
  - prepared
---
# Продолжение open-фазы: без launch/clearState, чтобы проверить сохранность.
- runFlow:
    when:
      true: ${KEYBOARD_MODE != 'hardware'}
    commands:
      - tapOn:
          id: answer-keyboard-dismiss
- assertVisible:
    id: answer-input
    text: '${KEYBOARD_MODE == "hardware" ? "Matrix_hardware" : "Keyboard matrix answer"}'
- tapOn:
    id: answer-save-button
- runFlow:
    when:
      visible:
        id: privacy-consent-answer_context-allow
    commands:
      - tapOn:
          id: privacy-consent-answer_context-allow
- assertVisible:
    id: dock-answer-edit-button
- tapOn:
    id: dock-answer-edit-button
- assertVisible:
    id: answer-input
    text: '${KEYBOARD_MODE == "hardware" ? "Matrix_hardware" : "Keyboard matrix answer"}'
