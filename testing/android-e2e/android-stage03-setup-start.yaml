appId: app.lampada
tags:
  - critical
---
- launchApp:
    stopApp: true
    clearState: true
- assertVisible:
    id: "start-prayer-button"
- tapOn:
    id: "start-prayer-button"
# The number and the unit form a single accessibility element: VoiceOver reads them as one phrase
- assertVisible:
    id: "setup-duration-value"
    text: "10 минут"
- tapOn:
    id: "setup-examples-button"
- assertVisible:
    id: "setup-example-0"
- tapOn:
    id: "setup-example-0"
- assertVisible: "Поблагодарить Бога"
- tapOn:
    id: "setup-examples-button"
- tapOn:
    id: "setup-example-1"
- assertVisible: "Привести мысли в порядок"
- tapOn:
    id: "setup-examples-button"
- tapOn:
    id: "setup-example-2"
- assertVisible: "Принять важное решение"
- tapOn:
    id: "setup-examples-button"
- tapOn:
    id: "setup-example-3"
- assertVisible: "Подготовиться к разговору"
# Target the editor, not the same-named item in the closing examples list.
- assertVisible:
    id: "setup-goal-input"
- tapOn:
    id: "setup-goal-input"
# Right of the short first-row topic: the cursor ends up after the text, not in the middle.
- tapOn:
    point: "90%,32%"
- eraseText: 100
- pressKey: Enter
- assertNotVisible: "Подготовиться к разговору|к разговору"
- tapOn:
    id: "setup-preset-5"
- assertVisible:
    id: "setup-duration-value"
    text: "5 минут"
- tapOn:
    id: "setup-preset-15"
- assertVisible:
    id: "setup-duration-value"
    text: "15 минут"
- tapOn:
    id: "setup-preset-30"
- assertVisible:
    id: "setup-duration-value"
    text: "30 минут"
- tapOn:
    id: "setup-preset-60"
- assertVisible:
    id: "setup-duration-value"
    text: "60 минут"
- tapOn:
    id: "setup-preset-0"
- assertVisible:
    id: "setup-duration-value"
    text: "без таймера"
- tapOn:
    id: "setup-preset-5"
- tapOn:
    id: "setup-next-button"
- runFlow:
    when:
      visible:
        id: "privacy-consent-core_prayer_ai"
    commands:
      - tapOn:
          id: "privacy-consent-core_prayer_ai-allow"
- assertVisible: ".*Впереди — 5 минут наедине с Богом.*"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 450
- assertVisible:
    id: "threshold-hold-button"
- swipe:
    start: "50%,78%"
    end: "50%,78%"
    duration: 1700
- assertVisible:
    id: "session-title"
# VoiceOver reads the goal kicker and topic as a single phrase
- assertVisible:
    text: ".*Свободная молитва — без конкретной темы"
    childOf:
      id: "session-goal"
