appId: twinkler
---
# Preview screen "reflect": the reflect screen after a prayer, with the
# "Return to prayer" and complete buttons. The path to it is the one of
# testing/*/*-keyboard-contract-reflect-open.yaml, without the keyboard.
- launchApp:
    stopApp: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: start-prayer-button
    timeout: 60000
# The real test server can answer the version check with a soft "Update
# available" sheet a few seconds after launch; it covers the app. Dismiss it.
- extendedWaitUntil:
    visible:
      id: update-later
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: update-later
    commands:
      - tapOn:
          id: update-later
- tapOn:
    id: start-prayer-button
- tapOn:
    id: setup-examples-button
- tapOn:
    id: setup-example-0
- tapOn:
    id: setup-preset-0
- tapOn:
    id: setup-next-button
- runFlow:
    when:
      visible:
        id: privacy-consent-core_prayer_ai
    commands:
      - tapOn:
          id: privacy-consent-core_prayer_ai-allow
- longPressOn:
    id: threshold-hold-button
- assertVisible:
    id: session-title
- tapOn:
    id: session-finish-button
- extendedWaitUntil:
    visible:
      id: reflect-kicker
    timeout: 30000
- assertVisible:
    id: reflect-return-button
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: reflect
