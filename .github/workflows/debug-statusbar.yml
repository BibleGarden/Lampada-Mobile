name: Debug status bar
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  bar:
    if: ${{ github.event.label.name == 'debug-statusbar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B]
        n: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: bash tooling/scripts/preview/install-maestro.sh
      - run: bash tooling/scripts/preview/android-emulator.sh "$PWD/tooling" "$PWD/out/logs"
      - env:
          VARIANT: ${{ matrix.variant }}
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p out/bar
          adb shell cmd uimode night yes
          adb shell am start -a android.settings.SETTINGS >/dev/null
          sleep 8
          adb exec-out screencap -p > out/bar/shot-0-real.png
          b() { adb shell am broadcast -a com.android.systemui.demo -e command "$@" >/dev/null; }
          for i in 1 2 3; do
            adb shell settings put global sysui_demo_allowed 1
            b enter; b clock -e hhmm 0941
            b battery -e level 100 -e plugged false -e powersave false
            b network -e wifi show -e level 4 -e fully true
            if [ "$VARIANT" = A ]; then
              b network -e mobile hide
            else
              b network -e mobile show -e datatype none -e level 4 -e fully true -e sims 1 -e nosim hide
            fi
            b network -e airplane hide
            b notifications -e visible false
            sleep 3
            adb exec-out screencap -p > out/bar/shot-$i.png
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bar-${{ matrix.variant }}-${{ matrix.n }}
          path: out/bar
