name: Debug status bar
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  bar:
    if: ${{ github.event.label.name == 'debug-statusbar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: bash tooling/scripts/preview/install-maestro.sh
      - run: bash tooling/scripts/preview/android-emulator.sh "$PWD/tooling" "$PWD/out/logs"
      - run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p out/bar
          for i in 1 2 3; do
            adb exec-out screencap -p > out/bar/shot-$i.png
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml out/bar/ui-$i.xml >/dev/null 2>&1 || true
            echo "--- state $i"; grep -o 'content-desc="[^"]*"' out/bar/ui-$i.xml | grep -i -E "wi-?fi|mobile|signal|battery|airplane|sim|data" | sort | uniq -c || true
            bash tooling/scripts/preview/android-status-bar.sh emulator-5554
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bar-${{ matrix.n }}
          path: out/bar
