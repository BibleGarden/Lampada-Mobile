name: Debug emulator
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  emulator:
    if: ${{ github.event.label.name == 'debug-emulator' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: bash tooling/scripts/preview/install-maestro.sh
      - run: bash tooling/scripts/preview/android-emulator.sh "$PWD/tooling" "$PWD/out/logs"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-logs
          path: out/logs
      - if: always()
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb devices; adb shell wm size; adb shell wm density; adb shell getprop ro.product.cpu.abi; adb shell cat /proc/loadavg
          tail -5 out/logs/guest-boot.log || true
