name: Preview screenshots

# Before/after screenshots of a pull request from an Android emulator and an
# iOS simulator, posted on the pull request. On demand only. See
# testing/README.md, "Preview screenshots in CI", and ADR-0045.
#
# Security model (the repository is public and this workflow builds PR code):
#   - It starts only by a maintainer: workflow_dispatch needs write access and a
#     label needs triage access. There is no pull_request_target, issue_comment
#     or push trigger. Pull requests from forks are refused.
#   - Only the build and capture jobs touch PR code. They have a read-only
#     GITHUB_TOKEN; the build secrets are exposed only to the native build
#     steps of the build jobs. The capture jobs have no secrets.
#   - Only the "publish" job has write permissions. It checks out no code, runs
#     no PR code and treats the screenshot artifacts as untrusted data.
#
# Build and capture are separate jobs. A build job produces the app (the
# simulator .app, the x86_64 APK) and stores it in the Actions cache under an
# app key (scripts/preview/app-key.sh), so a commit that was already built with
# the same toolchain, scripts and build secrets is not built again. The capture
# jobs restore the app from that cache and run the flows in parallel chunks. The
# app is not passed as a workflow artifact: it bundles the EXPO_PUBLIC_* secret
# values and artifacts of a public repository can be downloaded by anyone who
# is signed in. See ADR-0045 for the cache scoping.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the pull request to preview
        required: true
        type: string
      screens:
        description: "Screens and flows to capture, comma or space separated (see testing/README.md), e.g. reflect"
        required: true
        default: reflect
        type: string
  pull_request:
    types: [labeled]

permissions: {}

# A newer request for the same pull request replaces a running preview. Runs
# started by any other label get a group of their own (they only skip), so
# adding an unrelated label never cancels a preview.
concurrency:
  group: preview-screenshots-${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'preview-screenshots') && (github.event.pull_request.number || inputs.pr) || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'preview-screenshots' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.plan.outputs.pr }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      screens: ${{ steps.plan.outputs.screens }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      android_chunks: ${{ steps.plan.outputs.android_chunks }}
      ios_chunks: ${{ steps.plan.outputs.ios_chunks }}
      env_hash: ${{ steps.secrets.outputs.env_hash }}
    steps:
      # No checkout: this job runs only the script below, never PR code.
      - name: Resolve the pull request and the screens
        id: plan
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const fail = (message) => core.setFailed(message);

            // Where the request comes from.
            let target;
            let screensText;
            if (context.eventName === 'workflow_dispatch') {
              const inputs = context.payload.inputs;
              target = Number(String(inputs.pr).replace(/^#/, ''));
              screensText = String(inputs.screens);
            } else {
              const labeled = context.payload.pull_request;
              const body = labeled.body || '';
              const targetLine = body.match(/^[ \t]*Preview target:[ \t]*#?(\d+)[ \t]*$/im);
              const screensLine = body.match(/^[ \t]*Preview screens:[ \t]*(.+?)[ \t]*$/im);
              if (!screensLine) {
                return fail(`PR #${labeled.number} has no "Preview screens:" line in its description. Add for example "Preview screens: reflect" and set the label again.`);
              }
              target = targetLine ? Number(targetLine[1]) : labeled.number;
              screensText = screensLine[1];
            }
            if (!Number.isInteger(target) || target <= 0) return fail('The pull request number is not valid.');

            // The target pull request: open, same repository (no forks).
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: target });
            if (pr.state !== 'open') return fail(`PR #${target} is not open.`);
            if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}` || pr.head.repo.fork) {
              return fail(`PR #${target} comes from a fork. Previews build PR code with repository secrets, so only branches of ${owner}/${repo} are accepted.`);
            }

            // "Before" is the commit the PR branched from, so only the PR's own changes show.
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${pr.base.sha}...${pr.head.sha}`,
            });
            const base = comparison.merge_base_commit.sha;

            // The screens: names of testing/preview/<name>.<platform>.yaml or flow paths.
            const tokens = screensText.split(/[\s,]+/).filter(Boolean);
            if (tokens.length === 0 || tokens.length > 8) return fail('Name from 1 to 8 screens or flows.');
            for (const token of tokens) {
              const name = /^[a-z0-9][a-z0-9-]*$/.test(token);
              const path = /^testing\/[A-Za-z0-9._\/-]+\.ya?ml$/.test(token)
                && !token.includes('..') && !token.includes('//')
                && /^(android|ios)-/.test(token.split('/').pop());
              if (!name && !path) {
                return fail(`Invalid screen or flow "${token}". Use a screen name such as "reflect", or a path testing/.../android-name.yaml or testing/.../ios-name.yaml.`);
              }
            }
            const platformOf = (token) => (token.includes('/') ? token.split('/').pop().split('-')[0] : null);

            // The capture jobs run in parallel chunks: one screen or flow per
            // chunk, at most four chunks per platform and variant (each chunk
            // boots its own emulator or simulator), the rest shared round-robin.
            const chunksOf = (platform) => {
              const mine = tokens.filter((t) => platformOf(t) === null || platformOf(t) === platform);
              const chunks = Array.from({ length: Math.min(mine.length, 4) }, (_, id) => ({ id: String(id), list: [] }));
              mine.forEach((token, index) => chunks[index % chunks.length].list.push(token));
              return chunks.map((chunk) => ({ id: chunk.id, screens: chunk.list.join(' ') }));
            };
            const androidChunks = chunksOf('android');
            const iosChunks = chunksOf('ios');
            const android = androidChunks.length > 0;
            const ios = iosChunks.length > 0;

            core.setOutput('pr', String(target));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_sha', base);
            core.setOutput('screens', tokens.join(' '));
            core.setOutput('android', String(android));
            core.setOutput('ios', String(ios));
            // A job that is skipped still needs a valid matrix.
            const placeholder = [{ id: '0', screens: '' }];
            core.setOutput('android_chunks', JSON.stringify(android ? androidChunks : placeholder));
            core.setOutput('ios_chunks', JSON.stringify(ios ? iosChunks : placeholder));
            await core.summary
              .addHeading(`Preview of PR #${target}`, 3)
              .addRaw(`Before: \`${base}\` (merge base). After: \`${pr.head.sha}\`. Screens: \`${tokens.join(' ')}\`.`, true)
              .write();

      - name: Check the build secrets and hash them for the cache key
        id: secrets
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AI_PROXY_KEY: ${{ secrets.EXPO_PUBLIC_AI_PROXY_KEY }}
        run: |
          missing=0
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_AI_PROXY_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret $name::The repository secret $name is not set, so the app cannot be built. A repository admin adds it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          # The values are baked into the app, so they belong in the app cache
          # key, but only as one hash over all of them (the proxy key is not
          # guessable, so the API URL cannot be recovered from the hash). Add
          # a name here when the app bakes in another secret EXPO_PUBLIC_* value.
          hash="$(printf 'preview-env v1\n%s\n%s\n' "$EXPO_PUBLIC_API_URL" "$EXPO_PUBLIC_AI_PROXY_KEY" | sha256sum | cut -c1-32)"
          echo "env_hash=$hash" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android ${{ matrix.variant }}
    needs: plan
    if: ${{ needs.plan.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    # One output per variant: the outputs of a matrix job are merged by name.
    outputs:
      before: ${{ steps.key.outputs.before }}
      after: ${{ steps.key.outputs.after }}
    env:
      APP_SHA: ${{ matrix.variant == 'before' && needs.plan.outputs.base_sha || needs.plan.outputs.head_sha }}
    steps:
      - name: Check out the preview tooling (scripts and flows of this workflow run)
        uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false

      - name: Check out the app (${{ matrix.variant }})
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The keys are computed before any PR code runs and are step outputs, which
      # later steps cannot change.
      - name: Compute the cache keys
        id: key
        env:
          ENV_HASH: ${{ needs.plan.outputs.env_hash }}
        run: bash tooling/scripts/preview/app-key.sh android "${{ matrix.variant }}" "$PWD/tooling" "$PWD/app" "$APP_SHA" "$ENV_HASH" >> "$GITHUB_OUTPUT"

      - name: Look for the app in the cache
        id: app
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/preview-app
          key: ${{ steps.key.outputs.app_key }}
          lookup-only: true

      - name: Report the app cache
        run: |
          echo "App cache for ${{ matrix.variant }} (\`${APP_SHA:0:9}\`): ${{ steps.app.outputs.cache-hit == 'true' && '**hit**, the build is skipped' || '**miss**, the app is built' }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        if: ${{ steps.app.outputs.cache-hit != 'true' }}
        working-directory: app
        env:
          # A dropped connection (ECONNRESET) failed a run once; no secrets here.
          NPM_CONFIG_FETCH_RETRIES: 5
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 5000
        run: bash "$GITHUB_WORKSPACE/tooling/scripts/preview/phase.sh" npm-ci npm ci

      - name: Restore the Gradle caches
        id: gradle
        if: ${{ steps.app.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.key.outputs.gradle_key }}
          restore-keys: preview-gradle-android-

      - name: Build the x86_64 Release APK
        id: build
        if: ${{ steps.app.outputs.cache-hit != 'true' }}
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AI_PROXY_KEY: ${{ secrets.EXPO_PUBLIC_AI_PROXY_KEY }}
        run: bash tooling/scripts/preview/build-android.sh app "$PWD/tooling" "$RUNNER_TEMP/preview-app"

      - name: Save the Gradle caches
        if: ${{ !cancelled() && steps.app.outputs.cache-hit != 'true' && steps.gradle.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.key.outputs.gradle_key }}

      - name: Save the app in the cache
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/preview-app
          key: ${{ steps.key.outputs.app_key }}

      - name: Phase durations
        if: ${{ always() }}
        run: bash tooling/scripts/preview/phase-summary.sh "build android ${{ matrix.variant }}" >> "$GITHUB_STEP_SUMMARY"

  capture-android:
    name: Android ${{ matrix.variant }} ${{ matrix.chunk.screens }}
    needs: [plan, build-android]
    if: ${{ needs.plan.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
        chunk: ${{ fromJSON(needs.plan.outputs.android_chunks) }}
    env:
      SCREENS: ${{ matrix.chunk.screens }}
    steps:
      - name: Check out the preview tooling (scripts and flows of this workflow run)
        uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false

      - name: Check out the flows of the pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: flows
          sparse-checkout: testing
          persist-credentials: false

      - name: Restore the app from the cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/preview-app
          key: ${{ needs.build-android.outputs[matrix.variant] }}
          fail-on-cache-miss: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: bash tooling/scripts/preview/phase.sh maestro-install bash tooling/scripts/preview/install-maestro.sh

      - name: Start the emulator
        run: bash tooling/scripts/preview/phase.sh emulator-start bash tooling/scripts/preview/android-emulator.sh "$PWD/tooling" "$PWD/out/logs"

      - name: Capture screenshots on the emulator
        run: |
          # SCREENS holds validated tokens only (names and testing/ paths).
          # shellcheck disable=SC2086
          bash tooling/scripts/preview/phase.sh capture bash tooling/scripts/preview/android-capture.sh \
            "$RUNNER_TEMP/preview-app/app-release.apk" \
            "$PWD/tooling" "$PWD/flows" "$PWD/out" $SCREENS

      - name: Phase durations
        if: ${{ always() }}
        run: bash tooling/scripts/preview/phase-summary.sh "capture android ${{ matrix.variant }} ${{ matrix.chunk.screens }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-android-${{ matrix.variant }}-${{ matrix.chunk.id }}
          path: out/screens/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-android-${{ matrix.variant }}-${{ matrix.chunk.id }}
          path: out/logs
          if-no-files-found: ignore
          retention-days: 7

  build-ios:
    name: Build iOS ${{ matrix.variant }}
    needs: plan
    if: ${{ needs.plan.outputs.ios == 'true' }}
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    # One output per variant: the outputs of a matrix job are merged by name.
    outputs:
      before: ${{ steps.key.outputs.before }}
      after: ${{ steps.key.outputs.after }}
    env:
      APP_SHA: ${{ matrix.variant == 'before' && needs.plan.outputs.base_sha || needs.plan.outputs.head_sha }}
    steps:
      - name: Check out the preview tooling (scripts and flows of this workflow run)
        uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false

      - name: Check out the app (${{ matrix.variant }})
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The keys are computed before any PR code runs and are step outputs, which
      # later steps cannot change.
      - name: Compute the cache keys
        id: key
        env:
          ENV_HASH: ${{ needs.plan.outputs.env_hash }}
        run: bash tooling/scripts/preview/app-key.sh ios "${{ matrix.variant }}" "$PWD/tooling" "$PWD/app" "$APP_SHA" "$ENV_HASH" >> "$GITHUB_OUTPUT"

      - name: Look for the app in the cache
        id: app
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/preview-app
          key: ${{ steps.key.outputs.app_key }}
          lookup-only: true

      - name: Report the app cache
        run: |
          echo "App cache for ${{ matrix.variant }} (\`${APP_SHA:0:9}\`): ${{ steps.app.outputs.cache-hit == 'true' && '**hit**, the build is skipped' || '**miss**, the app is built' }}." >> "$GITHUB_STEP_SUMMARY"

      # The simulator boots while the dependencies and the pods are installed.
      - name: Start booting the simulator
        if: ${{ steps.app.outputs.cache-hit != 'true' }}
        run: bash tooling/scripts/preview/ios-boot.sh "$PWD/tooling"

      - name: Install dependencies
        if: ${{ steps.app.outputs.cache-hit != 'true' }}
        working-directory: app
        env:
          # A dropped connection (ECONNRESET) failed a run once; no secrets here.
          NPM_CONFIG_FETCH_RETRIES: 5
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 5000
        run: bash "$GITHUB_WORKSPACE/tooling/scripts/preview/phase.sh" npm-ci npm ci

      - name: Generate the native project
        if: ${{ steps.app.outputs.cache-hit != 'true' }}
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AI_PROXY_KEY: ${{ secrets.EXPO_PUBLIC_AI_PROXY_KEY }}
        run: bash tooling/scripts/preview/ios-prebuild.sh "$PWD/app" "$PWD/tooling" "$PWD/out/logs"

      # The Podfile and its inputs are in the key, so a restored Pods folder
      # belongs to this Podfile; `pod install` then only confirms it.
      - name: Restore the CocoaPods
        id: pods
        if: ${{ steps.app.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            app/ios/Pods
            app/ios/Podfile.lock
          key: ${{ steps.key.outputs.deps_key }}-pods

      - name: Install the CocoaPods
        if: ${{ steps.app.outputs.cache-hit != 'true' }}
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AI_PROXY_KEY: ${{ secrets.EXPO_PUBLIC_AI_PROXY_KEY }}
        run: bash tooling/scripts/preview/ios-pods.sh "$PWD/app" "$PWD/tooling" "$PWD/out/logs"

      - name: Save the CocoaPods
        if: ${{ steps.app.outputs.cache-hit != 'true' && steps.pods.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            app/ios/Pods
            app/ios/Podfile.lock
          key: ${{ steps.key.outputs.deps_key }}-pods

      # Xcode's compilation cache is keyed by content, so an older cache is still
      # useful: take the newest one of this Podfile, else the newest one at all.
      - name: Restore the compilation cache
        id: cas
        if: ${{ steps.app.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/preview-xcode-cas
          key: preview-xcodecache-ios-${{ steps.key.outputs.deps_key }}
          restore-keys: preview-xcodecache-ios-

      - name: Build for the simulator
        id: build
        if: ${{ steps.app.outputs.cache-hit != 'true' }}
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AI_PROXY_KEY: ${{ secrets.EXPO_PUBLIC_AI_PROXY_KEY }}
        run: bash tooling/scripts/preview/ios-build.sh "$PWD/app" "$PWD/tooling" "$PWD/out/logs" "$RUNNER_TEMP/preview-app"

      # One entry per Podfile: a build of another commit with the same pods adds
      # nothing that is worth a second copy of the 0.7 GB.
      - name: Save the compilation cache
        if: ${{ !cancelled() && steps.app.outputs.cache-hit != 'true' && steps.cas.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/preview-xcode-cas
          key: preview-xcodecache-ios-${{ steps.key.outputs.deps_key }}

      - name: Save the app in the cache
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/preview-app
          key: ${{ steps.key.outputs.app_key }}

      - name: Phase durations
        if: ${{ always() }}
        run: |
          bash tooling/scripts/preview/phase-summary.sh "build ios ${{ matrix.variant }}" >> "$GITHUB_STEP_SUMMARY"
          for file in out/logs/compilation-cache.txt out/logs/build-timeline.txt; do
            [ -s "$file" ] || continue
            { echo "<details><summary>$(basename "$file")</summary>"; echo; echo '```'; cat "$file"; echo '```'; echo; echo '</details>'; echo; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-ios-${{ matrix.variant }}-build
          path: out/logs
          if-no-files-found: ignore
          retention-days: 7

  capture-ios:
    name: iOS ${{ matrix.variant }} ${{ matrix.chunk.screens }}
    needs: [plan, build-ios]
    if: ${{ needs.plan.outputs.ios == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
        chunk: ${{ fromJSON(needs.plan.outputs.ios_chunks) }}
    env:
      SCREENS: ${{ matrix.chunk.screens }}
    steps:
      - name: Check out the preview tooling (scripts and flows of this workflow run)
        uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false

      # The simulator boots while the app is restored and Maestro is installed.
      - name: Start booting the simulator
        run: bash tooling/scripts/preview/ios-boot.sh "$PWD/tooling"

      - name: Check out the flows of the pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: flows
          sparse-checkout: testing
          persist-credentials: false

      - name: Restore the app from the cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/preview-app
          key: ${{ needs.build-ios.outputs[matrix.variant] }}
          fail-on-cache-miss: true

      - name: Install Maestro
        run: bash tooling/scripts/preview/phase.sh maestro-install bash tooling/scripts/preview/install-maestro.sh

      - name: Capture screenshots on the simulator
        run: |
          # SCREENS holds validated tokens only (names and testing/ paths).
          # shellcheck disable=SC2086
          bash tooling/scripts/preview/phase.sh capture bash tooling/scripts/preview/ios-capture.sh \
            "$PWD/tooling" "$PWD/flows" "$PWD/out" "$RUNNER_TEMP/preview-app" $SCREENS

      - name: Phase durations
        if: ${{ always() }}
        run: bash tooling/scripts/preview/phase-summary.sh "capture ios ${{ matrix.variant }} ${{ matrix.chunk.screens }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-ios-${{ matrix.variant }}-${{ matrix.chunk.id }}
          path: out/screens/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-ios-${{ matrix.variant }}-${{ matrix.chunk.id }}
          path: out/logs
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish to the pull request
    needs: [plan, build-android, capture-android, build-ios, capture-ios]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job with write access. It checks out no code and runs no PR code.
    permissions:
      contents: write # the preview-images branch
      pull-requests: write # the comment and the label
    concurrency:
      group: preview-images-publish
      cancel-in-progress: false
    env:
      TARGET_PR: ${{ needs.plan.outputs.pr }}
      HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
      BASE_SHA: ${{ needs.plan.outputs.base_sha }}
      SCREENS: ${{ needs.plan.outputs.screens }}
      ANDROID_REQUESTED: ${{ needs.plan.outputs.android }}
      ANDROID_BUILD_RESULT: ${{ needs.build-android.result }}
      ANDROID_CAPTURE_RESULT: ${{ needs.capture-android.result }}
      IOS_REQUESTED: ${{ needs.plan.outputs.ios }}
      IOS_BUILD_RESULT: ${{ needs.build-ios.result }}
      IOS_CAPTURE_RESULT: ${{ needs.capture-ios.result }}
    steps:
      - name: Download the screenshots
        uses: actions/download-artifact@v8
        with:
          pattern: screens-*
          path: incoming
          # A failed job leaves no artifact; that is reported in the comment.

      - name: Validate the screenshots
        # The files come from jobs that ran PR code: treat them as untrusted.
        # Keep only regular PNG files with plain names, in the artifacts of the
        # capture jobs (screens-<platform>-<variant>-<chunk>), merged into one
        # folder per platform and variant.
        run: |
          set -euo pipefail
          mkdir -p validated
          count=0
          for path in incoming/screens-*; do
            [ -d "$path" ] && [ ! -L "$path" ] || continue
            dir="$(basename "$path")"
            [[ "$dir" =~ ^screens-(android|ios)-(before|after)-[0-9]$ ]] || { echo "Skipping $dir: unexpected artifact name"; continue; }
            target="screens-${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
            mkdir -p "validated/$target"
            for file in "$path"/*; do
              [ -e "$file" ] || continue
              name="$(basename "$file")"
              [ -f "$file" ] && [ ! -L "$file" ] || { echo "Skipping $name: not a regular file"; continue; }
              [[ "$name" =~ ^[A-Za-z0-9._-]{1,80}\.png$ ]] || { echo "Skipping $name: unexpected name"; continue; }
              [ "$(stat -c %s "$file")" -le 10485760 ] || { echo "Skipping $name: larger than 10 MiB"; continue; }
              [ "$(head -c 8 "$file" | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a ] || { echo "Skipping $name: not a PNG"; continue; }
              [ ! -e "validated/$target/$name" ] || { echo "Skipping $name: already taken from another chunk"; continue; }
              [ "$count" -lt 40 ] || { echo "Skipping $name: more than 40 screenshots"; continue; }
              cp "$file" "validated/$target/$name"
              count=$((count + 1))
            done
          done
          echo "Validated $count screenshots."

      - name: Publish the images to the preview-images branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [ -d validated ] && [ -n "$(find validated -name '*.png' -print -quit)" ] || { echo 'No screenshots to publish.'; exit 0; }
          dest="pr-$TARGET_PR/run-$RUN_ID-$RUN_ATTEMPT"
          git init -q publish
          cd publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/$REPOSITORY.git"
          if git fetch -q --depth=1 origin preview-images; then
            git checkout -q -f FETCH_HEAD
          fi
          # One root commit: the old tree is kept, its history is not.
          git checkout -q --orphan next
          mkdir -p "$dest"
          cp -R ../validated/. "$dest/"
          # Keep the 40 newest runs: the branch holds a single commit, so older
          # images disappear from the repository, not only from the tree.
          ls -d pr-*/run-* | sort -t- -k3,3n -k4,4n -r | tail -n +41 | xargs -r rm -rf
          git add -A
          git commit -q -m "Preview images of PR #$TARGET_PR, run $RUN_ID"
          git push -q --force origin next:refs/heads/preview-images
          echo "DEST=$dest" >> "$GITHUB_ENV"

      - name: Comment on the pull request
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const target = Number(process.env.TARGET_PR);
            const dest = process.env.DEST;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const rawBase = `https://raw.githubusercontent.com/${owner}/${repo}/preview-images/${dest}`;
            const short = (sha) => sha.slice(0, 9);

            const list = (dir) => (fs.existsSync(dir) ? fs.readdirSync(dir).filter((n) => n.endsWith('.png')).sort() : []);
            const stem = (file) => file.replace(/\.png$/, '');
            const image = (platform, variant, file) => (file
              ? `<img src="${rawBase}/screens-${platform}-${variant}/${file}" width="260" alt="${platform} ${variant} ${stem(file)}">`
              : '_no screenshot_');
            // A platform that was not requested is skipped; a failed build
            // leaves nothing to capture, so its result is the build's.
            const resultOf = (requested, build, capture) => (requested !== 'true' ? 'skipped' : build !== 'success' ? `${build} (build)` : capture);
            const results = {
              android: resultOf(process.env.ANDROID_REQUESTED, process.env.ANDROID_BUILD_RESULT, process.env.ANDROID_CAPTURE_RESULT),
              ios: resultOf(process.env.IOS_REQUESTED, process.env.IOS_BUILD_RESULT, process.env.IOS_CAPTURE_RESULT),
            };
            const label = { android: 'Android emulator (Pixel, API 35, 1280x2856)', ios: 'iOS simulator (iPhone 17 Pro)' };

            let body = '<!-- preview-screenshots -->\n';
            body += `### Preview screenshots\n\nBefore: \`${short(process.env.BASE_SHA)}\` (merge base). After: \`${short(process.env.HEAD_SHA)}\` (PR head). Screens: \`${process.env.SCREENS}\`. [Workflow run](${runUrl}).\n`;
            let any = false;
            for (const platform of ['android', 'ios']) {
              if (results[platform] === 'skipped') continue;
              const before = list(`validated/screens-${platform}-before`);
              const after = list(`validated/screens-${platform}-after`);
              body += `\n#### ${label[platform]}\n\n`;
              const names = [...new Set([...before.map(stem), ...after.map(stem)])].sort();
              if (names.length === 0) {
                body += `No screenshots: the ${platform} job ended with "${results[platform]}". See the run for logs.\n`;
                continue;
              }
              any = true;
              body += '| Screen | Before | After |\n| --- | --- | --- |\n';
              for (const name of names) {
                body += `| \`${name}\` | ${image(platform, 'before', before.find((f) => stem(f) === name))} | ${image(platform, 'after', after.find((f) => stem(f) === name))} |\n`;
              }
              if (results[platform] !== 'success') {
                body += `\n:warning: The ${platform} jobs ended with "${results[platform]}"; some screenshots may be missing. See the run for logs.\n`;
              }
            }
            body += '\nThe screenshots are also attached to the workflow run as artifacts. They are evidence for the owner\'s visual approval, not the approval.\n';

            // Update the previous preview comment of the workflow, if any.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: target, per_page: 100 });
            const previous = comments.find((c) => c.user.login === 'github-actions[bot]' && c.body.startsWith('<!-- preview-screenshots -->'));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: target, body });
            }
            await core.summary.addRaw(body, true).write();
            if (!any) core.setFailed('No screenshots were produced.');

      - name: Consume the label
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                name: 'preview-screenshots',
              });
            } catch (error) {
              core.info(`Label was already removed: ${error.message}`);
            }
